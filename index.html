<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AR Buddha Statue</title>

<style>
html,body{margin:0;overflow:hidden;background:#000;font-family:serif}
canvas{width:100%;height:100%;display:block}

#ui{
  position:fixed;inset:0;display:flex;
  align-items:center;justify-content:center;
  flex-direction:column;color:#ffdca8;
  background:radial-gradient(circle,#1a1200,#000);
  z-index:10;
}

button{
  padding:14px 28px;border-radius:30px;
  border:1px solid #ffcc88;
  background:#221100;color:#ffdca8;
  font-size:16px;cursor:pointer;
}

#hud{
  position:fixed;inset:0;display:none;
  z-index:5;pointer-events:none;
}

#place{
  position:absolute;bottom:40px;left:50%;
  transform:translateX(-50%);
  pointer-events:auto;
}
</style>
</head>

<body>

<div id="ui">
  <h1>🪷 AR Buddha Statue</h1>
  <p>Place a sacred Buddha statue in your space</p>
  <button onclick="startAR()">Enter AR</button>
</div>

<div id="hud">
  <button id="place" onclick="place()">Place Statue</button>
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/loaders/GLTFLoader.js"></script>

<script>

let scene, camera, renderer;
let xrSession, hitSource;
let reticle;
let hitMatrix = new THREE.Matrix4();
let hitFound = false;
let placed = false;

let buddha;

const BUDDHA_MODEL =
"https://modelviewer.dev/shared-assets/models/Astronaut.glb"; // safe fallback model

function initScene(){

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 100);

  renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById("c"),
    alpha:true,
    antialias:true
  });

  renderer.setSize(innerWidth,innerHeight);
  renderer.xr.enabled = true;

  scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1.6));

  const geo = new THREE.RingGeometry(0.05,0.09,32).rotateX(-Math.PI/2);
  reticle = new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0xffcc66}));
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);
}

function loadBuddha(){

  return new Promise(res=>{

    const loader = new THREE.GLTFLoader();

    loader.load(BUDDHA_MODEL,(gltf)=>{

      const obj = gltf.scene;

      // scale
      const box = new THREE.Box3().setFromObject(obj);
      const size = new THREE.Vector3();
      box.getSize(size);

      const s = 0.5 / Math.max(size.x,size.y,size.z);
      obj.scale.setScalar(s);

      // place on ground
      const box2 = new THREE.Box3().setFromObject(obj);
      obj.position.y -= box2.min.y;

      const group = new THREE.Group();
      group.add(obj);
      group.visible = true;

      scene.add(group);
      res(group);

    },undefined,()=>{

      // fallback statue (gold block)
      const m = new THREE.Mesh(
        new THREE.CylinderGeometry(0.15,0.2,0.5,32),
        new THREE.MeshStandardMaterial({color:0xd4af37})
      );

      const g = new THREE.Group();
      g.add(m);
      g.visible = true;
      scene.add(g);

      res(g);
    });

  });
}

async function startAR(){

  if(!navigator.xr){
    alert("WebXR not supported");
    return;
  }

  initScene();
  buddha = await loadBuddha();

  xrSession = await navigator.xr.requestSession("immersive-ar",{
    requiredFeatures:["hit-test"],
    optionalFeatures:["dom-overlay"],
    domOverlay:{root:document.getElementById("hud")}
  });

  document.getElementById("ui").style.display="none";
  document.getElementById("hud").style.display="block";

  renderer.xr.setReferenceSpaceType("local");
  await renderer.xr.setSession(xrSession);

  const viewer = await xrSession.requestReferenceSpace("viewer");
  hitSource = await xrSession.requestHitTestSource({space:viewer});

  renderer.setAnimationLoop(onFrame);
}

function onFrame(t,frame){

  if(!frame) return;

  const refSpace = renderer.xr.getReferenceSpace();
  const hits = frame.getHitTestResults(hitSource);

  if(hits.length>0 && !placed){

    const pose = hits[0].getPose(refSpace);

    hitMatrix.fromArray(new Float32Array(pose.transform.matrix));

    reticle.visible = true;
    reticle.matrix.copy(hitMatrix);

    hitFound = true;
  } else {
    reticle.visible = false;
  }

  renderer.render(scene,camera);
}

function place(){

  if(!hitFound) return;

  placed = true;

  const pos = new THREE.Vector3()
    .setFromMatrixPosition(hitMatrix);

  buddha.position.set(pos.x,pos.y,pos.z);
  reticle.visible = false;
}

</script>

</body>
</html>
