<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>AR Vesak City</title>

<style>
body { margin: 0; overflow: hidden; background: #000; }
#overlay { position: absolute; left: 10px; top: 10px; color: #fff; z-index: 2; }
#loading { position: fixed; inset: 0; display:flex; align-items:center; justify-content:center; background:#000; color:#fff; z-index:10; }
</style>
</head>

<body>

<div id="loading">Loading Vesak AR City...</div>
<div id="overlay">Tap AR → tap surface to place</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.150.1/build/three.module.js';
import { ARButton } from 'https://unpkg.com/three@0.150.1/examples/jsm/webxr/ARButton.js';
import { GLTFLoader } from 'https://unpkg.com/three@0.150.1/examples/jsm/loaders/GLTFLoader.js';

let camera, scene, renderer;
let controller, reticle;
let hitTestSource = null;
let hitTestSourceRequested = false;
let world = null;

const loader = new GLTFLoader();
const flyingLanterns = [];
const pathLights = [];
const particleGroups = [];

init();
animate();

function init(){

  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);

  // 🔥 Lighting (important for GLB models)
  scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));
  scene.add(new THREE.AmbientLight(0xffffff, 0.8));

  // Reticle
  reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI/2),
    new THREE.MeshBasicMaterial({ color: 0x00ffcc })
  );
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  controller = renderer.xr.getController(0);
  controller.addEventListener('select', onSelect);
  scene.add(controller);

  document.body.appendChild(
    ARButton.createButton(renderer, {
      requiredFeatures: ['hit-test']
    })
  );

  window.addEventListener('resize', onResize);
  window.addEventListener('load', ()=> setTimeout(()=> loading.style.display='none', 800));
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// 📍 PLACE SCENE
function onSelect(){
  if (!reticle.visible || world) return;

  world = new THREE.Group();
  world.position.setFromMatrixPosition(reticle.matrix);
  scene.add(world);

  buildWorld(world);
}

// 🌍 BUILD YOUR VESAK WORLD
function buildWorld(parent){

  addGround(parent);

  addTemple(parent, 4, 0, -6); // GLB
  addBuddha(parent, -4, 0, -6); // GLB

  addFlyingLanterns(parent, 14);
  addFireflyGlow(parent);
}

// 🛕 LOAD STUPA MODEL
function addTemple(parent, x, y, z){
  loader.load(
    'https://raw.githubusercontent.com/ThinukaVinjaya/vesakmodels/main/sthupa_srilanka.glb',
    (gltf)=>{
      const model = gltf.scene;
      model.position.set(x,y,z);
      model.scale.set(0.5,0.5,0.5);
      model.rotation.y = Math.PI;
      parent.add(model);
    }
  );
}

// 🧘 LOAD BUDDHA MODEL
function addBuddha(parent, x, y, z){
  loader.load(
    'https://raw.githubusercontent.com/ThinukaVinjaya/vesakmodels/main/stone_buddha_statue.glb',
    (gltf)=>{
      const model = gltf.scene;
      model.position.set(x,y,z);
      model.scale.set(0.6,0.6,0.6);
      parent.add(model);
    }
  );
}

// 🌱 GROUND
function addGround(parent){
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(12,12),
    new THREE.MeshStandardMaterial({ color:0x0f261a, roughness:1 })
  );
  ground.rotation.x = -Math.PI/2;
  parent.add(ground);
}

// 🏮 FLYING LANTERNS
function addFlyingLanterns(parent, count){
  for(let i=0;i<count;i++){
    const mesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.15,8,8),
      new THREE.MeshStandardMaterial({ color:0xffcc88, emissive:0xffaa33 })
    );
    mesh.position.set((Math.random()-0.5)*4,1,-Math.random()*6);
    mesh.userData = { speed:0.01 + Math.random()*0.02 };
    flyingLanterns.push(mesh);
    parent.add(mesh);
  }
}

// ✨ FIREFLIES
function addFireflyGlow(parent){
  const group = new THREE.Group();
  for(let i=0;i<20;i++){
    const f = new THREE.Mesh(
      new THREE.SphereGeometry(0.03,8,8),
      new THREE.MeshStandardMaterial({ color:0xffe7aa, emissive:0xffd680 })
    );
    f.position.set((Math.random()-0.5)*5, Math.random()*2, -Math.random()*5);
    group.add(f);
  }
  parent.add(group);
  particleGroups.push(group);
}

// 🔄 LOOP
function animate(){
  renderer.setAnimationLoop(render);
}

function render(timestamp, frame){

  if(frame){
    const session = renderer.xr.getSession();
    const refSpace = renderer.xr.getReferenceSpace();

    if(!hitTestSourceRequested){
      session.requestReferenceSpace('viewer').then(space=>{
        session.requestHitTestSource({ space }).then(src=>{
          hitTestSource = src;
        });
      });
      hitTestSourceRequested = true;
    }

    if(hitTestSource){
      const hits = frame.getHitTestResults(hitTestSource);
      if(hits.length){
        const pose = hits[0].getPose(refSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
      } else {
        reticle.visible = false;
      }
    }
  }

  // Animate lanterns
  flyingLanterns.forEach(l=>{
    l.position.y += l.userData.speed;
    if(l.position.y > 5) l.position.y = 1;
  });

  renderer.render(scene, camera);
}

</script>
</body>
</html>
