<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>AR Vesak City</title>

<style>
body { margin: 0; overflow: hidden; background: #000; }
#overlay { position: absolute; left: 10px; top: 10px; color: #fff; z-index: 2; }
#loading { position: fixed; inset: 0; display:flex; align-items:center; justify-content:center; background:#000; color:#fff; z-index:10; }
</style>
</head>

<body>

<div id="loading">Loading Vesak AR City...</div>
<div id="overlay">Tap AR → tap floor to place</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.150.1/build/three.module.js';
import { ARButton } from 'https://unpkg.com/three@0.150.1/examples/jsm/webxr/ARButton.js';

let camera, scene, renderer;
let controller, reticle;
let hitTestSource = null;
let hitTestSourceRequested = false;
let world = null;

init();
animate();

function init() {

  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 20);

  scene.add(new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1));

  // RETICLE
  reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI/2),
    new THREE.MeshBasicMaterial({ color: 0x00ffcc })
  );
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  controller = renderer.xr.getController(0);
  controller.addEventListener('select', onSelect);
  scene.add(controller);

  // ✅ ENABLE FLOOR + ANCHORS
  document.body.appendChild(
    ARButton.createButton(renderer, {
      requiredFeatures: ['hit-test','anchors'],
      optionalFeatures: ['local-floor']
    })
  );

  window.addEventListener('resize', onResize);
  window.addEventListener('load', ()=> setTimeout(()=> loading.style.display='none', 800));
}

function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// 👉 USER TAP
function onSelect() {
  if (!reticle.visible || world) return;

  const session = renderer.xr.getSession();
  const refSpace = renderer.xr.getReferenceSpace();

  const pos = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);

  // ✅ CREATE ANCHOR
  session.requestAnchor(
    new XRRigidTransform({ x: pos.x, y: pos.y, z: pos.z }),
    refSpace
  ).then(anchor => {

    world = new THREE.Group();
    world.userData.anchor = anchor;
    scene.add(world);

    buildWorld(world);

    document.getElementById("overlay").style.display = "none";
  });
}

// 🌍 BUILD SCENE
function buildWorld(parent){

  // FLOOR
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(10,10),
    new THREE.MeshStandardMaterial({ color:0x0f261a, roughness:1 })
  );
  ground.rotation.x = -Math.PI/2;
  parent.add(ground);

  // BUDDHA
  const buddha = new THREE.Mesh(
    new THREE.SphereGeometry(0.4, 16, 16),
    new THREE.MeshStandardMaterial({ color:0xf3e5ab })
  );
  buddha.position.set(0,0.5,-2);
  parent.add(buddha);

  // LOTUS PATH
  for(let i=0;i<10;i++){
    const lotus = new THREE.Mesh(
      new THREE.SphereGeometry(0.15,8,8),
      new THREE.MeshStandardMaterial({ color:0xff7fbf })
    );
    lotus.position.set( (i%2?1:-1), 0.05, -i*0.6 );
    parent.add(lotus);
  }

  // LIGHT
  const light = new THREE.PointLight(0xffcc88,1,5);
  light.position.set(0,2,0);
  parent.add(light);
}

// 🔄 ANIMATION LOOP
function animate(){
  renderer.setAnimationLoop(render);
}

function render(timestamp, frame){

  if(frame){

    const session = renderer.xr.getSession();
    const refSpace = renderer.xr.getReferenceSpace();

    // HIT TEST
    if(!hitTestSourceRequested){
      session.requestReferenceSpace('viewer').then(space=>{
        session.requestHitTestSource({ space }).then(src=>{
          hitTestSource = src;
        });
      });
      hitTestSourceRequested = true;
    }

    if(hitTestSource){
      const hits = frame.getHitTestResults(hitTestSource);
      if(hits.length){
        const pose = hits[0].getPose(refSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
      } else {
        reticle.visible = false;
      }
    }

    // ✅ UPDATE ANCHOR (STABLE POSITION)
    if(world && world.userData.anchor){
      const pose = frame.getPose(
        world.userData.anchor.anchorSpace,
        refSpace
      );
      if(pose){
        world.matrix.fromArray(pose.transform.matrix);
        world.matrix.decompose(world.position, world.quaternion, world.scale);
      }
    }
  }

  renderer.render(scene, camera);
}

</script>
</body>
</html>
