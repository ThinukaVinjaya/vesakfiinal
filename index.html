<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>AR Vesak City</title>
    <style>
      body { margin: 0; font-family: sans-serif; overflow: hidden; background: #000; }
      #overlay { position: absolute; left: 10px; top: 10px; z-index: 2; color: #fff; }
      #startHint { background: rgba(0,0,0,0.6); padding: 10px 14px; border-radius: 8px; font-size: 14px; line-height: 1.4; }
      canvas { display: block; width: 100vw; height: 100vh; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.8); color: #fff; font-family: Arial, sans-serif; z-index: 10; }
    </style>
  </head>
  <body>
    <div id="loading">Loading Vesak AR City... Please wait.</div>
    <div id="overlay"><div id="startHint">Tap the AR button, then tap the reticle to place your Vesak city.</div></div>
    <script type="module">
      import * as THREE from 'https://unpkg.com/three@0.150.1/build/three.module.js';
      import { ARButton } from 'https://unpkg.com/three@0.150.1/examples/jsm/webxr/ARButton.js';

      let camera, scene, renderer;
      let controller, reticle;
      let hitTestSource = null;
      let hitTestSourceRequested = false;
      let world = null;
      const flyingLanterns = [];
      const pathLights = [];
      const particleGroups = [];
      const forwardVector = new THREE.Vector3();

      init();
      animate();

      function init() {
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.domElement.style.position = 'absolute';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';
        renderer.domElement.style.width = '100%';
        renderer.domElement.style.height = '100%';
        renderer.xr.enabled = true;
        document.body.appendChild(renderer.domElement);

        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 20);

        const light = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1);
        light.position.set(0.5, 1, 0.25);
        scene.add(light);

        reticle = new THREE.Mesh(
          new THREE.RingGeometry(0.12, 0.16, 32).rotateX(-Math.PI / 2),
          new THREE.MeshBasicMaterial({ color: 0x00ffcc })
        );
        reticle.matrixAutoUpdate = false;
        reticle.visible = false;
        scene.add(reticle);

        controller = renderer.xr.getController(0);
        controller.addEventListener('select', onSelect);
        scene.add(controller);

        document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] }));

        window.addEventListener('resize', onWindowResize);
        window.addEventListener('orientationchange', onWindowResize);
        window.addEventListener('load', () => setTimeout(() => document.getElementById('loading').style.display = 'none', 600));
      }

      function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        if (renderer.domElement) {
          renderer.domElement.style.width = '100%';
          renderer.domElement.style.height = '100%';
        }
      }

      function onSelect() {
        if (!world) {
          placeScene();
        }
      }

      function placeScene() {
        world = new THREE.Group();
        if (reticle.visible) {
          world.position.setFromMatrixPosition(reticle.matrix);
          world.quaternion.setFromRotationMatrix(reticle.matrix);
        } else {
          camera.getWorldDirection(forwardVector);
          forwardVector.multiplyScalar(1.2);
          world.position.copy(camera.position).add(forwardVector);
          world.quaternion.copy(camera.quaternion);
        }
        scene.add(world);

        addLotusPath(world, 10, 2.7, 1.2);
        addLotusPath(world, 10, 5.2, 1.2, 0.4);
        addLotusClusters(world);
        addTemple(world, 4, 0, -6);
        addBuddha(world, -4, 0, -6);
        addPathLanterns(world);
        addGardenLights(world);
        addFlyingLanterns(world, 14);
        addFireflyGlow(world);

        document.getElementById('startHint').style.display = 'none';
      }

      function addLotusPath(parent, count, xOffset, spacing, radius = 0.4) {
        for (let i = 0; i < count; i++) {
          const z = -i * spacing - 1.2;
          const scale = 0.5 + Math.random() * 0.4;
          const flower = createLotusFlower(scale);
          flower.position.set(xOffset, 0.02, z + (Math.random() - 0.5) * 0.2);
          flower.rotation.y = Math.random() * Math.PI * 2;
          parent.add(flower);
        }
      }

      function createLotusFlower(size = 1) {
        const group = new THREE.Group();
        const petalMat = new THREE.MeshStandardMaterial({ color: 0xff7fbf, roughness: 0.6, metalness: 0.1 });
        for (let i = 0; i < 8; i++) {
          const petal = new THREE.Mesh(new THREE.ConeGeometry(0.15 * size, 0.5 * size, 6), petalMat);
          petal.position.y = 0.12 * size;
          petal.rotation.x = Math.PI / 2;
          petal.rotation.z = (i / 8) * Math.PI * 2;
          petal.scale.set(1, 1, 0.4);
          group.add(petal);
        }
        const center = new THREE.Mesh(new THREE.SphereGeometry(0.12 * size, 8, 8), new THREE.MeshStandardMaterial({ color: 0xffe070 }));
        center.position.y = 0.08 * size;
        group.add(center);
        return group;
      }

      function addTemple(parent, x, y, z) {
        const temple = new THREE.Group();
        temple.position.set(x, y, z);

        const base = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.4, 2.8), new THREE.MeshStandardMaterial({ color: 0x7b4a20, roughness: 0.8 }));
        base.position.y = 0.2;
        temple.add(base);

        const body = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.1, 2.2), new THREE.MeshStandardMaterial({ color: 0xe0c39a }));
        body.position.y = 0.85;
        temple.add(body);

        const roof1 = new THREE.Mesh(new THREE.ConeGeometry(1.4, 0.7, 4), new THREE.MeshStandardMaterial({ color: 0x8b0000 }));
        roof1.position.y = 1.7;
        roof1.rotation.y = Math.PI / 4;
        temple.add(roof1);

        const roof2 = new THREE.Mesh(new THREE.ConeGeometry(1.1, 0.5, 4), new THREE.MeshStandardMaterial({ color: 0xaa0000 }));
        roof2.position.y = 2.15;
        roof2.rotation.y = Math.PI / 4;
        temple.add(roof2);

        const pillarMat = new THREE.MeshStandardMaterial({ color: 0xf0e0c0 });
        for (let px of [-0.7, 0.7]) {
          for (let pz of [-0.8, 0.8]) {
            const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 1.2, 8), pillarMat);
            pillar.position.set(px, 0.9, pz);
            temple.add(pillar);
          }
        }

        parent.add(temple);
      }

      function addBuddha(parent, x, y, z) {
        const buddha = new THREE.Group();
        buddha.position.set(x, y, z);

        const pedestal = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.9, 0.28, 16), new THREE.MeshStandardMaterial({ color: 0x6d4b3b }));
        pedestal.position.y = 0.14;
        buddha.add(pedestal);

        const body = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 12), new THREE.MeshStandardMaterial({ color: 0xf3e5ab }));
        body.position.y = 0.8;
        buddha.add(body);

        const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 12, 10), new THREE.MeshStandardMaterial({ color: 0xf5e7c0 }));
        head.position.y = 1.45;
        buddha.add(head);

        const halo = new THREE.Mesh(new THREE.RingGeometry(0.32, 0.42, 32), new THREE.MeshBasicMaterial({ color: 0xffdd66, side: THREE.DoubleSide }));
        halo.position.y = 1.9;
        halo.rotation.x = -0.2;
        buddha.add(halo);

        parent.add(buddha);
      }

      function addPathLanterns(parent) {
        const lanternPositions = [ -2, 2, -1.4, 1.4, -2.6, 2.6, -1, 1 ];
        let z = -2;
        for (let i = 0; i < 10; i++) {
          const side = lanternPositions[i % lanternPositions.length];
          const lantern = createLantern();
          lantern.position.set(side, 0.5, z);
          parent.add(lantern);

          const pole = new THREE.Mesh(
            new THREE.CylinderGeometry(0.04, 0.05, 2.2, 8),
            new THREE.MeshStandardMaterial({ color: 0x613f27, roughness: 0.85 })
          );
          pole.position.set(side, 1.1, z);
          parent.add(pole);

          pathLights.push({ light: lantern.children.find(obj => obj.type === 'PointLight'), phase: Math.random() * Math.PI * 2 });
          z -= 1.7;
        }
      }

      function createLantern() {
        const group = new THREE.Group();
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, 0.38, 12), new THREE.MeshStandardMaterial({ color: 0xff6633, emissive: 0xff9933, emissiveIntensity: 0.8, transparent: true, opacity: 0.92 }));
        group.add(body);
        const top = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.16, 12), new THREE.MeshStandardMaterial({ color: 0xcc3300 }));
        top.position.y = 0.27;
        group.add(top);
        const bottom = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.14, 12), new THREE.MeshStandardMaterial({ color: 0xcc3300 }));
        bottom.position.y = -0.27;
        bottom.rotation.x = Math.PI;
        group.add(bottom);

        const glow = new THREE.PointLight(0xffb060, 0.8, 3);
        group.add(glow);

        return group;
      }

      function addFlyingLanterns(parent, count) {
        for (let i = 0; i < count; i++) {
          const lantern = createSkyLantern();
          lantern.position.set((Math.random() - 0.5) * 5, 0.6 + Math.random() * 0.4, -2 - Math.random() * 6);
          lantern.userData = {
            speed: 0.014 + Math.random() * 0.02,
            driftX: (Math.random() - 0.5) * 0.0016,
            driftZ: -0.0015 - Math.random() * 0.0011,
            phase: Math.random() * Math.PI * 2
          };
          flyingLanterns.push(lantern);
          parent.add(lantern);
        }
      }

      function createSkyLantern() {
        const group = new THREE.Group();
        const balloon = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 10), new THREE.MeshStandardMaterial({ color: 0xffeb99, emissive: 0xffd36b, emissiveIntensity: 1.2, transparent: true, opacity: 0.86 }));
        balloon.scale.set(1, 1.3, 1);
        group.add(balloon);
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.14, 0.02, 8, 24), new THREE.MeshStandardMaterial({ color: 0x7a4a2c }));
        ring.rotation.x = Math.PI / 2;
        ring.position.y = -0.24;
        group.add(ring);
        const flame = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.16, 8), new THREE.MeshStandardMaterial({ color: 0xffa533, emissive: 0xff7700, emissiveIntensity: 3 }));
        flame.position.y = -0.17;
        flame.rotation.x = Math.PI;
        group.add(flame);
        const light = new THREE.PointLight(0xffb060, 1.1, 4);
        group.add(light);

        // delicate string
        const stringGeo = new THREE.CylinderGeometry(0.005, 0.005, 0.4, 6);
        const stringMat = new THREE.MeshStandardMaterial({ color: 0x5a3c2a, roughness: 0.85 });
        const string = new THREE.Mesh(stringGeo, stringMat);
        string.position.y = -0.2;
        group.add(string);

        return group;
      }

      function addGround(parent) {
        const ground = new THREE.Mesh(
          new THREE.PlaneGeometry(16, 16),
          new THREE.MeshStandardMaterial({ color: 0x0f261a, roughness: 0.95, transparent: true, opacity: 0.88 })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        parent.add(ground);

        const path = new THREE.Mesh(
          new THREE.PlaneGeometry(4.8, 14),
          new THREE.MeshStandardMaterial({ color: 0xa77f4f, roughness: 0.82 })
        );
        path.rotation.x = -Math.PI / 2;
        path.position.set(0, 0.001, -4);
        parent.add(path);

        const edge = new THREE.Mesh(
          new THREE.PlaneGeometry(0.12, 14),
          new THREE.MeshStandardMaterial({ color: 0xf2d09c, roughness: 0.85 })
        );
        edge.rotation.x = -Math.PI / 2;
        edge.position.set(2.45, 0.002, -4);
        parent.add(edge);
        const edge2 = edge.clone();
        edge2.position.set(-2.45, 0.002, -4);
        parent.add(edge2);
      }

      function addLotusClusters(parent) {
        const positions = [
          [-1, 0, -9], [1, 0, -8], [-3, 0, -13], [3, 0, -12],
          [-1.8, 0, -3], [1.8, 0, -2], [-4.2, 0, -6], [4.2, 0, -6]
        ];
        positions.forEach(([x, y, z]) => {
          const cluster = new THREE.Group();
          const count = 3 + Math.floor(Math.random() * 3);
          for (let i = 0; i < count; i++) {
            const angle = (i / count) * Math.PI * 2;
            const petal = createLotusFlower(0.4 + Math.random() * 0.3);
            petal.position.set(Math.cos(angle) * 0.5, 0.02, Math.sin(angle) * 0.5);
            petal.rotation.y = Math.random() * Math.PI * 2;
            cluster.add(petal);
          }
          cluster.position.set(x, y, z);
          parent.add(cluster);
        });
      }

      function addGardenLights(parent) {
        const positions = [
          [-1.8, 0.4, -1.2], [1.8, 0.4, -1.2], [-3.2, 0.4, -5], [3.2, 0.4, -5]
        ];
        positions.forEach(([x, y, z]) => {
          const orb = new THREE.Mesh(
            new THREE.SphereGeometry(0.12, 10, 10),
            new THREE.MeshStandardMaterial({ color: 0xffd580, emissive: 0xffd150, emissiveIntensity: 0.9, transparent: true, opacity: 0.9 })
          );
          orb.position.set(x, y, z);
          parent.add(orb);
          const light = new THREE.PointLight(0xffd580, 0.7, 3);
          light.position.set(x, y, z);
          parent.add(light);
          pathLights.push({ light, phase: Math.random() * Math.PI * 2 });
        });
      }

      function addFireflyGlow(parent) {
        const group = new THREE.Group();
        for (let i = 0; i < 24; i++) {
          const firefly = new THREE.Mesh(
            new THREE.SphereGeometry(0.04, 8, 8),
            new THREE.MeshStandardMaterial({ color: 0xffe7aa, emissive: 0xffd680, emissiveIntensity: 1.2, transparent: true, opacity: 0.9 })
          );
          firefly.position.set((Math.random() - 0.5) * 6, 0.2 + Math.random() * 1.6, -1 - Math.random() * 8);
          group.add(firefly);
        }
        parent.add(group);
        particleGroups.push(group);
      }

      function animate() {
        renderer.setAnimationLoop(render);
      }

      function render(timestamp, frame) {
        if (frame) {
          const session = renderer.xr.getSession();
          const referenceSpace = renderer.xr.getReferenceSpace();
          if (!hitTestSourceRequested && session) {
            session.requestReferenceSpace('viewer').then((refSpace) => {
              session.requestHitTestSource({ space: refSpace }).then((source) => { hitTestSource = source; });
            });
            session.addEventListener('end', () => {
              hitTestSourceRequested = false;
              hitTestSource = null;
            });
            hitTestSourceRequested = true;
          }
          if (hitTestSource) {
            const hitTestResults = frame.getHitTestResults(hitTestSource);
            if (hitTestResults.length) {
              const hit = hitTestResults[0];
              const pose = hit.getPose(referenceSpace);
              reticle.visible = true;
              reticle.matrix.fromArray(pose.transform.matrix);
            } else {
              reticle.visible = false;
            }
          }
        }

        flyingLanterns.forEach((lantern) => {
          lantern.position.y += lantern.userData.speed;
          lantern.position.x += lantern.userData.driftX + Math.sin(timestamp * 0.001 + lantern.userData.phase) * 0.0007;
          lantern.position.z += lantern.userData.driftZ;
          lantern.rotation.y += 0.004;
          lantern.rotation.z = Math.sin(timestamp * 0.001 + lantern.userData.phase) * 0.05;
          if (lantern.position.y > 10) {
            lantern.position.y = 0.7;
            lantern.position.x = (Math.random() - 0.5) * 5;
            lantern.position.z = -2 - Math.random() * 10;
          }
        });

        pathLights.forEach(({ light, phase }) => {
          light.intensity = 0.6 + 0.25 * Math.sin(timestamp * 0.006 + phase);
          if (light.color) light.color.setHSL(0.09, 0.9, 0.55 + 0.12 * Math.sin(timestamp * 0.01 + phase));
        });

        particleGroups.forEach((group, index) => {
          group.children.forEach((pt, i) => {
            pt.position.y += 0.002 + 0.002 * index;
            pt.position.x += Math.sin(timestamp * 0.0007 + i) * 0.0007;
            if (pt.position.y > 2.8 + index * 0.5) pt.position.y = 0.2;
          });
        });

        renderer.render(scene, camera);
      }
    </script>
  </body>
</html>
