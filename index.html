<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Vesak AR</title>

<style>
html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:serif}
canvas{width:100%;height:100%;display:block}

#landing{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle,#1b1200,#000);
  color:#ffd780;text-align:center
}

button{
  padding:14px 30px;
  border-radius:30px;
  border:1px solid #ffcc66;
  background:#221100;
  color:#ffd780;
  font-size:16px;
  cursor:pointer;
}

#hud{
  position:fixed;inset:0;z-index:5;pointer-events:none;
  display:none;color:#ffd780
}

#placeBtn{
  position:absolute;bottom:40px;left:50%;transform:translateX(-50%);
  pointer-events:auto;
}

#exitBtn{
  position:absolute;top:20px;right:20px;
  pointer-events:auto;
}
</style>
</head>

<body>

<div id="landing">
  <h1>Vesak AR</h1>
  <p>Tap to enter AR</p>
  <button onclick="initAR()">Enter AR</button>
  <p id="err"></p>
</div>

<div id="hud">
  <button id="exitBtn" onclick="exitAR()">Exit</button>
  <button id="placeBtn" onclick="placeModels()">Place Models</button>
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/loaders/GLTFLoader.js"></script>

<script>
let scene, camera, renderer;
let xrSession;
let hitTestSource;
let reticle;
let lastHit = new THREE.Matrix4();
let hitFound = false;
let placed = false;

let buddha, stupa;

const BUDDHA_URL = "https://modelviewer.dev/shared-assets/models/Astronaut.glb";
const STUPA_URL  = "https://modelviewer.dev/shared-assets/models/Astronaut.glb";

function initScene(){

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 100);

  renderer = new THREE.WebGLRenderer({
    canvas: document.getElementById("c"),
    alpha:true,
    antialias:true
  });

  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true;

  scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1.5));

  // reticle
  const geo = new THREE.RingGeometry(0.05,0.08,32).rotateX(-Math.PI/2);
  reticle = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color:0xffcc66}));
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);
}

function loadGLB(url){
  return new Promise(res=>{
    const loader = new THREE.GLTFLoader();

    loader.load(url, gltf=>{

      const obj = gltf.scene;

      const box = new THREE.Box3().setFromObject(obj);
      const size = new THREE.Vector3();
      box.getSize(size);

      const scale = 0.4 / Math.max(size.x,size.y,size.z);
      obj.scale.setScalar(scale);

      const box2 = new THREE.Box3().setFromObject(obj);
      obj.position.y -= box2.min.y;

      const group = new THREE.Group();
      group.add(obj);

      group.visible = true;
      scene.add(group);

      res(group);

    },undefined,err=>{

      console.warn("GLB failed", err);

      const m = new THREE.Mesh(
        new THREE.BoxGeometry(0.2,0.2,0.2),
        new THREE.MeshStandardMaterial({color:0xffaa00})
      );

      const g = new THREE.Group();
      g.add(m);
      g.visible = true;

      scene.add(g);
      res(g);

    });
  });
}

async function initAR(){

  if(!navigator.xr){
    document.getElementById("err").innerText="WebXR not supported";
    return;
  }

  initScene();

  buddha = await loadGLB(BUDDHA_URL);
  stupa  = await loadGLB(STUPA_URL);

  xrSession = await navigator.xr.requestSession("immersive-ar",{
    requiredFeatures:["hit-test"],
    optionalFeatures:["dom-overlay"],
    domOverlay:{root:document.getElementById("hud")}
  });

  document.getElementById("landing").style.display="none";
  document.getElementById("hud").style.display="block";

  renderer.xr.setReferenceSpaceType("local");
  await renderer.xr.setSession(xrSession);

  const viewer = await xrSession.requestReferenceSpace("viewer");
  hitTestSource = await xrSession.requestHitTestSource({space:viewer});

  renderer.setAnimationLoop(onFrame);
}

function onFrame(t, frame){

  if(!frame) return;

  const refSpace = renderer.xr.getReferenceSpace();
  const hits = frame.getHitTestResults(hitTestSource);

  if(hits.length>0 && !placed){
    const pose = hits[0].getPose(refSpace);

    lastHit.fromArray(new Float32Array(pose.transform.matrix));

    reticle.visible = true;
    reticle.matrix.copy(lastHit);

    hitFound = true;
  } else {
    reticle.visible = false;
  }

  renderer.render(scene,camera);
}

function placeModels(){

  if(!hitFound) return;

  placed = true;
  reticle.visible = false;

  const pos = new THREE.Vector3().setFromMatrixPosition(lastHit);

  buddha.position.set(pos.x-0.3,pos.y,pos.z);
  stupa.position.set(pos.x+0.3,pos.y,pos.z);
}

function exitAR(){
  if(xrSession) xrSession.end();
}

window.addEventListener("resize",()=>{
  renderer.setSize(innerWidth,innerHeight);
});
</script>

</body>
</html>
