<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>AR Vesak City</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">

    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      body { overflow:hidden; background:#000; font-family:sans-serif; }

      /* ═══════════════════════════════════════════════════
         LOADING SCREEN — new design
      ═══════════════════════════════════════════════════ */
      :root {
        --gold: #ffc84a;
        --gold-dim: #c99520;
        --saffron: #ff9933;
        --ember: #ff6622;
        --deep: #0a0614;
        --mid: #130d22;
        --surface: #1c1230;
      }

      #loading {
        position: fixed; inset: 0; z-index: 20;
        background: var(--deep);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: 'Cinzel', serif;
      }

      /* Star field */
      #stars { position:absolute; inset:0; pointer-events:none; }

      /* Sky gradient */
      .sky-wash {
        position:absolute; inset:0;
        background: radial-gradient(ellipse at 50% 0%, #1a0a2e 0%, #0a0614 60%, #000 100%);
        pointer-events:none;
      }

      /* Horizon glow */
      .horizon {
        position:absolute; bottom:0; left:0; right:0; height:200px;
        background: linear-gradient(to top, #1a0a00 0%, #0a0614 50%, transparent 100%);
        pointer-events:none;
      }

      /* Flying lanterns SVG layer */
      #lantern-layer { position:absolute; inset:0; pointer-events:none; }

      /* Ground mandala */
      .mandala {
        position:absolute; bottom:-40px; left:50%; transform:translateX(-50%);
        width:340px; height:180px;
        background: radial-gradient(ellipse at 50% 100%, rgba(255,180,30,0.07) 0%, transparent 65%);
        pointer-events:none;
      }

      /* Main content */
      .load-content {
        position:relative; z-index:5;
        display:flex; flex-direction:column; align-items:center;
        gap:0; text-align:center; padding:32px 24px;
      }

      /* Lotus bloom SVG */
      .lotus-icon {
        width:72px; height:72px; margin-bottom:20px;
        animation: lotus-breathe 3s ease-in-out infinite;
      }

      @keyframes lotus-breathe {
        0%,100% { transform:scale(1) rotate(0deg); filter:drop-shadow(0 0 8px rgba(255,180,30,0.4)); }
        50%      { transform:scale(1.06) rotate(3deg); filter:drop-shadow(0 0 18px rgba(255,140,0,0.7)); }
      }

      /* Title */
      .brand {
        font-family:'Cinzel', serif;
        font-size:28px; font-weight:700;
        letter-spacing:3px;
        color: var(--gold);
        text-shadow: 0 0 30px rgba(255,200,74,0.5), 0 0 60px rgba(255,150,0,0.2);
        margin-bottom:4px;
        animation: title-glow 3s ease-in-out infinite;
      }

      @keyframes title-glow {
        0%,100% { text-shadow: 0 0 20px rgba(255,200,74,0.4); }
        50%      { text-shadow: 0 0 40px rgba(255,200,74,0.8), 0 0 80px rgba(255,100,0,0.3); }
      }

      .brand-sub {
        font-family:'Crimson Pro', Georgia, serif;
        font-size:12px; font-weight:300; font-style:italic;
        letter-spacing:5px; text-transform:uppercase;
        color: rgba(255,180,60,0.55);
        margin-bottom:28px;
      }

      /* Pali blessing */
      .pali {
        font-family:'Crimson Pro', Georgia, serif;
        font-size:14px; font-style:italic; font-weight:300;
        color:rgba(255,200,100,0.5);
        margin-bottom:22px;
        letter-spacing:1px;
      }

      /* Progress system */
      .prog-wrap { width:220px; margin-bottom:14px; }

      .prog-label {
        font-family:'Crimson Pro', Georgia, serif;
        font-size:13px; font-weight:300;
        color:rgba(255,200,100,0.7);
        margin-bottom:10px;
        letter-spacing:0.5px;
        min-height:18px;
        transition:opacity 0.3s;
      }

      .prog-track {
        height:3px;
        background:rgba(255,200,80,0.1);
        border-radius:2px;
        overflow:hidden;
        margin-bottom:8px;
        position:relative;
      }

      .prog-fill {
        height:100%;
        background: linear-gradient(90deg, var(--gold-dim), var(--gold), var(--saffron));
        border-radius:2px;
        width:0%;
        transition:width 0.5s cubic-bezier(0.4,0,0.2,1);
        position:relative;
        box-shadow: 0 0 8px rgba(255,180,0,0.6);
      }

      .prog-fill::after {
        content:'';
        position:absolute; right:0; top:-3px;
        width:6px; height:9px;
        background: white;
        border-radius:50%;
        box-shadow:0 0 10px rgba(255,200,100,0.9);
        opacity:0.9;
      }

      /* Dot indicators */
      .dots {
        display:flex; gap:8px; justify-content:center; margin-bottom:20px;
      }

      .dot {
        width:5px; height:5px; border-radius:50%;
        background:rgba(255,200,80,0.2);
        transition:all 0.4s ease;
      }

      .dot.done { background:var(--gold); box-shadow:0 0 6px rgba(255,180,0,0.8); }
      .dot.active { background:var(--saffron); box-shadow:0 0 10px rgba(255,120,0,0.9); transform:scale(1.4); }

      /* AR button area */
      .ar-hint-wrap {
        margin-top:4px;
        opacity:0;
        transform:translateY(10px);
        transition:opacity 0.6s ease, transform 0.6s ease;
      }

      .ar-hint-wrap.visible { opacity:1; transform:translateY(0); }

      .hint-text {
        font-family:'Crimson Pro', Georgia, serif;
        font-size:12px; font-weight:300; font-style:italic;
        color:rgba(255,200,100,0.5);
        margin-top:10px;
        letter-spacing:0.5px;
      }

      /* Separator ornament */
      .ornament {
        display:flex; align-items:center; gap:10px;
        margin-bottom:22px; opacity:0.4;
      }
      .ornament-line { flex:1; height:0.5px; background:linear-gradient(90deg, transparent, var(--gold-dim)); }
      .ornament-line.r { background:linear-gradient(90deg, var(--gold-dim), transparent); }
      .ornament-diamond { width:5px; height:5px; background:var(--gold); transform:rotate(45deg); }

      /* Error message */
      #errMsg {
        font-family:'Crimson Pro', Georgia, serif;
        font-size:12px; color:rgba(255,140,80,0.8);
        margin-top:8px; display:none; font-style:italic;
      }

      /* ═══════════════════════════════════════════════════
         AR HUD elements (shown after loading)
      ═══════════════════════════════════════════════════ */
      #statusBar {
        position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
        background:rgba(0,0,0,0.65); backdrop-filter:blur(8px);
        color:#fff; font-size:13px; padding:10px 20px; border-radius:24px;
        z-index:6; display:none; text-align:center;
        border:1px solid rgba(255,255,255,0.12); transition:opacity 0.4s;
        max-width:88vw; white-space:normal;
      }
      #ringWrap {
        position:fixed; bottom:26%; left:50%; transform:translateX(-50%);
        width:110px; height:110px; display:none; z-index:5; pointer-events:none;
      }
      #ringWrap svg { width:100%; height:100%; }
      #ringBg   { fill:none; stroke:rgba(255,255,255,0.12); stroke-width:5; }
      #ringFill { fill:none; stroke:#00ffcc; stroke-width:5; stroke-linecap:round;
                  stroke-dasharray:283; stroke-dashoffset:283;
                  transform:rotate(-90deg); transform-origin:50% 50%;
                  transition:stroke-dashoffset 0.25s ease; }
      #ringPct  { fill:#fff; font-size:18px; font-weight:600; text-anchor:middle; dominant-baseline:central; }

      #nightBadge {
        position:fixed; top:14px; right:14px;
        background:rgba(255,180,30,0.18); border:1px solid rgba(255,180,30,0.4);
        color:#ffc84a; font-size:12px; padding:5px 11px; border-radius:14px;
        z-index:7; display:none;
      }
      #placedTick {
        position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0);
        background:rgba(0,200,120,0.22); border:2px solid #00d484;
        border-radius:50%; width:72px; height:72px;
        display:flex; align-items:center; justify-content:center;
        color:#00d484; font-size:32px; z-index:8; pointer-events:none;
        transition:transform 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.5s; opacity:0;
      }

      /* Lantern & star animations */
      @keyframes star-twinkle {
        0%,100% { opacity:0.2; transform:scale(1); }
        50% { opacity:0.9; transform:scale(1.5); }
      }
      @keyframes lantern-rise {
        0% { transform:translateY(0) rotate(0deg); opacity:0.9; }
        80% { opacity:0.85; }
        100% { transform:translateY(-560px) rotate(8deg); opacity:0; }
      }
      @keyframes lantern-sway {
        0%,100% { transform:translateX(0); }
        50% { transform:translateX(var(--sw,8px)); }
      }
    </style>
  </head>
  <body>

    <!-- ═══════════════ LOADING SCREEN ═══════════════ -->
    <div id="loading">
      <div class="sky-wash"></div>
      <div id="stars"></div>
      <svg id="lantern-layer" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg"></svg>
      <div class="horizon"></div>
      <div class="mandala"></div>

      <div class="load-content">
        <!-- Lotus icon -->
        <svg class="lotus-icon" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="pg1" cx="50%" cy="80%" r="70%">
              <stop offset="0%" stop-color="#ff9933"/>
              <stop offset="100%" stop-color="#ffd580"/>
            </radialGradient>
            <radialGradient id="pg2" cx="50%" cy="80%" r="70%">
              <stop offset="0%" stop-color="#ffc84a"/>
              <stop offset="100%" stop-color="#ffe499"/>
            </radialGradient>
          </defs>
          <g transform="translate(36,42)">
            <ellipse cx="0" cy="-10" rx="8" ry="16" fill="url(#pg2)" opacity="0.9" transform="rotate(-40)"/>
            <ellipse cx="0" cy="-10" rx="8" ry="16" fill="url(#pg2)" opacity="0.9" transform="rotate(-20)"/>
            <ellipse cx="0" cy="-10" rx="8" ry="16" fill="url(#pg1)" opacity="0.95" transform="rotate(0)"/>
            <ellipse cx="0" cy="-10" rx="8" ry="16" fill="url(#pg2)" opacity="0.9" transform="rotate(20)"/>
            <ellipse cx="0" cy="-10" rx="8" ry="16" fill="url(#pg2)" opacity="0.9" transform="rotate(40)"/>
            <ellipse cx="0" cy="-8" rx="6" ry="13" fill="url(#pg1)" opacity="0.9" transform="rotate(-30)"/>
            <ellipse cx="0" cy="-8" rx="6" ry="13" fill="url(#pg1)" opacity="0.9" transform="rotate(-10)"/>
            <ellipse cx="0" cy="-8" rx="6" ry="13" fill="url(#pg1)" opacity="0.95" transform="rotate(10)"/>
            <ellipse cx="0" cy="-8" rx="6" ry="13" fill="url(#pg1)" opacity="0.9" transform="rotate(30)"/>
            <circle cx="0" cy="-2" r="7" fill="#ffc84a" opacity="0.95"/>
            <circle cx="0" cy="-2" r="4" fill="#ffe8a0" opacity="1"/>
            <ellipse cx="0" cy="8" rx="14" ry="5" fill="#0d0820" opacity="0.3"/>
          </g>
        </svg>

        <div class="brand">AR VESAK CITY</div>
        <div class="brand-sub">Augmented Reality · Vesak 2026</div>

        <div class="ornament">
          <div class="ornament-line"></div>
          <div class="ornament-diamond"></div>
          <div class="ornament-line r"></div>
        </div>

        <div class="pali">ශ්‍රද්ධා සම්පන්නං</div>

        <div class="prog-wrap">
          <div class="prog-label" id="progLabel">Initialising…</div>
          <div class="prog-track">
            <div class="prog-fill" id="progFill"></div>
          </div>
          <div id="errMsg"></div>
        </div>

        <div class="dots" id="dots">
          <div class="dot" id="d0"></div>
          <div class="dot" id="d1"></div>
          <div class="dot" id="d2"></div>
          <div class="dot" id="d3"></div>
          <div class="dot" id="d4"></div>
          <div class="dot" id="d5"></div>
        </div>

        <div class="ar-hint-wrap" id="arHintWrap">
          <div class="hint-text">Point your camera at the floor</div>
        </div>
      </div>
    </div>

    <!-- ═══════════════ AR HUD ═══════════════ -->
    <div id="ringWrap">
      <svg viewBox="0 0 100 100">
        <circle id="ringBg"   cx="50" cy="50" r="45"/>
        <circle id="ringFill" cx="50" cy="50" r="45"/>
        <text   id="ringPct"  x="50"  y="50">0%</text>
      </svg>
    </div>
    <div id="statusBar"></div>
    <div id="nightBadge">🌙 Night mode</div>
    <div id="placedTick">✓</div>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
      }
    }
    </script>

    <!-- Loading screen animations (stars + lanterns) -->
    <script>
    (function () {
      /* Stars */
      const starContainer = document.getElementById('stars');
      for (let i = 0; i < 80; i++) {
        const s = document.createElement('div');
        const size = Math.random() < 0.15 ? 2 : 1;
        Object.assign(s.style, {
          position: 'absolute',
          width: size + 'px', height: size + 'px',
          borderRadius: '50%',
          background: 'white',
          left: Math.random() * 100 + '%',
          top: Math.random() * 70 + '%',
          opacity: 0.2 + Math.random() * 0.6,
          animation: `star-twinkle ${2 + Math.random() * 3}s ${Math.random() * 3}s ease-in-out infinite`
        });
        starContainer.appendChild(s);
      }

      /* Flying lanterns */
      const svgLayer = document.getElementById('lantern-layer');
      const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
      defs.innerHTML = `<filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>`;
      svgLayer.insertBefore(defs, svgLayer.firstChild);

      const lanternData = [
        {x:100, dur:9,  delay:0,   sw:'-6px'},
        {x:200, dur:11, delay:2,   sw:'8px'},
        {x:320, dur:8,  delay:1,   sw:'5px'},
        {x:440, dur:12, delay:3,   sw:'-9px'},
        {x:550, dur:10, delay:0.5, sw:'7px'},
        {x:580, dur:14, delay:4,   sw:'-5px'},
        {x:80,  dur:13, delay:5,   sw:'10px'},
        {x:460, dur:9.5,delay:2.5, sw:'-7px'},
      ];

      lanternData.forEach(({ x, dur, delay, sw }) => {
        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        g.setAttribute('transform', `translate(${x},480)`);
        g.style.cssText = `animation: lantern-rise ${dur}s ${delay}s ease-in infinite;`;

        const swing = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        swing.style.cssText = `--sw:${sw}; animation: lantern-sway ${3 + Math.random() * 2}s ${Math.random() * 2}s ease-in-out infinite;`;

        const body = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
        body.setAttribute('cx','0'); body.setAttribute('cy','-18');
        body.setAttribute('rx','10'); body.setAttribute('ry','14');
        body.setAttribute('fill','rgba(255,200,80,0.85)');
        body.setAttribute('filter','url(#glow)');

        const ring = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
        ring.setAttribute('cx','0'); ring.setAttribute('cy','-4');
        ring.setAttribute('rx','10'); ring.setAttribute('ry','3');
        ring.setAttribute('fill','rgba(160,100,30,0.7)');

        const flame = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
        flame.setAttribute('cx','0'); flame.setAttribute('cy','-2');
        flame.setAttribute('rx','3'); flame.setAttribute('ry','4');
        flame.setAttribute('fill','rgba(255,120,0,0.9)');

        swing.appendChild(body); swing.appendChild(ring); swing.appendChild(flame);
        g.appendChild(swing);
        svgLayer.appendChild(g);
      });
    })();
    </script>

    <script type="module">
      import * as THREE   from 'three';
      import { ARButton } from 'three/addons/webxr/ARButton.js';
      import { GLTFLoader }  from 'three/addons/loaders/GLTFLoader.js';
      import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

      /* ── DOM ── */
      const elLoading   = document.getElementById('loading');
      const elProgLabel = document.getElementById('progLabel');
      const elProgFill  = document.getElementById('progFill');
      const elErrMsg    = document.getElementById('errMsg');
      const elStatus    = document.getElementById('statusBar');
      const elRing      = document.getElementById('ringWrap');
      const elRingFill  = document.getElementById('ringFill');
      const elRingPct   = document.getElementById('ringPct');
      const elNight     = document.getElementById('nightBadge');
      const elTick      = document.getElementById('placedTick');
      const elDots      = [0,1,2,3,4,5].map(i => document.getElementById('d'+i));
      const elArHint    = document.getElementById('arHintWrap');

      /* ── R2 model URLs ── */
      const R2 = 'https://pub-7cbad791f95e4c9680981f095fab45e1.r2.dev/';
      const MODELS = [
        { key:'buddha',       url: R2+'stone_buddha_statue.glb', label:'Buddha Statue'   },
        { key:'lotus1',       url: R2+'lotus1.glb',              label:'Lotus Flowers'   },
        { key:'lotus2',       url: R2+'lotus_flower2.glb',       label:'Lotus Flowers'   },
        { key:'lotusLantern', url: R2+'lotus_lanttern.glb',      label:'Lotus Lantern'   },
        { key:'vesakLantern', url: R2+'vesak_lanterns.glb',      label:'Vesak Lanterns'  },
        { key:'stupa',        url: R2+'sthupa_srilanka.glb',     label:'Sri Lanka Stupa' },
      ];

      // Label shown in the dot-step progress (matches MODELS order)
      const stepLabels = [
        'Loading Buddha Statue…',
        'Loading Lotus Flowers…',
        'Loading Lotus Flowers…',
        'Loading Lotus Lantern…',
        'Loading Vesak Lanterns…',
        'Loading Sri Lanka Stupa…',
      ];

      /* ── GLTF / DRACO loader ── */
      const draco = new DRACOLoader();
      draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.5/');
      const gltfLoader = new GLTFLoader();
      gltfLoader.setDRACOLoader(draco);

      const cache = {};

      /* ── Update dot-step UI ── */
      function updateDots(completedCount) {
        elDots.forEach((d, i) => {
          if (i < completedCount)       d.className = 'dot done';
          else if (i === completedCount) d.className = 'dot active';
          else                           d.className = 'dot';
        });
      }

      /* ── Parallel model loading ── */
      async function preload() {
        let done = 0;
        const total = MODELS.length;
        draco.preload();
        updateDots(0);
        elProgLabel.textContent = stepLabels[0];

        const jobs = MODELS.map(({ key, url, label }, idx) =>
          new Promise(resolve => {
            gltfLoader.load(
              url,
              result => {
                cache[key] = result.scene;
                cache[key].traverse(n => {
                  if (n.isMesh) {
                    n.castShadow    = true;
                    n.receiveShadow = true;
                    if (n.material) n.material.needsUpdate = false;
                  }
                });
                done++;
                elProgLabel.textContent = done < total ? stepLabels[done] : '✦ Models loaded';
                elProgFill.style.width  = `${(done/total)*100}%`;
                updateDots(done);
                resolve();
              },
              undefined,
              () => {
                console.warn(`Failed to load: ${key}`);
                cache[key] = null;
                done++;
                elProgFill.style.width  = `${(done/total)*100}%`;
                elErrMsg.style.display  = 'block';
                elErrMsg.textContent    = `⚠️ "${label}" failed — using placeholder.`;
                updateDots(done);
                resolve();
              }
            );
          })
        );

        await Promise.all(jobs);

        elProgFill.style.width  = '100%';
        elProgLabel.textContent = '✦ Models loaded';
        elDots.forEach(d => d.className = 'dot done');
        setTimeout(() => elArHint.classList.add('visible'), 400);
        setTimeout(() => elLoading.style.display = 'none', 1200);
      }

      /* ── Fallback geometries (created once, shared) ── */
      const _fbGeo = {};
      const _fbMat = {};
      function getFallback(key) {
        if (!_fbGeo[key]) {
          _fbGeo.buddha       = new THREE.CylinderGeometry(0.2,0.3,1,8);
          _fbGeo.stupa        = new THREE.ConeGeometry(0.4,1.8,8);
          _fbGeo.lotus1       = new THREE.SphereGeometry(0.1,6,6);
          _fbGeo.lotus2       = new THREE.SphereGeometry(0.1,6,6);
          _fbGeo.lotusLantern = new THREE.SphereGeometry(0.12,6,6);
          _fbGeo.vesakLantern = new THREE.BoxGeometry(0.2,0.3,0.1);
          _fbMat.buddha       = new THREE.MeshStandardMaterial({color:0xf3e5ab});
          _fbMat.stupa        = new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.4});
          _fbMat.lotus1       = new THREE.MeshStandardMaterial({color:0xff7fbf});
          _fbMat.lotus2       = new THREE.MeshStandardMaterial({color:0xff99cc});
          _fbMat.lotusLantern = new THREE.MeshStandardMaterial({color:0xffaa55,emissive:0xff8800,emissiveIntensity:1});
          _fbMat.vesakLantern = new THREE.MeshStandardMaterial({color:0xff5522,emissive:0xff9933,emissiveIntensity:0.8});
        }
        const root = new THREE.Group();
        const geo  = _fbGeo[key] || new THREE.BoxGeometry(0.2,0.2,0.2);
        const mat  = _fbMat[key] || new THREE.MeshStandardMaterial({color:0xaaa});
        root.add(new THREE.Mesh(geo, mat));
        return root;
      }

      /* ── Reusable Box3 helpers ── */
      const _box3  = new THREE.Box3();
      const _size3 = new THREE.Vector3();
      const _cent3 = new THREE.Vector3();

      function getModel(key, targetHeight) {
        const root = cache[key] ? cache[key].clone(true) : getFallback(key);
        _box3.setFromObject(root);
        _box3.getSize(_size3);
        _box3.getCenter(_cent3);
        const s = targetHeight / (_size3.y || 1);
        root.scale.setScalar(s);
        root.position.x -= _cent3.x * s;
        root.position.z -= _cent3.z * s;
        root.position.y -= _box3.min.y * s;
        return root;
      }

      /* ── Renderer ── */
      const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled        = true;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type    = THREE.PCFSoftShadowMap;

      Object.assign(renderer.domElement.style, {
        position:'fixed', top:'0', left:'0', width:'100%', height:'100%', zIndex:'1'
      });
      document.body.appendChild(renderer.domElement);

      const scene  = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 60);

      /* ── Lights ── */
      scene.add(new THREE.HemisphereLight(0xffe4b5, 0x664422, 1.3));
      const sun = new THREE.DirectionalLight(0xfff8e0, 0.9);
      sun.position.set(4, 10, 5);
      sun.castShadow = true;
      sun.shadow.mapSize.set(512, 512);
      sun.shadow.camera.near = 0.5;
      sun.shadow.camera.far  = 25;
      scene.add(sun);
      scene.add(new THREE.AmbientLight(0xffd580, 0.5));

      /* ── PointLight pool ── */
      const POOL_SIZE = 6;
      const lightPool = [];
      const lightPhases    = [0, 0.8, 1.6, 2.4, 3.2, 4.0];
      const lightPositions = [
        [-2.5, 1.0, -5.0],
        [ 5.5, 1.2, -5.5],
        [ 0.0, 0.6, -7.5],
        [ 0.0, 0.8, -3.5],
        [-3.0, 0.5, -4.5],
        [ 3.0, 0.5, -4.5],
      ];
      for (let i = 0; i < POOL_SIZE; i++) {
        const pl = new THREE.PointLight(0xffa040, 0.9, 5.5);
        pl.position.set(...lightPositions[i]);
        lightPool.push({ light: pl, phase: lightPhases[i] });
      }

      /* ── Reticle ── */
      const reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.08, 0.13, 32).rotateX(-Math.PI/2),
        new THREE.MeshBasicMaterial({ color:0x00ffcc, transparent:true, opacity:0.9 })
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      const arBtn = ARButton.createButton(renderer, { requiredFeatures:['hit-test'] });
      arBtn.style.zIndex = '10';
      document.body.appendChild(arBtn);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      /* ── AR state ── */
      const CIRCUM     = 2*Math.PI*45;
      const FRAMES_DAY = 18, FRAMES_NIGHT = 5;
      const DRIFT_DAY  = 0.06, DRIFT_NIGHT = 0.18;
      const FALLBACK_MS = 4000;

      let hitSource = null, hitRequested = false;
      let placed = false, sessionStart = null, stableCount = 0;
      const lastHit = new THREE.Vector3();
      let isNight = false;

      const flyingLanterns = [];
      let fireflyPoints = null;
      let fireflyPositions = null;

      /* ── Brightness sensor ── */
      let vidEl = null, brCtx = null;
      function startBrightness() {
        navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false})
          .then(stream => {
            vidEl = document.createElement('video');
            vidEl.srcObject = stream; vidEl.playsInline = true; vidEl.muted = true; vidEl.play();
            const c = document.createElement('canvas'); c.width=32; c.height=32;
            brCtx = c.getContext('2d',{willReadFrequently:true});
            setInterval(()=>{
              if(!vidEl||vidEl.readyState<2) return;
              brCtx.drawImage(vidEl,0,0,32,32);
              const d=brCtx.getImageData(0,0,32,32).data;
              let l=0; for(let i=0;i<d.length;i+=4) l+=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
              l/=1024;
              if((l<60)!==isNight){ isNight=l<60; elNight.style.display=isNight?'block':'none'; }
            },1500);
          }).catch(()=>{});
      }

      renderer.xr.addEventListener('sessionstart', () => {
        elLoading.style.display = 'none';
        sessionStart = performance.now();
        showStatus('🔍 Aim at the floor ahead…');
        elRing.style.display = 'block';
        startBrightness();
      });
      renderer.xr.addEventListener('sessionend', () => {
        hitSource=null; hitRequested=false; placed=false; stableCount=0; sessionStart=null;
      });

      /* ── Render loop ── */
      let _animFrame = 0;
      renderer.setAnimationLoop((ts, frame) => {
        _animFrame++;

        if (frame) {
          const session  = renderer.xr.getSession();
          const refSpace = renderer.xr.getReferenceSpace();

          if (!hitRequested && session) {
            session.requestReferenceSpace('viewer').then(vs =>
              session.requestHitTestSource({space:vs}).then(s => hitSource=s)
            );
            hitRequested = true;
          }

          if (!placed) {
            const maxF = isNight ? FRAMES_NIGHT : FRAMES_DAY;
            const maxD = isNight ? DRIFT_NIGHT  : DRIFT_DAY;
            let gotHit = false;

            if (hitSource) {
              const hits = frame.getHitTestResults(hitSource);
              if (hits.length) {
                const pose = hits[0].getPose(refSpace);
                reticle.visible = true;
                reticle.matrix.fromArray(pose.transform.matrix);
                const hp = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
                const drift = hp.distanceTo(lastHit);
                stableCount = drift < maxD ? stableCount+1 : (isNight ? Math.max(0,stableCount-1) : 0);
                lastHit.copy(hp); gotHit = true;
                const pct = Math.min(100,(stableCount/maxF)*100);
                setRing(pct);
                showStatus((isNight?'🌙 Night mode…':'🔍 Detecting floor…')+' '+Math.round(pct)+'%');
                if (stableCount >= maxF) placeCity('hittest');
              } else {
                reticle.visible = false;
                stableCount = isNight ? Math.max(0,stableCount-1) : 0;
                setRing(Math.min(100,(stableCount/maxF)*100));
                showStatus('📱 Point camera at the floor…');
              }
            }
            if (!gotHit && sessionStart && performance.now()-sessionStart > FALLBACK_MS) placeCity('fallback');
          }
        }

        animLanterns(ts);
        if (_animFrame % 2 === 0) {
          animLights(ts);
          animFireflies(ts);
        }
        renderer.render(scene, camera);
      });

      /* ── Place city ── */
      function placeCity(method) {
        placed=true; reticle.visible=false; elRing.style.display='none';
        const world = new THREE.Group();

        if (method==='hittest') {
          world.position.setFromMatrixPosition(reticle.matrix);
          const e = reticle.matrix.elements;
          world.rotation.y = Math.atan2(e[8], e[10]);
        } else {
          const cp=new THREE.Vector3(), cd=new THREE.Vector3();
          camera.getWorldPosition(cp); camera.getWorldDirection(cd);
          cd.y=0; if(cd.lengthSq()<0.001) cd.set(0,0,-1); cd.normalize();
          world.position.set(cp.x+cd.x*1.5, cp.y-1.6, cp.z+cd.z*1.5);
          world.rotation.y = Math.atan2(cd.x,cd.z)+Math.PI;
        }

        scene.add(world);
        buildCity(world);

        elTick.style.transform='translate(-50%,-50%) scale(1)'; elTick.style.opacity='1';
        setTimeout(()=>{ elTick.style.opacity='0'; elTick.style.transform='translate(-50%,-50%) scale(0.8)'; },1300);
        showStatus('🪷 Vesak City placed'+(method==='fallback'?' (floor estimated)':''));
        setTimeout(hideStatus, 3000);
      }

      /* ══════════════════════════════════════════════════════════════════
         BUILD CITY
      ══════════════════════════════════════════════════════════════════ */
      function buildCity(w) {
        lightPool.forEach(({ light }) => w.add(light));
        floorDeco(w);
        lotusPath(w);
        buddhaStatue(w);
        stupaRight(w);
        vesakLanternCluster(w);
        lotusLanterns(w);
        flyingLanternGroup(w, 18);
        fireflyCloud(w);
      }

      /* ── Floor mandala ── */
      function floorDeco(p) {
        p.add(new THREE.Mesh(
          new THREE.CircleGeometry(5.5,64).rotateX(-Math.PI/2),
          new THREE.MeshBasicMaterial({color:0xffd580,transparent:true,opacity:0.04,side:THREE.DoubleSide})
        ));
        [1.2,2.3,3.5,4.7].forEach(r => {
          p.add(new THREE.Mesh(
            new THREE.RingGeometry(r,r+0.025,64).rotateX(-Math.PI/2),
            new THREE.MeshBasicMaterial({color:0xffc84a,transparent:true,opacity:0.09,side:THREE.DoubleSide})
          ));
        });
      }

      /* ── Buddha statue ── */
      function buddhaStatue(p) {
        const m = getModel('buddha', 1.9);
        m.position.set(-2.5, 0, -5);
        m.rotation.y = 0.22;
        p.add(m);

        const halo = new THREE.Mesh(
          new THREE.RingGeometry(0.58,0.72,40),
          new THREE.MeshBasicMaterial({color:0xffe070,transparent:true,opacity:0.65,side:THREE.DoubleSide})
        );
        halo.position.set(0, 2.15, -0.08); halo.rotation.x = -0.15;
        m.add(halo);

        const inc = new THREE.Mesh(new THREE.SphereGeometry(0.06,6,6),
          new THREE.MeshStandardMaterial({color:0xffaa44,emissive:0xff8800,emissiveIntensity:3,transparent:true,opacity:0.9}));
        inc.position.set(-2.5, 0.65, -4.6); p.add(inc);
      }

      /* ── Stupa ── */
      function stupaRight(p) {
        const STUPA_X = 5.5, STUPA_Z = -5.5;
        const m = getModel('stupa', 2.4);
        m.position.set(STUPA_X, 0, STUPA_Z);
        m.rotation.y = -0.18;
        p.add(m);
      }

      /* ── Vesak lantern cluster ── */
      function vesakLanternCluster(p) {
        const spots = [
          [0,    2.0, -7.5, 0.75],
          [-1.1, 1.8, -8.5, 0.55],
          [ 1.1, 1.8, -8.5, 0.55],
          [-0.5, 1.6, -6.5, 0.50],
          [ 0.5, 1.6, -6.5, 0.50],
          [ 0,   2.2, -9.5, 0.50],
          [-1.8, 1.7, -7.0, 0.45],
          [ 1.8, 1.7, -7.0, 0.45],
        ];
        const stringMat = new THREE.MeshBasicMaterial({color:0x8b6914});

        spots.forEach(([x, hangY, z, h]) => {
          const m = getModel('vesakLantern', h);
          m.position.set(x, hangY, z);
          m.rotation.y = (Math.random()-0.5)*0.6;
          p.add(m);

          const ceilY = 3.2;
          const topY  = hangY + h;
          const strLen = ceilY - topY;
          if (strLen > 0.05) {
            const sg = new THREE.CylinderGeometry(0.005, 0.005, strLen, 4);
            const sm = new THREE.Mesh(sg, stringMat);
            sm.position.set(x, topY + strLen/2, z);
            p.add(sm);
          }
        });

        for (let i=0; i<=14; i++) {
          const t = i/14;
          const bead = new THREE.Mesh(
            new THREE.SphereGeometry(0.052,5,5),
            new THREE.MeshStandardMaterial({color:0xff9933,emissive:0xff6600,emissiveIntensity:2.8,transparent:true,opacity:0.95})
          );
          bead.position.set(
            -2.5 + t*5.5,
            2.1 - Math.sin(t*Math.PI)*0.4,
            -5.0 - t*0.5
          );
          p.add(bead);
        }
      }

      /* ── Lotus path ── */
      function lotusPath(p) {
        for (let i=0; i<11; i++) {
          const key = i%2===0 ? 'lotus1' : 'lotus2';
          const h   = 0.18 + Math.random()*0.10;
          const m   = getModel(key, h);
          const sx  = i%2===0 ? -0.62 : 0.62;
          m.position.set(sx+(Math.random()-0.5)*0.12, 0, -1.5-i*1.05+(Math.random()-0.5)*0.18);
          m.rotation.y = Math.random()*Math.PI*2;
          p.add(m);
        }

        [
          [-1.9,0,-2.5],[1.9,0,-2.5],
          [-1.6,0,-8.5],[1.6,0,-8.5],
          [-4.0,0,-7.5],[4.0,0,-7.5],
        ].forEach(([x,y,z],idx) => {
          const n = 2 + Math.floor(Math.random()*3);
          for (let j=0; j<n; j++) {
            const a = (j/n)*Math.PI*2;
            const m = getModel(idx%2===0?'lotus1':'lotus2', 0.12+Math.random()*0.07);
            m.position.set(x+Math.cos(a)*0.35, 0, z+Math.sin(a)*0.35);
            m.rotation.y = Math.random()*Math.PI*2;
            p.add(m);
          }
        });
      }

      /* ── Lotus lanterns (path-side) ── */
      function lotusLanterns(p) {
        [
          [-1.3,0,-10],[1.3,0,-10],
          [-2.6,0,-8.8],[2.6,0,-8.8],
          [-0.6,0,-11.5],[0.6,0,-11.5],
          [0,0,-12.5],
        ].forEach(([x,y,z]) => {
          const m = getModel('lotusLantern', 0.36);
          m.position.set(x,y,z);
          m.rotation.y = Math.random()*Math.PI*2;
          p.add(m);
        });
      }

      /* ── Flying sky lanterns ── */
      function flyingLanternGroup(p, count) {
        for (let i=0; i<count; i++) {
          const l = mkSkyLantern();
          l.position.set((Math.random()-0.5)*8, 0.4+Math.random()*0.5, -1-Math.random()*10);
          l.userData = {
            speed : 0.011+Math.random()*0.019,
            driftX: (Math.random()-0.5)*0.0014,
            driftZ: -0.001-Math.random()*0.001,
            phase : Math.random()*Math.PI*2
          };
          flyingLanterns.push(l); p.add(l);
        }
      }

      const _lanternBodyGeo = new THREE.SphereGeometry(0.21,8,6);
      const _lanternRingGeo = new THREE.TorusGeometry(0.16,0.022,5,16);
      const _lanternFlamGeo = new THREE.ConeGeometry(0.056,0.19,5);
      const _lanternBodyMat = new THREE.MeshStandardMaterial({color:0xffeb99,emissive:0xffd36b,emissiveIntensity:1.5,transparent:true,opacity:0.87});
      const _lanternRingMat = new THREE.MeshStandardMaterial({color:0x7a4a2c});
      const _lanternFlamMat = new THREE.MeshStandardMaterial({color:0xffa533,emissive:0xff7700,emissiveIntensity:4});

      function mkSkyLantern() {
        const g = new THREE.Group();
        const b = new THREE.Mesh(_lanternBodyGeo, _lanternBodyMat);
        b.scale.set(1,1.38,1); g.add(b);
        const r = new THREE.Mesh(_lanternRingGeo, _lanternRingMat);
        r.rotation.x=Math.PI/2; r.position.y=-0.28; g.add(r);
        const f = new THREE.Mesh(_lanternFlamGeo, _lanternFlamMat);
        f.position.y=-0.19; f.rotation.x=Math.PI; g.add(f);
        return g;
      }

      /* ── Fireflies ── */
      const FF_COUNT = 20;
      function fireflyCloud(p) {
        fireflyPositions = new Float32Array(FF_COUNT * 3);
        const baseY  = new Float32Array(FF_COUNT);
        const phases = new Float32Array(FF_COUNT);

        for (let i = 0; i < FF_COUNT; i++) {
          fireflyPositions[i*3]   = (Math.random()-0.5)*9;
          fireflyPositions[i*3+1] = 0.15 + Math.random()*2.0;
          fireflyPositions[i*3+2] = -0.5 - Math.random()*11;
          baseY[i]  = fireflyPositions[i*3+1];
          phases[i] = Math.random()*Math.PI*2;
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(fireflyPositions, 3));
        geo.userData = { baseY, phases };

        const mat = new THREE.PointsMaterial({
          color: 0xffe7aa,
          size: 0.07,
          transparent: true,
          opacity: 0.85,
          sizeAttenuation: true,
        });

        fireflyPoints = new THREE.Points(geo, mat);
        p.add(fireflyPoints);
      }

      /* ── Animations ── */
      function animLanterns(t) {
        flyingLanterns.forEach(l => {
          l.position.y += l.userData.speed;
          l.position.x += l.userData.driftX + Math.sin(t*0.001+l.userData.phase)*0.0007;
          l.position.z += l.userData.driftZ;
          l.rotation.y += 0.003;
          l.rotation.z  = Math.sin(t*0.001+l.userData.phase)*0.05;
          if (l.position.y > 14) {
            l.position.y = 0.5;
            l.position.x = (Math.random()-0.5)*8;
            l.position.z = -1-Math.random()*10;
          }
        });
      }

      function animLights(t) {
        lightPool.forEach(({ light, phase }) => {
          light.intensity = 0.52 + 0.30*Math.sin(t*0.006+phase);
          light.color.setHSL(0.09, 0.9, 0.50+0.13*Math.sin(t*0.011+phase));
        });
      }

      function animFireflies(t) {
        if (!fireflyPoints) return;
        const pos = fireflyPoints.geometry.attributes.position;
        for (let i = 0; i < FF_COUNT; i++) {
          pos.array[i*3]   += Math.sin(t*0.0007+i)*0.0006;
          pos.array[i*3+1] += 0.0019;
          if (pos.array[i*3+1] > 2.7) pos.array[i*3+1] = 0.15;
        }
        pos.needsUpdate = true;
        fireflyPoints.material.opacity = 0.55 + 0.35*Math.abs(Math.sin(t*0.0014));
      }

      /* ── Status helpers ── */
      function showStatus(msg){ elStatus.textContent=msg; elStatus.style.display='block'; elStatus.style.opacity='1'; }
      function hideStatus(){ elStatus.style.opacity='0'; setTimeout(()=>elStatus.style.display='none',400); }
      function setRing(pct){
        elRingFill.style.strokeDashoffset = CIRCUM*(1-pct/100);
        elRingPct.textContent = Math.round(pct)+'%';
        elRingFill.style.stroke = `hsl(${pct<50?174:174+(pct-50)*1.8},100%,55%)`;
      }

      /* ── Start ── */
      await preload();

    </script>
  </body>
</html>
