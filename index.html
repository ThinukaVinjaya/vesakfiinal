<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>AR Buddha FIX</title>
<style>
html,body{margin:0;overflow:hidden;background:#000}
canvas{width:100%;height:100%;display:block}

#ui{
  position:fixed;inset:0;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;
  background:#0a0700;
  color:#ffdca8;
  font-family:serif;
  z-index:10;
}
button{
  padding:14px 30px;
  border-radius:30px;
  border:1px solid #ffcc88;
  background:#1a0f00;
  color:#ffdca8;
  cursor:pointer;
}
#hud{
  position:fixed;inset:0;
  display:none;
  z-index:5;
}
#place{
  position:absolute;bottom:40px;left:50%;
  transform:translateX(-50%);
}
</style>
</head>

<body>

<div id="ui">
  <h1>🪷 AR Buddha</h1>
  <button onclick="startAR()">Enter AR</button>
  <p id="msg"></p>
</div>

<div id="hud">
  <button id="place" onclick="placeModel()">Place Buddha</button>
</div>

<canvas id="c"></canvas>

<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.150.1/examples/js/loaders/GLTFLoader.js"></script>

<script>

let scene, camera, renderer;
let xrSession, hitSource;
let reticle;
let hitMatrix = new THREE.Matrix4();
let hitFound = false;
let placed = false;
let buddha;

const MODEL =
"https://modelviewer.dev/shared-assets/models/Astronaut.glb"; // tested working

function log(m){
  document.getElementById("msg").innerText = m;
}

function initScene(){

  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.01, 100);

  renderer = new THREE.WebGLRenderer({
    canvas:document.getElementById("c"),
    alpha:true,
    antialias:true
  });

  renderer.setSize(innerWidth,innerHeight);
  renderer.xr.enabled = true;

  scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1.8));

  const geo = new THREE.RingGeometry(0.05,0.09,32).rotateX(-Math.PI/2);
  reticle = new THREE.Mesh(
    geo,
    new THREE.MeshBasicMaterial({color:0xffcc66})
  );
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);
}

function loadModel(){

  return new Promise(res=>{

    const loader = new THREE.GLTFLoader();

    log("Loading model...");

    loader.load(MODEL,(gltf)=>{

      const obj = gltf.scene;

      // FIX 1: force visibility
      obj.visible = true;

      // scale properly
      const box = new THREE.Box3().setFromObject(obj);
      const size = new THREE.Vector3();
      box.getSize(size);

      const scale = 0.5 / Math.max(size.x,size.y,size.z);
      obj.scale.setScalar(scale);

      const box2 = new THREE.Box3().setFromObject(obj);
      obj.position.y -= box2.min.y;

      buddha = new THREE.Group();
      buddha.add(obj);

      buddha.visible = true;
      scene.add(buddha);

      log("Model loaded ✔");
      res();

    },
    undefined,
    (err)=>{

      console.log(err);
      log("Model failed → fallback used");

      const m = new THREE.Mesh(
        new THREE.CylinderGeometry(0.15,0.2,0.5,32),
        new THREE.MeshStandardMaterial({color:0xffcc55})
      );

      buddha = new THREE.Group();
      buddha.add(m);
      scene.add(buddha);

      res();
    });

  });
}

async function startAR(){

  if(!navigator.xr){
    alert("WebXR not supported");
    return;
  }

  initScene();
  await loadModel();

  xrSession = await navigator.xr.requestSession("immersive-ar",{
    requiredFeatures:["hit-test"],
    optionalFeatures:["dom-overlay"],
    domOverlay:{root:document.getElementById("hud")}
  });

  document.getElementById("ui").style.display="none";
  document.getElementById("hud").style.display="block";

  renderer.xr.setReferenceSpaceType("local");
  await renderer.xr.setSession(xrSession);

  const viewer = await xrSession.requestReferenceSpace("viewer");
  hitSource = await xrSession.requestHitTestSource({space:viewer});

  renderer.setAnimationLoop(frame);
}

function frame(t,frame){

  if(!frame) return;

  const ref = renderer.xr.getReferenceSpace();
  const hits = frame.getHitTestResults(hitSource);

  if(hits.length){

    const pose = hits[0].getPose(ref);

    hitMatrix.fromArray(new Float32Array(pose.transform.matrix));

    reticle.visible = true;
    reticle.matrix.copy(hitMatrix);

    hitFound = true;
  } else {
    reticle.visible = false;
  }

  renderer.render(scene,camera);
}

function placeModel(){

  if(!hitFound) return;

  placed = true;

  const pos = new THREE.Vector3()
    .setFromMatrixPosition(hitMatrix);

  buddha.position.set(pos.x,pos.y,pos.z);

  reticle.visible = false;
}

</script>

</body>
</html>
