<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>AR Buddha Statue</title>

<style>
body { margin: 0; overflow: hidden; background: #000; }
#overlay { position: absolute; left: 10px; top: 10px; color: #fff; z-index: 2; }
#loading { position: fixed; inset: 0; display:flex; align-items:center; justify-content:center; background:#000; color:#fff; z-index:10; }
</style>
</head>

<body>

<div id="loading">Loading AR...</div>
<div id="overlay">Tap AR → tap surface to place Buddha statue</div>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.150.1/build/three.module.js';
import { ARButton } from 'https://unpkg.com/three@0.150.1/examples/jsm/webxr/ARButton.js';
import { GLTFLoader } from 'https://unpkg.com/three@0.150.1/examples/jsm/loaders/GLTFLoader.js';

let camera, scene, renderer;
let controller, reticle;
let hitTestSource = null;
let hitTestSourceRequested = false;
let world = null;

const loader = new GLTFLoader();

init();
animate();

// 🔧 INIT
function init(){

  renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;

  // Shadows
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;

  document.body.appendChild(renderer.domElement);

  scene = new THREE.Scene();

  camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth/window.innerHeight,
    0.01,
    20
  );

  // 💡 LIGHTING (IMPORTANT)
  const hemiLight = new THREE.HemisphereLight(0xffffff, 0xbbbbff, 1.2);
  scene.add(hemiLight);

  const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
  dirLight.position.set(3, 6, 3);
  dirLight.castShadow = true;
  scene.add(dirLight);

  scene.add(new THREE.AmbientLight(0xffffff, 0.8));

  // 🔵 RETICLE
  reticle = new THREE.Mesh(
    new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI/2),
    new THREE.MeshBasicMaterial({ color: 0x00ffcc })
  );
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  controller = renderer.xr.getController(0);
  controller.addEventListener('select', onSelect);
  scene.add(controller);

  document.body.appendChild(
    ARButton.createButton(renderer, {
      requiredFeatures: ['hit-test']
    })
  );

  window.addEventListener('resize', onResize);

  window.addEventListener('load', ()=>{
    setTimeout(()=> document.getElementById('loading').style.display='none', 800);
  });
}

// 📐 RESIZE
function onResize(){
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

// 📍 PLACE MODEL
function onSelect(){
  if (!reticle.visible || world) return;

  world = new THREE.Group();
  world.position.setFromMatrixPosition(reticle.matrix);
  scene.add(world);

  addBuddha(world);

  document.getElementById("overlay").style.display = "none";
}

// 🧘 LOAD REAL GLB MODEL
function addBuddha(parent){

  loader.load(
    'https://raw.githubusercontent.com/ThinukaVinjaya/vesakmodels/main/stone_buddha_statue.glb',

    (gltf)=>{

      const model = gltf.scene;

      // Scale & position
      model.scale.set(0.35, 0.35, 0.35);
      model.position.set(0, 0, 0);
      model.rotation.y = Math.PI;

      // Improve rendering
      model.traverse((child)=>{
        if(child.isMesh){
          child.castShadow = true;
          child.receiveShadow = true;
        }
      });

      parent.add(model);
    },

    (xhr)=>{
      console.log((xhr.loaded / xhr.total * 100) + '% loaded');
    },

    (error)=>{
      console.error('Model load error:', error);
    }
  );
}

// 🔄 LOOP
function animate(){
  renderer.setAnimationLoop(render);
}

function render(timestamp, frame){

  if(frame){

    const session = renderer.xr.getSession();
    const refSpace = renderer.xr.getReferenceSpace();

    if(!hitTestSourceRequested){
      session.requestReferenceSpace('viewer').then(space=>{
        session.requestHitTestSource({ space }).then(src=>{
          hitTestSource = src;
        });
      });
      hitTestSourceRequested = true;
    }

    if(hitTestSource){
      const hits = frame.getHitTestResults(hitTestSource);

      if(hits.length){
        const pose = hits[0].getPose(refSpace);
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
      } else {
        reticle.visible = false;
      }
    }
  }

  renderer.render(scene, camera);
}
</script>
</body>
</html>
