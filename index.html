<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>AR Vesak City</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { overflow: hidden; background: #000; font-family: sans-serif; }
      canvas { display: block; width: 100vw; height: 100vh; }

      #loading {
        position: fixed; inset: 0;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: rgba(0,0,0,0.92); color: #fff; z-index: 20; gap: 14px;
        text-align: center; padding: 28px;
      }
      #loading .title { font-size: 22px; font-weight: bold; color: #ffd580; }
      #loading .sub   { font-size: 13px; color: #bbb; line-height: 1.6; }
      #loadBar { width: 200px; height: 4px; background: rgba(255,255,255,0.15); border-radius: 2px; overflow: hidden; }
      #loadFill { height: 100%; width: 0%; background: #ffd580; border-radius: 2px; transition: width 0.3s; }

      #statusBar {
        position: fixed; bottom: 24px; left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.65); backdrop-filter: blur(8px);
        color: #fff; font-size: 13px; padding: 10px 20px; border-radius: 24px;
        z-index: 6; display: none; text-align: center;
        border: 1px solid rgba(255,255,255,0.12); transition: opacity 0.4s;
        max-width: 88vw; white-space: normal;
      }
      #ringWrap {
        position: fixed; bottom: 26%; left: 50%; transform: translateX(-50%);
        width: 110px; height: 110px; display: none; z-index: 5; pointer-events: none;
      }
      #ringWrap svg { width: 100%; height: 100%; }
      #ringBg   { fill: none; stroke: rgba(255,255,255,0.12); stroke-width: 5; }
      #ringFill { fill: none; stroke: #00ffcc; stroke-width: 5; stroke-linecap: round;
                  stroke-dasharray: 283; stroke-dashoffset: 283;
                  transform: rotate(-90deg); transform-origin: 50% 50%;
                  transition: stroke-dashoffset 0.25s ease; }
      #ringPct  { fill: #fff; font-size: 18px; font-weight: 600;
                  text-anchor: middle; dominant-baseline: central; }
      #nightBadge {
        position: fixed; top: 14px; right: 14px;
        background: rgba(255,180,30,0.18); border: 1px solid rgba(255,180,30,0.4);
        color: #ffc84a; font-size: 12px; padding: 5px 11px; border-radius: 14px;
        z-index: 7; display: none;
      }
      #placedTick {
        position: fixed; top: 50%; left: 50%;
        transform: translate(-50%,-50%) scale(0);
        background: rgba(0,200,120,0.22); border: 2px solid #00d484;
        border-radius: 50%; width: 72px; height: 72px;
        display: flex; align-items: center; justify-content: center;
        color: #00d484; font-size: 32px; z-index: 8; pointer-events: none;
        transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.5s; opacity: 0;
      }
    </style>
  </head>
  <body>
    <div id="loading">
      <div class="title">🪷 AR Vesak City</div>
      <div class="sub">Loading 3D models…</div>
      <div id="loadBar"><div id="loadFill"></div></div>
      <div id="loadNote" style="font-size:11px;color:#888;margin-top:4px">0 / 5</div>
    </div>
    <div id="ringWrap">
      <svg viewBox="0 0 100 100">
        <circle id="ringBg"   cx="50" cy="50" r="45"/>
        <circle id="ringFill" cx="50" cy="50" r="45"/>
        <text   id="ringPct"  x="50"  y="50">0%</text>
      </svg>
    </div>
    <div id="statusBar"></div>
    <div id="nightBadge">🌙 Night mode</div>
    <div id="placedTick">✓</div>

    <script type="module">
      import * as THREE     from 'https://unpkg.com/three@0.150.1/build/three.module.js';
      import { ARButton }   from 'https://unpkg.com/three@0.150.1/examples/jsm/webxr/ARButton.js';
      import { GLTFLoader } from 'https://unpkg.com/three@0.150.1/examples/jsm/loaders/GLTFLoader.js';

      // ── Model URLs (raw GitHub) ──────────────────────────────────────────────
      const URLS = {
        buddha  : 'https://github.com/ThinukaVinjaya/vesakmodels/raw/refs/heads/main/stone_buddha_statue.glb',
        lotus1  : 'https://github.com/ThinukaVinjaya/vesakmodels/raw/refs/heads/main/lotus1.glb',
        lotus2  : 'https://github.com/ThinukaVinjaya/vesakmodels/raw/refs/heads/main/lotus_flower2.glb',
        lotusLantern : 'https://github.com/ThinukaVinjaya/vesakmodels/raw/refs/heads/main/lotus_lanttern.glb',
        vesakLantern : 'https://github.com/ThinukaVinjaya/vesakmodels/raw/refs/heads/main/vesak_lanterns.glb',
        stupa   : 'https://github.com/ThinukaVinjaya/vesakmodels/raw/refs/heads/main/sthupa_srilanka.glb',
      };

      // ── DOM ──────────────────────────────────────────────────────────────────
      const elStatus   = document.getElementById('statusBar');
      const elRing     = document.getElementById('ringWrap');
      const elRingFill = document.getElementById('ringFill');
      const elRingPct  = document.getElementById('ringPct');
      const elNight    = document.getElementById('nightBadge');
      const elTick     = document.getElementById('placedTick');
      const elFill     = document.getElementById('loadFill');
      const elNote     = document.getElementById('loadNote');

      // ── Config ───────────────────────────────────────────────────────────────
      const CIRCUM       = 2 * Math.PI * 45;
      const FRAMES_DAY   = 18;
      const FRAMES_NIGHT = 5;
      const DRIFT_DAY    = 0.06;
      const DRIFT_NIGHT  = 0.18;
      const FALLBACK_MS  = 3500;

      // ── State ────────────────────────────────────────────────────────────────
      let camera, scene, renderer, reticle;
      let hitTestSource = null, hitTestSourceRequested = false;
      let placed = false, sessionStartTime = null;
      let stableCount = 0;
      const lastHitPos  = new THREE.Vector3();
      let isNightMode   = false;

      const models = {};           // loaded GLTFs keyed by name
      const flyingLanterns = [];
      const pathLights     = [];
      const particleGroups = [];

      // ── Load all models, then init ───────────────────────────────────────────
      const loader   = new GLTFLoader();
      const keys     = Object.keys(URLS);
      let   loaded   = 0;

      async function loadAll() {
        const total = keys.length;
        for (const key of keys) {
          try {
            const gltf = await new Promise((res, rej) => loader.load(URLS[key], res, undefined, rej));
            models[key] = gltf.scene;
            loaded++;
            const pct = Math.round(loaded / total * 100);
            elFill.style.width = pct + '%';
            elNote.textContent = `${loaded} / ${total}`;
          } catch(e) {
            console.warn('Failed to load', key, e);
            loaded++;
            elFill.style.width = Math.round(loaded / total * 100) + '%';
            elNote.textContent = `${loaded} / ${total} (${key} failed)`;
          }
        }
        document.getElementById('loading').querySelector('.sub').textContent = 'Tap "Start AR" and point at floor.';
        setTimeout(() => document.getElementById('loading').style.display = 'none', 600);
        init();
      }

      loadAll();

      // ── Helper: clone + fit model into a given size ──────────────────────────
      function cloneModel(key, targetSize) {
        if (!models[key]) return null;
        const clone = models[key].clone();
        // compute bounding box and scale to targetSize on longest axis
        const box = new THREE.Box3().setFromObject(clone);
        const sz  = new THREE.Vector3();
        box.getSize(sz);
        const maxDim = Math.max(sz.x, sz.y, sz.z);
        if (maxDim > 0) clone.scale.setScalar(targetSize / maxDim);
        // lift so bottom sits on Y=0
        const box2 = new THREE.Box3().setFromObject(clone);
        clone.position.y -= box2.min.y;
        return clone;
      }

      // ── Light sensor ─────────────────────────────────────────────────────────
      let videoEl = null, bCanvas = null, bCtx = null;
      function startBrightnessSensor() {
        navigator.mediaDevices.getUserMedia({ video: { facingMode:'environment' }, audio:false })
          .then(stream => {
            videoEl = document.createElement('video');
            videoEl.srcObject = stream; videoEl.playsInline = true;
            videoEl.muted = true; videoEl.play();
            bCanvas = document.createElement('canvas'); bCanvas.width = 32; bCanvas.height = 32;
            bCtx = bCanvas.getContext('2d', { willReadFrequently:true });
            setInterval(measureBrightness, 1200);
          }).catch(() => {});
      }
      function measureBrightness() {
        if (!videoEl || videoEl.readyState < 2) return;
        bCtx.drawImage(videoEl, 0, 0, 32, 32);
        const d = bCtx.getImageData(0,0,32,32).data;
        let lum = 0;
        for (let i = 0; i < d.length; i+=4) lum += 0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
        lum /= 1024;
        const night = lum < 60;
        if (night !== isNightMode) { isNightMode = night; elNight.style.display = night ? 'block' : 'none'; }
      }

      // ── Init three.js ────────────────────────────────────────────────────────
      function init() {
        renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.xr.enabled = true;
        renderer.shadowMap.enabled = true;
        Object.assign(renderer.domElement.style, { position:'absolute', top:'0', left:'0', width:'100%', height:'100%' });
        document.body.appendChild(renderer.domElement);

        scene  = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 30);

        scene.add(new THREE.HemisphereLight(0xffffff, 0x886644, 1.4));
        const dir = new THREE.DirectionalLight(0xfff8e0, 0.8);
        dir.position.set(2, 4, 2); dir.castShadow = true; scene.add(dir);

        reticle = new THREE.Mesh(
          new THREE.RingGeometry(0.08, 0.12, 32).rotateX(-Math.PI/2),
          new THREE.MeshBasicMaterial({ color:0x00ffcc, transparent:true, opacity:0 })
        );
        reticle.matrixAutoUpdate = false; reticle.visible = false; scene.add(reticle);

        document.body.appendChild(ARButton.createButton(renderer, { requiredFeatures:['hit-test'] }));

        renderer.xr.addEventListener('sessionstart', () => {
          sessionStartTime = performance.now();
          showStatus('🔍 Aim at the floor ahead…');
          elRing.style.display = 'block';
          startBrightnessSensor();
        });
        renderer.xr.addEventListener('sessionend', () => {
          hitTestSourceRequested = false; hitTestSource = null;
          placed = false; stableCount = 0; sessionStartTime = null;
        });

        window.addEventListener('resize', () => {
          camera.aspect = window.innerWidth/window.innerHeight;
          camera.updateProjectionMatrix();
          renderer.setSize(window.innerWidth, window.innerHeight);
        });

        renderer.setAnimationLoop(render);
      }

      // ── UI helpers ───────────────────────────────────────────────────────────
      function showStatus(msg) {
        elStatus.textContent = msg; elStatus.style.display = 'block'; elStatus.style.opacity = '1';
      }
      function hideStatus() {
        elStatus.style.opacity = '0';
        setTimeout(() => elStatus.style.display = 'none', 400);
      }
      function setRing(pct) {
        elRingFill.style.strokeDashoffset = CIRCUM * (1 - pct/100);
        elRingPct.textContent = Math.round(pct) + '%';
        const hue = pct < 50 ? 174 : 174 + (pct-50)*1.8;
        elRingFill.style.stroke = `hsl(${hue},100%,55%)`;
      }

      // ── Render loop ──────────────────────────────────────────────────────────
      function render(timestamp, frame) {
        if (frame) {
          const session      = renderer.xr.getSession();
          const refSpace     = renderer.xr.getReferenceSpace();

          if (!hitTestSourceRequested && session) {
            session.requestReferenceSpace('viewer').then(rs => {
              session.requestHitTestSource({ space:rs }).then(src => { hitTestSource = src; });
            });
            hitTestSourceRequested = true;
          }

          if (!placed) {
            const maxFrames = isNightMode ? FRAMES_NIGHT : FRAMES_DAY;
            const maxDrift  = isNightMode ? DRIFT_NIGHT  : DRIFT_DAY;
            let gotHit = false;

            if (hitTestSource) {
              const results = frame.getHitTestResults(hitTestSource);
              if (results.length > 0) {
                const pose = results[0].getPose(refSpace);
                reticle.visible = true;
                reticle.matrix.fromArray(pose.transform.matrix);
                const hp   = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
                const drift = hp.distanceTo(lastHitPos);
                stableCount = drift < maxDrift ? stableCount+1 : (isNightMode ? Math.max(0,stableCount-1) : 0);
                lastHitPos.copy(hp);
                gotHit = true;
                const pct = Math.min(100, stableCount/maxFrames*100);
                setRing(pct);
                showStatus((isNightMode ? '🌙 Night — ' : '🔍 ') + 'Detecting floor… ' + Math.round(pct) + '%');
                if (stableCount >= maxFrames) placeCity('hittest');
              } else {
                reticle.visible = false;
                stableCount = isNightMode ? Math.max(0,stableCount-1) : 0;
                setRing(Math.min(100, stableCount/maxFrames*100));
                showStatus('📱 Point camera at the floor…');
              }
            }

            if (!gotHit && sessionStartTime && performance.now()-sessionStartTime > FALLBACK_MS) {
              placeCity('fallback');
            }
          }
        }

        animateFlyingLanterns(timestamp);
        animateLights(timestamp);
        animateParticles(timestamp);
        renderer.render(scene, camera);
      }

      // ── Place city ───────────────────────────────────────────────────────────
      function placeCity(method) {
        placed = true; reticle.visible = false; elRing.style.display = 'none';

        const world = new THREE.Group();

        if (method === 'hittest') {
          world.position.setFromMatrixPosition(reticle.matrix);
          const m = reticle.matrix.elements;
          world.rotation.y = Math.atan2(m[8], m[10]);
        } else {
          const camPos = new THREE.Vector3();
          const camDir = new THREE.Vector3();
          camera.getWorldPosition(camPos);
          camera.getWorldDirection(camDir);
          camDir.y = 0;
          if (camDir.lengthSq() < 0.001) camDir.set(0,0,-1);
          camDir.normalize();
          world.position.set(camPos.x+camDir.x*1.5, camPos.y-1.6, camPos.z+camDir.z*1.5);
          world.rotation.y = Math.atan2(camDir.x, camDir.z)+Math.PI;
        }

        scene.add(world);
        buildCity(world);

        elTick.style.transform = 'translate(-50%,-50%) scale(1)';
        elTick.style.opacity   = '1';
        setTimeout(() => { elTick.style.opacity='0'; elTick.style.transform='translate(-50%,-50%) scale(0.8)'; }, 1200);
        showStatus('🪷 Vesak City placed' + (method==='fallback' ? ' (estimated floor)' : ''));
        setTimeout(hideStatus, 2800);
      }

      // ── Build the whole city ─────────────────────────────────────────────────
      function buildCity(world) {
        placeBuddha(world);
        placeStupa(world);
        placeLotusRows(world);
        placeLotusLanterns(world);
        placeFlyingLanterns(world);
        addGardenLights(world);
        addFireflies(world);
      }

      // ── Buddha — centrepiece, rear centre ───────────────────────────────────
      function placeBuddha(world) {
        const m = cloneModel('buddha', 2.0);
        if (!m) return;
        m.position.set(0, 0, -5);
        m.rotation.y = 0;
        world.add(m);
        // soft golden glow around statue
        const glow = new THREE.PointLight(0xffcc66, 1.2, 4);
        glow.position.set(0, 1.2, -5);
        world.add(glow);
        pathLights.push({ light: glow, phase: 0.3 });
      }

      // ── Stupa — flanking the buddha left & right ─────────────────────────────
      function placeStupa(world) {
        [[-3.5, 0, -5], [3.5, 0, -5]].forEach(([x, y, z], idx) => {
          const m = cloneModel('stupa', 2.5);
          if (!m) return;
          m.position.set(x, y, z);
          m.rotation.y = idx === 0 ? 0.3 : -0.3;
          world.add(m);
        });
      }

      // ── Lotus flowers — two rows lining the path ─────────────────────────────
      function placeLotusRows(world) {
        const lotusKeys = ['lotus1', 'lotus2'];
        const rowZ  = (i) => -i * 1.2 - 0.8;
        const sides = [1.8, -1.8, 2.6, -2.6];

        for (let i = 0; i < 10; i++) {
          sides.forEach((sx, si) => {
            const key  = lotusKeys[(i + si) % 2];
            const size = 0.25 + Math.random() * 0.18;
            const m    = cloneModel(key, size);
            if (!m) return;
            m.position.set(sx + (Math.random()-0.5)*0.3, 0, rowZ(i));
            m.rotation.y = Math.random() * Math.PI * 2;
            world.add(m);
          });
        }

        // Extra lotus clusters near stupa base
        [[-3.5,0,-4],[3.5,0,-4],[-3.5,0,-6],[3.5,0,-6]].forEach(([x,y,z]) => {
          for (let c = 0; c < 3; c++) {
            const key = lotusKeys[c % 2];
            const m   = cloneModel(key, 0.2 + Math.random()*0.15);
            if (!m) return;
            m.position.set(x+(Math.random()-0.5)*0.6, y, z+(Math.random()-0.5)*0.6);
            m.rotation.y = Math.random()*Math.PI*2;
            world.add(m);
          }
        });
      }

      // ── Lotus lanterns — line the path on poles ──────────────────────────────
      function placeLotusLanterns(world) {
        const poleZPositions = [-1.2, -2.4, -3.6, -4.8, -6.0];
        const sideXPositions = [2.2, -2.2];

        poleZPositions.forEach((z, zi) => {
          sideXPositions.forEach((sx, si) => {
            // pole
            const pole = new THREE.Mesh(
              new THREE.CylinderGeometry(0.03, 0.04, 2.0, 8),
              new THREE.MeshStandardMaterial({ color: 0x5a3820, roughness: 0.85 })
            );
            pole.position.set(sx, 1.0, z);
            world.add(pole);

            // lotus lantern model on top of pole
            const m = cloneModel('lotusLantern', 0.45);
            if (m) {
              m.position.set(sx, 2.05, z);
              m.rotation.y = Math.random() * Math.PI * 2;
              world.add(m);
            }

            // warm glow from each lantern
            const light = new THREE.PointLight(0xff8844, 0.7, 3.5);
            light.position.set(sx, 2.1, z);
            world.add(light);
            pathLights.push({ light, phase: (zi*si + si) * 0.8 });
          });
        });
      }

      // ── Flying Vesak lanterns ────────────────────────────────────────────────
      function placeFlyingLanterns(world) {
        const count = 14;
        for (let i = 0; i < count; i++) {
          const m = cloneModel('vesakLantern', 0.5);
          if (!m) {
            // fallback geometry if model failed
            const fallback = createFallbackSkyLantern();
            fallback.position.set((Math.random()-0.5)*6, 0.8+Math.random()*0.5, -2-Math.random()*7);
            setFlyingData(fallback, i);
            flyingLanterns.push(fallback);
            world.add(fallback);
            continue;
          }
          m.position.set((Math.random()-0.5)*6, 0.8+Math.random()*0.5, -2-Math.random()*7);
          setFlyingData(m, i);
          flyingLanterns.push(m);
          world.add(m);

          // each flying lantern has a warm glow
          const glow = new THREE.PointLight(0xffaa44, 0.6, 2.5);
          glow.position.copy(m.position);
          world.add(glow);
          m.userData.glowLight = glow;
        }
      }

      function setFlyingData(obj, i) {
        obj.userData.flying = true;
        obj.userData.speed  = 0.010 + Math.random() * 0.016;
        obj.userData.driftX = (Math.random()-0.5) * 0.0014;
        obj.userData.driftZ = -0.0012 - Math.random() * 0.001;
        obj.userData.phase  = (i / 14) * Math.PI * 2;
        obj.userData.initY  = obj.position.y;
      }

      function createFallbackSkyLantern() {
        const g = new THREE.Group();
        const b = new THREE.Mesh(new THREE.SphereGeometry(0.18,12,10),
          new THREE.MeshStandardMaterial({color:0xffeb99,emissive:0xffd36b,emissiveIntensity:1.2,transparent:true,opacity:0.86}));
        b.scale.set(1,1.3,1); g.add(b);
        const f = new THREE.Mesh(new THREE.ConeGeometry(0.05,0.16,8),
          new THREE.MeshStandardMaterial({color:0xffa533,emissive:0xff7700,emissiveIntensity:3}));
        f.position.y=-0.24; f.rotation.x=Math.PI; g.add(f);
        g.add(new THREE.PointLight(0xffb060,1.0,3));
        return g;
      }

      // ── Garden ambient lights ────────────────────────────────────────────────
      function addGardenLights(world) {
        [[-2.8,0.3,-2],[ 2.8,0.3,-2],[-2.8,0.3,-4],[ 2.8,0.3,-4],
         [-2.8,0.3,-6],[ 2.8,0.3,-6],[  0,  0.3,-8]].forEach(([x,y,z]) => {
          const orb = new THREE.Mesh(new THREE.SphereGeometry(0.08,8,8),
            new THREE.MeshStandardMaterial({color:0xffd580,emissive:0xffd150,emissiveIntensity:1.1,transparent:true,opacity:0.9}));
          orb.position.set(x,y,z); world.add(orb);
          const l = new THREE.PointLight(0xffd580,0.5,3);
          l.position.set(x,y,z); world.add(l);
          pathLights.push({ light:l, phase:Math.random()*Math.PI*2 });
        });
      }

      // ── Fireflies ────────────────────────────────────────────────────────────
      function addFireflies(world) {
        const g = new THREE.Group();
        for (let i = 0; i < 28; i++) {
          const f = new THREE.Mesh(new THREE.SphereGeometry(0.035,6,6),
            new THREE.MeshStandardMaterial({color:0xffe7aa,emissive:0xffd680,emissiveIntensity:1.4,transparent:true,opacity:0.9}));
          f.position.set((Math.random()-0.5)*7, 0.2+Math.random()*2.0, -0.5-Math.random()*9);
          g.add(f);
        }
        world.add(g); particleGroups.push(g);
      }

      // ── Animation ────────────────────────────────────────────────────────────
      function animateFlyingLanterns(t) {
        flyingLanterns.forEach(l => {
          l.position.y += l.userData.speed;
          l.position.x += l.userData.driftX + Math.sin(t*0.001+l.userData.phase)*0.0007;
          l.position.z += l.userData.driftZ;
          l.rotation.y += 0.003;
          l.rotation.z  = Math.sin(t*0.0009+l.userData.phase)*0.04;

          // sync glow with lantern
          if (l.userData.glowLight) {
            l.userData.glowLight.position.copy(l.position);
            l.userData.glowLight.intensity = 0.5 + 0.2*Math.sin(t*0.005+l.userData.phase);
          }

          if (l.position.y > 12) {
            l.position.y = l.userData.initY || 0.8;
            l.position.x = (Math.random()-0.5)*6;
            l.position.z = -2-Math.random()*7;
          }
        });
      }

      function animateLights(t) {
        pathLights.forEach(({light,phase}) => {
          light.intensity = 0.55 + 0.22*Math.sin(t*0.005+phase);
          if (light.color) light.color.setHSL(0.08, 0.85, 0.52+0.1*Math.sin(t*0.009+phase));
        });
      }

      function animateParticles(t) {
        particleGroups.forEach((g,idx) => {
          g.children.forEach((p,i) => {
            p.position.y += 0.0018+0.002*idx;
            p.position.x += Math.sin(t*0.0007+i)*0.0006;
            if (p.position.y > 2.8+idx*0.5) p.position.y = 0.2;
          });
        });
      }
    </script>
  </body>
