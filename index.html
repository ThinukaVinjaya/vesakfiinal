<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>AR Vesak City</title>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      body { overflow:hidden; background:#000; font-family:sans-serif; }

      #loading {
        position:fixed; inset:0;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        background:#000; color:#fff; z-index:20; gap:16px; text-align:center; padding:32px;
      }
      .title { font-size:26px; font-weight:bold; color:#ffd580; letter-spacing:1px; }
      .sub   { font-size:14px; color:#bbb; line-height:1.8; }

      #progressWrap { width:240px; }
      #progLabel { font-size:13px; color:#ffd580; margin-bottom:8px; }
      #progTrack { background:rgba(255,255,255,0.12); border-radius:8px; height:7px; overflow:hidden; }
      #progFill  { height:100%; background:linear-gradient(90deg,#ffd580,#ff9933); border-radius:8px; width:0%; transition:width 0.3s; }
      #errMsg    { color:#ff9966; font-size:12px; margin-top:8px; display:none; line-height:1.5; }

      #diagBox {
        position:fixed; top:0; left:0; right:0;
        background:rgba(180,30,30,0.92); color:#fff;
        font-size:12px; padding:10px 14px; z-index:30;
        display:none; line-height:1.7; max-height:40vh; overflow-y:auto;
        border-bottom:2px solid #ff6666;
      }
      #diagBox strong { color:#ffd580; display:block; margin-bottom:4px; font-size:13px; }
      #diagBox .diag-row { font-family:monospace; font-size:11px; color:#ffcccc; }
      #diagBox .diag-ok  { color:#aaffaa; }
      #diagBox .diag-err { color:#ff9966; }
      #retryBtn {
        display:none; margin-top:10px;
        background:#ffd580; color:#000; border:none;
        padding:6px 18px; border-radius:16px; font-size:13px;
        font-weight:bold; cursor:pointer;
      }

      #statusBar {
        position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
        background:rgba(0,0,0,0.65); backdrop-filter:blur(8px);
        color:#fff; font-size:13px; padding:10px 20px; border-radius:24px;
        z-index:6; display:none; text-align:center;
        border:1px solid rgba(255,255,255,0.12); transition:opacity 0.4s;
        max-width:88vw; white-space:normal;
      }
      #ringWrap {
        position:fixed; bottom:26%; left:50%; transform:translateX(-50%);
        width:110px; height:110px; display:none; z-index:5; pointer-events:none;
      }
      #ringWrap svg { width:100%; height:100%; }
      #ringBg   { fill:none; stroke:rgba(255,255,255,0.12); stroke-width:5; }
      #ringFill { fill:none; stroke:#00ffcc; stroke-width:5; stroke-linecap:round;
                  stroke-dasharray:283; stroke-dashoffset:283;
                  transform:rotate(-90deg); transform-origin:50% 50%;
                  transition:stroke-dashoffset 0.25s ease; }
      #ringPct  { fill:#fff; font-size:18px; font-weight:600; text-anchor:middle; dominant-baseline:central; }

      #nightBadge {
        position:fixed; top:14px; right:14px;
        background:rgba(255,180,30,0.18); border:1px solid rgba(255,180,30,0.4);
        color:#ffc84a; font-size:12px; padding:5px 11px; border-radius:14px;
        z-index:7; display:none;
      }
      #placedTick {
        position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0);
        background:rgba(0,200,120,0.22); border:2px solid #00d484;
        border-radius:50%; width:72px; height:72px;
        display:flex; align-items:center; justify-content:center;
        color:#00d484; font-size:32px; z-index:8; pointer-events:none;
        transition:transform 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.5s; opacity:0;
      }
    </style>
  </head>
  <body>

    <div id="loading">
      <div class="title">🪷 AR Vesak City</div>
      <div class="sub" id="loadSub">Loading models…</div>
      <div id="progressWrap">
        <div id="progLabel">Starting…</div>
        <div id="progTrack"><div id="progFill"></div></div>
        <div id="errMsg"></div>
      </div>
    </div>

    <div id="ringWrap">
      <svg viewBox="0 0 100 100">
        <circle id="ringBg"   cx="50" cy="50" r="45"/>
        <circle id="ringFill" cx="50" cy="50" r="45"/>
        <text   id="ringPct"  x="50"  y="50">0%</text>
      </svg>
    </div>
    <div id="diagBox" style="position:fixed;top:0;left:0;right:0;background:rgba(140,20,20,0.93);color:#fff;font-size:12px;padding:10px 14px;z-index:30;display:none;line-height:1.8;max-height:45vh;overflow-y:auto;border-bottom:2px solid #ff6666;">
      <strong style="color:#ffd580;display:block;margin-bottom:6px;font-size:13px;">⚠️ Model load failed — see details below</strong>
      <div id="diagRows" style="font-family:monospace;font-size:11px;"></div>
      <div style="margin-top:8px;font-size:11px;color:#ffddaa;">
        Fix: Open R2 dashboard → Bucket Settings → CORS → add rule:<br>
        <span style="font-family:monospace">Allowed Origins: *  Methods: GET,HEAD</span>
      </div>
      <button id="retryBtn" onclick="retryFailed()" style="display:none;margin-top:8px;background:#ffd580;color:#000;border:none;padding:5px 16px;border-radius:14px;font-size:12px;font-weight:bold;cursor:pointer;">🔄 Retry</button>
    </div>
    <div id="statusBar"></div>
    <div id="nightBadge">🌙 Night mode</div>
    <div id="placedTick">✓</div>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
      }
    }
    </script>

    <script type="module">
      import * as THREE   from 'three';
      import { ARButton } from 'three/addons/webxr/ARButton.js';
      import { GLTFLoader }  from 'three/addons/loaders/GLTFLoader.js';
      import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

      /* DOM */
      const elLoading   = document.getElementById('loading');
      const elLoadSub   = document.getElementById('loadSub');
      const elProgLabel = document.getElementById('progLabel');
      const elProgFill  = document.getElementById('progFill');
      const elErrMsg    = document.getElementById('errMsg');
      const elStatus    = document.getElementById('statusBar');
      const elRing      = document.getElementById('ringWrap');
      const elRingFill  = document.getElementById('ringFill');
      const elRingPct   = document.getElementById('ringPct');
      const elNight     = document.getElementById('nightBadge');
      const elTick      = document.getElementById('placedTick');

      /* R2 model URLs */
      const R2 = 'https://pub-7cbad791f95e4c9680981f095fab45e1.r2.dev/';
      const MODELS = [
        { key:'buddha',       url: R2+'stone_buddha_statue.glb', label:'Buddha Statue'   },
        { key:'lotus1',       url: R2+'lotus1.glb',              label:'Lotus Flower 1'  },
        { key:'lotus2',       url: R2+'lotus_flower2.glb',       label:'Lotus Flower 2'  },
        { key:'lotusLantern', url: R2+'lotus_lanttern.glb',      label:'Lotus Lantern'   },
        { key:'vesakLantern', url: R2+'vesak_lanterns.glb',      label:'Vesak Lantern'   },
        { key:'stupa',        url: R2+'sthupa_srilanka.glb',     label:'Sri Lanka Stupa' },
      ];

      /* GLTF / DRACO loader */
      const draco = new DRACOLoader();
      draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.5/');
      const gltfLoader = new GLTFLoader();
      gltfLoader.setDRACOLoader(draco);

      const cache = {};

      /* Track which models failed so we can show diagnostics and retry */
      const failedModels = {};

      async function loadOneModel({ key, url, label }) {
        return new Promise(resolve => {
          gltfLoader.load(
            url,
            result => {
              cache[key] = result.scene;
              cache[key].traverse(n => {
                if (n.isMesh) {
                  n.castShadow    = true;
                  n.receiveShadow = true;
                  if (n.material) n.material.needsUpdate = false;
                }
              });
              delete failedModels[key];
              resolve({ key, ok: true });
            },
            undefined,
            (err) => {
              console.warn(`Failed to load ${key}:`, err);
              cache[key] = null;
              failedModels[key] = { url, label, err: err?.message || String(err) };
              resolve({ key, ok: false });
            }
          );
        });
      }

      /*
        Pre-check: HEAD request tells us WHY a model failed before we even
        try GLTF loading.  Results shown in the diagnostic overlay.
      */
      async function checkUrl(url) {
        try {
          const r = await fetch(url, { method: 'HEAD', mode: 'cors' });
          return r.ok ? 'ok' : `HTTP ${r.status} ${r.statusText}`;
        } catch(e) {
          return e.message.includes('CORS') || e.message.includes('NetworkError')
            ? 'CORS blocked — bucket needs Access-Control-Allow-Origin: *'
            : `Network error: ${e.message}`;
        }
      }

      function showDiag(results) {
        const box  = document.getElementById('diagBox');
        const rows = document.getElementById('diagRows');
        const btn  = document.getElementById('retryBtn');
        if (!results.some(r => r.status !== 'ok')) return;
        rows.innerHTML = results.map(r =>
          `<div class="diag-row ${r.status==='ok'?'diag-ok':'diag-err'}">
            ${r.status==='ok'?'✓':'✗'} ${r.label}: ${r.status}
          </div>`
        ).join('');
        box.style.display = 'block';
        btn.style.display = 'inline-block';
      }

      /* Exposed globally so the retry button can call it */
      window.retryFailed = async function() {
        const toRetry = MODELS.filter(m => failedModels[m.key]);
        if (!toRetry.length) return;
        document.getElementById('retryBtn').textContent = '⏳ Retrying…';
        await Promise.all(toRetry.map(m => loadOneModel(m)));
        document.getElementById('retryBtn').textContent = '🔄 Retry failed models';
        // Re-check diagnostics
        const results = await Promise.all(MODELS.map(async m => ({
          label: m.label,
          status: cache[m.key] ? 'ok' : (await checkUrl(m.url))
        })));
        showDiag(results);
      };

      async function preload() {
        let done = 0;
        const total = MODELS.length;
        draco.preload();

        const jobs = MODELS.map(m =>
          loadOneModel(m).then(result => {
            done++;
            elProgLabel.textContent = `(${done}/${total}) ${result.ok ? 'Loaded' : '⚠️ Failed'}: ${m.label}`;
            elProgFill.style.width  = `${(done/total)*100}%`;
          })
        );

        await Promise.all(jobs);

        elProgFill.style.width  = '100%';

        /* Run HEAD checks on any that failed to show user the real reason */
        const failed = MODELS.filter(m => !cache[m.key]);
        if (failed.length) {
          elProgLabel.textContent = `⚠️ ${failed.length} model(s) failed — checking…`;
          const diagResults = await Promise.all(MODELS.map(async m => ({
            label: m.label,
            status: cache[m.key] ? 'ok' : (await checkUrl(m.url))
          })));
          showDiag(diagResults);
          elProgLabel.textContent = `⚠️ ${failed.length} model(s) unavailable`;
        } else {
          elProgLabel.textContent = '✅ All models loaded!';
        }

        elLoadSub.textContent = 'Tap "Start AR" then point at the floor.';
        setTimeout(() => elLoading.style.display = 'none', failed.length ? 2500 : 700);
      }

      /* Fallback geometries — sizes match new realistic scales */
      const _fbGeo = {};
      const _fbMat = {};
      function getFallback(key) {
        if (!_fbGeo[key]) {
          _fbGeo.buddha       = new THREE.CylinderGeometry(0.5, 0.7, 3.6, 8);
          _fbGeo.stupa        = new THREE.ConeGeometry(2.0, 6.5, 8);
          _fbGeo.lotus1       = new THREE.SphereGeometry(0.10, 6, 6);
          _fbGeo.lotus2       = new THREE.SphereGeometry(0.10, 6, 6);
          _fbGeo.lotusLantern = new THREE.SphereGeometry(0.25, 6, 6);
          _fbGeo.vesakLantern = new THREE.BoxGeometry(0.50, 0.65, 0.25);
          _fbMat.buddha       = new THREE.MeshStandardMaterial({color:0xf3e5ab});
          _fbMat.stupa        = new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.4});
          _fbMat.lotus1       = new THREE.MeshStandardMaterial({color:0xff7fbf});
          _fbMat.lotus2       = new THREE.MeshStandardMaterial({color:0xff99cc});
          _fbMat.lotusLantern = new THREE.MeshStandardMaterial({color:0xffaa55,emissive:0xff8800,emissiveIntensity:1});
          _fbMat.vesakLantern = new THREE.MeshStandardMaterial({color:0xff5522,emissive:0xff9933,emissiveIntensity:0.8});
        }
        const root = new THREE.Group();
        const geo  = _fbGeo[key] || new THREE.BoxGeometry(0.5, 0.5, 0.5);
        const mat  = _fbMat[key] || new THREE.MeshStandardMaterial({color:0xaaa});
        root.add(new THREE.Mesh(geo, mat));
        return root;
      }

      /* Reusable Box3 helpers */
      const _box3  = new THREE.Box3();
      const _size3 = new THREE.Vector3();
      const _cent3 = new THREE.Vector3();

      /*
        getModel — scales model so its Y-extent == targetHeight (metres).
        This is the single correct way to enforce real-world size regardless
        of whatever internal units the GLB was authored in.
      */
      function getModel(key, targetHeight) {
        /* Return null if model failed — caller should check before using */
        if (!cache[key]) return null;
        const root = cache[key].clone(true);
        _box3.setFromObject(root);
        _box3.getSize(_size3);
        _box3.getCenter(_cent3);
        const s = targetHeight / (_size3.y || 1);
        root.scale.setScalar(s);
        root.position.x -= _cent3.x * s;
        root.position.z -= _cent3.z * s;
        root.position.y -= _box3.min.y * s;
        return root;
      }

      /* Renderer */
      const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled        = true;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type    = THREE.PCFSoftShadowMap;

      Object.assign(renderer.domElement.style, {
        position:'fixed', top:'0', left:'0', width:'100%', height:'100%', zIndex:'1'
      });
      document.body.appendChild(renderer.domElement);

      const scene  = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 80);

      /*
        Lights — boosted range & intensity for the larger scene.
        Sun shadow frustum widened to cover stupa (8 m away) and buddha (7 m away).
      */
      scene.add(new THREE.HemisphereLight(0xffe4b5, 0x664422, 1.5));
      const sun = new THREE.DirectionalLight(0xfff8e0, 1.1);
      sun.position.set(6, 18, 8);
      sun.castShadow = true;
      sun.shadow.mapSize.set(512, 512);
      sun.shadow.camera.near   = 0.5;
      sun.shadow.camera.far    = 45;
      sun.shadow.camera.left   = -16;
      sun.shadow.camera.right  =  16;
      sun.shadow.camera.top    =  16;
      sun.shadow.camera.bottom = -16;
      scene.add(sun);
      scene.add(new THREE.AmbientLight(0xffd580, 0.6));

      /* PointLight pool — repositioned for wider, deeper scene */
      const POOL_SIZE = 6;
      const lightPool = [];
      const lightPhases    = [0, 0.8, 1.6, 2.4, 3.2, 4.0];
      const lightPositions = [
        [-3.5,  2.5,  -7.0],  // buddha base
        [ 8.0,  3.0,  -8.0],  // stupa base
        [ 0.0,  2.0, -10.0],  // centre cluster
        [ 0.0,  2.0,  -4.5],  // entrance
        [-5.5,  1.2,  -6.0],
        [ 5.5,  1.2,  -6.0],
      ];
      for (let i = 0; i < POOL_SIZE; i++) {
        const pl = new THREE.PointLight(0xffa040, 1.2, 10.0);
        pl.position.set(...lightPositions[i]);
        lightPool.push({ light: pl, phase: lightPhases[i] });
      }

      /* Reticle */
      const reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.08, 0.13, 32).rotateX(-Math.PI/2),
        new THREE.MeshBasicMaterial({ color:0x00ffcc, transparent:true, opacity:0.9 })
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      const arBtn = ARButton.createButton(renderer, { requiredFeatures:['hit-test'] });
      arBtn.style.zIndex = '10';
      document.body.appendChild(arBtn);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      /* AR state */
      const CIRCUM     = 2*Math.PI*45;
      const FRAMES_DAY = 18, FRAMES_NIGHT = 5;
      const DRIFT_DAY  = 0.06, DRIFT_NIGHT = 0.18;
      const FALLBACK_MS = 4000;

      let hitSource = null, hitRequested = false;
      let placed = false, sessionStart = null, stableCount = 0;
      const lastHit = new THREE.Vector3();
      let isNight = false;

      const flyingLanterns = [];
      let fireflyPoints = null;
      let fireflyPositions = null;

      /* Brightness sensor */
      let vidEl = null, brCtx = null;
      function startBrightness() {
        navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false})
          .then(stream => {
            vidEl = document.createElement('video');
            vidEl.srcObject = stream; vidEl.playsInline = true; vidEl.muted = true; vidEl.play();
            const c = document.createElement('canvas'); c.width=32; c.height=32;
            brCtx = c.getContext('2d',{willReadFrequently:true});
            setInterval(()=>{
              if(!vidEl||vidEl.readyState<2) return;
              brCtx.drawImage(vidEl,0,0,32,32);
              const d=brCtx.getImageData(0,0,32,32).data;
              let l=0; for(let i=0;i<d.length;i+=4) l+=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
              l/=1024;
              if((l<60)!==isNight){ isNight=l<60; elNight.style.display=isNight?'block':'none'; }
            },1500);
          }).catch(()=>{});
      }

      renderer.xr.addEventListener('sessionstart', () => {
        elLoading.style.display = 'none';
        sessionStart = performance.now();
        showStatus('🔍 Aim at the floor ahead…');
        elRing.style.display = 'block';
        startBrightness();
      });
      renderer.xr.addEventListener('sessionend', () => {
        hitSource=null; hitRequested=false; placed=false; stableCount=0; sessionStart=null;
      });

      /* Render loop */
      let _animFrame = 0;
      renderer.setAnimationLoop((ts, frame) => {
        _animFrame++;

        if (frame) {
          const session  = renderer.xr.getSession();
          const refSpace = renderer.xr.getReferenceSpace();

          if (!hitRequested && session) {
            session.requestReferenceSpace('viewer').then(vs =>
              session.requestHitTestSource({space:vs}).then(s => hitSource=s)
            );
            hitRequested = true;
          }

          if (!placed) {
            const maxF = isNight ? FRAMES_NIGHT : FRAMES_DAY;
            const maxD = isNight ? DRIFT_NIGHT  : DRIFT_DAY;
            let gotHit = false;

            if (hitSource) {
              const hits = frame.getHitTestResults(hitSource);
              if (hits.length) {
                const pose = hits[0].getPose(refSpace);
                reticle.visible = true;
                reticle.matrix.fromArray(pose.transform.matrix);
                const hp = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
                const drift = hp.distanceTo(lastHit);
                stableCount = drift < maxD ? stableCount+1 : (isNight ? Math.max(0,stableCount-1) : 0);
                lastHit.copy(hp); gotHit = true;
                const pct = Math.min(100,(stableCount/maxF)*100);
                setRing(pct);
                showStatus((isNight?'🌙 Night mode…':'🔍 Detecting floor…')+' '+Math.round(pct)+'%');
                if (stableCount >= maxF) placeCity('hittest');
              } else {
                reticle.visible = false;
                stableCount = isNight ? Math.max(0,stableCount-1) : 0;
                setRing(Math.min(100,(stableCount/maxF)*100));
                showStatus('📱 Point camera at the floor…');
              }
            }
            if (!gotHit && sessionStart && performance.now()-sessionStart > FALLBACK_MS) placeCity('fallback');
          }
        }

        animLanterns(ts);
        if (_animFrame % 2 === 0) {
          animLights(ts);
          animFireflies(ts);
        }
        renderer.render(scene, camera);
      });

      /* Place city */
      function placeCity(method) {
        placed=true; reticle.visible=false; elRing.style.display='none';
        const world = new THREE.Group();

        if (method==='hittest') {
          world.position.setFromMatrixPosition(reticle.matrix);
          const e = reticle.matrix.elements;
          world.rotation.y = Math.atan2(e[8], e[10]);
        } else {
          const cp=new THREE.Vector3(), cd=new THREE.Vector3();
          camera.getWorldPosition(cp); camera.getWorldDirection(cd);
          cd.y=0; if(cd.lengthSq()<0.001) cd.set(0,0,-1); cd.normalize();
          world.position.set(cp.x+cd.x*1.5, cp.y-1.6, cp.z+cd.z*1.5);
          world.rotation.y = Math.atan2(cd.x,cd.z)+Math.PI;
        }

        scene.add(world);
        buildCity(world);

        elTick.style.transform='translate(-50%,-50%) scale(1)'; elTick.style.opacity='1';
        setTimeout(()=>{ elTick.style.opacity='0'; elTick.style.transform='translate(-50%,-50%) scale(0.8)'; },1300);
        showStatus('🪷 Vesak City placed'+(method==='fallback'?' (floor estimated)':''));
        setTimeout(hideStatus, 3000);
      }

      /* ═══════════════════════════════════════════════════════════
         BUILD CITY
         All targetHeight values are REAL-WORLD METRES.
         Reference: camera eye height ~1.6 m (typical AR user).

         Buddha statue   → 3.6 m  (monumental, ~2× human height)
         Sri Lanka stupa → 6.5 m  (towers over the scene, landmark)
         Vesak lanterns  → 0.45–0.65 m  (real paper balloon)
         Sky lanterns    → ~0.58 m tall (30 cm radius × 1.38 stretch)
         Lotus lanterns  → 0.50 m
         Lotus flowers   → 0.18–0.25 m
      ═══════════════════════════════════════════════════════════ */
      function buildCity(w) {
        lightPool.forEach(({ light }) => w.add(light));
        floorDeco(w);
        lotusPath(w);
        buddhaStatue(w);
        stupaRight(w);
        vesakLanternCluster(w);
        lotusLanterns(w);
        flyingLanternGroup(w, 18);
        fireflyCloud(w);
      }

      /* Floor mandala — wider rings to frame bigger scene */
      function floorDeco(p) {
        p.add(new THREE.Mesh(
          new THREE.CircleGeometry(8.0, 64).rotateX(-Math.PI/2),
          new THREE.MeshBasicMaterial({color:0xffd580,transparent:true,opacity:0.04,side:THREE.DoubleSide})
        ));
        [1.8, 3.2, 5.0, 6.8].forEach(r => {
          p.add(new THREE.Mesh(
            new THREE.RingGeometry(r, r+0.03, 64).rotateX(-Math.PI/2),
            new THREE.MeshBasicMaterial({color:0xffc84a,transparent:true,opacity:0.09,side:THREE.DoubleSide})
          ));
        });
      }

      /*
        Buddha statue
        SCALE FIX: 1.9 m → 3.6 m
        — At 1.9 m the statue was barely taller than a person; 3.6 m makes it
          the commanding centrepiece a Vesak festival statue should be.
        POSITION: x=-3.5, z=-7.0 — clear of path centre and stupa.
        HALO: radius scaled up proportionally (0.58→0.90 m inner).
        PEDESTAL: simple stone block grounds the statue on the floor plane.
      */
      function buddhaStatue(p) {
        if (!cache['buddha']) {
          showStatus('⚠️ Buddha model unavailable — check R2 bucket CORS/public settings');
          return;
        }
        const m = getModel('buddha', 3.6);
        m.position.set(-3.5, 0, -7.0);
        m.rotation.y = 0.22;
        p.add(m);

        const halo = new THREE.Mesh(
          new THREE.RingGeometry(0.90, 1.12, 48),
          new THREE.MeshBasicMaterial({color:0xffe070,transparent:true,opacity:0.65,side:THREE.DoubleSide})
        );
        halo.position.set(0, 3.90, -0.12);
        halo.rotation.x = -0.15;
        m.add(halo);

        const inc = new THREE.Mesh(new THREE.SphereGeometry(0.09, 6, 6),
          new THREE.MeshStandardMaterial({color:0xffaa44,emissive:0xff8800,emissiveIntensity:3,transparent:true,opacity:0.9}));
        inc.position.set(-3.5, 0.90, -6.6);
        p.add(inc);

        // Stone pedestal
        const ped = new THREE.Mesh(
          new THREE.BoxGeometry(1.3, 0.55, 1.3),
          new THREE.MeshStandardMaterial({color:0xd4c090,roughness:0.8,metalness:0.05})
        );
        ped.position.set(-3.5, 0.275, -7.0);
        p.add(ped);
      }

      /*
        Sri Lanka Stupa
        SCALE FIX: 2.4 m → 6.5 m
        — 2.4 m was shorter than a doorway. At 6.5 m the stupa towers above
          the camera (eye ~1.6 m), which is exactly how it feels to stand
          before Ruwanwelisaya. The camera will have to tilt up to see the top.
        POSITION: x=+8.0, z=-8.0 — well separated from buddha on the left.
      */
      function stupaRight(p) {
        if (!cache['stupa']) {
          showStatus('⚠️ Stupa model unavailable — check R2 bucket');
          return;
        }
        const m = getModel('stupa', 6.5);
        m.position.set(8.0, 0, -8.0);
        m.rotation.y = -0.18;
        p.add(m);
      }

      /*
        Vesak lantern cluster
        SCALE FIX: heights 0.50–0.75 → 0.45–0.65 m
        — Real Vesak paper lanterns are 40–60 cm tall; 0.75 m was oversized.
        POSITIONS: pushed back/wider to frame the larger scene.
      */
      function vesakLanternCluster(p) {
        const spots = [
          [0,    2.8, -9.5,  0.65],
          [-1.4, 2.5, -11.0, 0.55],
          [ 1.4, 2.5, -11.0, 0.55],
          [-0.6, 2.2, -8.0,  0.50],
          [ 0.6, 2.2, -8.0,  0.50],
          [ 0,   3.0, -12.5, 0.50],
          [-2.2, 2.4, -9.0,  0.45],
          [ 2.2, 2.4, -9.0,  0.45],
        ];
        const stringMat = new THREE.MeshBasicMaterial({color:0x8b6914});

        spots.forEach(([x, hangY, z, h]) => {
          const m = getModel('vesakLantern', h);
          if (!m) return;
          m.position.set(x, hangY, z);
          m.rotation.y = (Math.random()-0.5)*0.6;
          p.add(m);

          const ceilY  = 4.2;
          const topY   = hangY + h;
          const strLen = ceilY - topY;
          if (strLen > 0.05) {
            const sg = new THREE.CylinderGeometry(0.006, 0.006, strLen, 4);
            const sm = new THREE.Mesh(sg, stringMat);
            sm.position.set(x, topY + strLen/2, z);
            p.add(sm);
          }
        });

        // String light beads spanning wider scene
        for (let i = 0; i <= 16; i++) {
          const t = i/16;
          const bead = new THREE.Mesh(
            new THREE.SphereGeometry(0.065, 5, 5),
            new THREE.MeshStandardMaterial({color:0xff9933,emissive:0xff6600,emissiveIntensity:2.8,transparent:true,opacity:0.95})
          );
          bead.position.set(
            -3.5 + t*7.0,
            2.8 - Math.sin(t*Math.PI)*0.5,
            -6.5 - t*0.6
          );
          p.add(bead);
        }
      }

      /* Lotus path */
      function lotusPath(p) {
        for (let i = 0; i < 13; i++) {
          const key = i%2===0 ? 'lotus1' : 'lotus2';
          const h   = 0.20 + Math.random()*0.10;
          const m   = getModel(key, h);
          if (!m) continue;
          const sx  = i%2===0 ? -0.70 : 0.70;
          m.position.set(sx+(Math.random()-0.5)*0.14, 0, -1.5 - i*1.15 + (Math.random()-0.5)*0.20);
          m.rotation.y = Math.random()*Math.PI*2;
          p.add(m);
        }

        // Side clusters — clear of buddha (x=-3.5) and stupa (x=+8)
        [
          [-2.2, 0, -3.0], [2.2, 0, -3.0],
          [-2.0, 0, -11.0],[2.0, 0, -11.0],
          [-5.0, 0, -9.0], [5.0, 0, -9.0],
        ].forEach(([x, y, z], idx) => {
          const n = 2 + Math.floor(Math.random()*3);
          for (let j = 0; j < n; j++) {
            const a = (j/n)*Math.PI*2;
            const m = getModel(idx%2===0 ? 'lotus1' : 'lotus2', 0.14+Math.random()*0.08);
            if (!m) continue;
            m.position.set(x+Math.cos(a)*0.40, 0, z+Math.sin(a)*0.40);
            m.rotation.y = Math.random()*Math.PI*2;
            p.add(m);
          }
        });
      }

      /*
        Lotus lanterns
        SCALE FIX: 0.36 → 0.50 m — more visible at real-world scale.
      */
      function lotusLanterns(p) {
        [
          [-1.6, 0, -13.0],[1.6, 0, -13.0],
          [-3.2, 0, -11.5],[3.2, 0, -11.5],
          [-0.7, 0, -15.0],[0.7, 0, -15.0],
          [0,    0, -16.0],
        ].forEach(([x, y, z]) => {
          const m = getModel('lotusLantern', 0.50);
          if (!m) return;
          m.position.set(x, y, z);
          m.rotation.y = Math.random()*Math.PI*2;
          p.add(m);
        });
      }

      /*
        Flying sky lanterns
        SCALE FIX: body SphereGeometry radius 0.21 → 0.30 m
        — A real sky lantern is ~50–60 cm tall; the old size was too small
          to read against the larger stupa/buddha in the scene.
      */
      function flyingLanternGroup(p, count) {
        for (let i = 0; i < count; i++) {
          const l = mkSkyLantern();
          l.position.set((Math.random()-0.5)*12, 0.6+Math.random()*0.8, -1-Math.random()*14);
          l.userData = {
            speed : 0.011+Math.random()*0.019,
            driftX: (Math.random()-0.5)*0.0014,
            driftZ: -0.001-Math.random()*0.001,
            phase : Math.random()*Math.PI*2
          };
          flyingLanterns.push(l);
          p.add(l);
        }
      }

      /* Shared lantern geometry — SCALE FIX: all dims ~×1.43 */
      const _lanternBodyGeo = new THREE.SphereGeometry(0.30, 8, 6);
      const _lanternRingGeo = new THREE.TorusGeometry(0.23, 0.030, 5, 16);
      const _lanternFlamGeo = new THREE.ConeGeometry(0.080, 0.27, 5);
      const _lanternBodyMat = new THREE.MeshStandardMaterial({color:0xffeb99,emissive:0xffd36b,emissiveIntensity:1.5,transparent:true,opacity:0.87});
      const _lanternRingMat = new THREE.MeshStandardMaterial({color:0x7a4a2c});
      const _lanternFlamMat = new THREE.MeshStandardMaterial({color:0xffa533,emissive:0xff7700,emissiveIntensity:4});

      function mkSkyLantern() {
        const g = new THREE.Group();
        const b = new THREE.Mesh(_lanternBodyGeo, _lanternBodyMat);
        b.scale.set(1, 1.38, 1); g.add(b);
        const r = new THREE.Mesh(_lanternRingGeo, _lanternRingMat);
        r.rotation.x = Math.PI/2; r.position.y = -0.40; g.add(r);
        const f = new THREE.Mesh(_lanternFlamGeo, _lanternFlamMat);
        f.position.y = -0.27; f.rotation.x = Math.PI; g.add(f);
        return g;
      }

      /* Fireflies */
      const FF_COUNT = 20;
      function fireflyCloud(p) {
        fireflyPositions = new Float32Array(FF_COUNT * 3);
        for (let i = 0; i < FF_COUNT; i++) {
          fireflyPositions[i*3]   = (Math.random()-0.5)*13;
          fireflyPositions[i*3+1] = 0.20 + Math.random()*3.0;
          fireflyPositions[i*3+2] = -0.5 - Math.random()*14;
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(fireflyPositions, 3));

        const mat = new THREE.PointsMaterial({
          color: 0xffe7aa, size: 0.09,
          transparent: true, opacity: 0.85, sizeAttenuation: true,
        });

        fireflyPoints = new THREE.Points(geo, mat);
        p.add(fireflyPoints);
      }

      /* Animations */
      function animLanterns(t) {
        flyingLanterns.forEach(l => {
          l.position.y += l.userData.speed;
          l.position.x += l.userData.driftX + Math.sin(t*0.001+l.userData.phase)*0.0007;
          l.position.z += l.userData.driftZ;
          l.rotation.y += 0.003;
          l.rotation.z  = Math.sin(t*0.001+l.userData.phase)*0.05;
          if (l.position.y > 18) {
            l.position.y = 0.6;
            l.position.x = (Math.random()-0.5)*12;
            l.position.z = -1-Math.random()*14;
          }
        });
      }

      function animLights(t) {
        lightPool.forEach(({ light, phase }) => {
          light.intensity = 0.70 + 0.38*Math.sin(t*0.006+phase);
          light.color.setHSL(0.09, 0.9, 0.50+0.13*Math.sin(t*0.011+phase));
        });
      }

      function animFireflies(t) {
        if (!fireflyPoints) return;
        const pos = fireflyPoints.geometry.attributes.position;
        for (let i = 0; i < FF_COUNT; i++) {
          pos.array[i*3]   += Math.sin(t*0.0007+i)*0.0006;
          pos.array[i*3+1] += 0.0019;
          if (pos.array[i*3+1] > 3.5) pos.array[i*3+1] = 0.20;
        }
        pos.needsUpdate = true;
        fireflyPoints.material.opacity = 0.55 + 0.35*Math.abs(Math.sin(t*0.0014));
      }

      /* Status helpers */
      function showStatus(msg){ elStatus.textContent=msg; elStatus.style.display='block'; elStatus.style.opacity='1'; }
      function hideStatus(){ elStatus.style.opacity='0'; setTimeout(()=>elStatus.style.display='none',400); }
      function setRing(pct){
        elRingFill.style.strokeDashoffset = CIRCUM*(1-pct/100);
        elRingPct.textContent = Math.round(pct)+'%';
        elRingFill.style.stroke = `hsl(${pct<50?174:174+(pct-50)*1.8},100%,55%)`;
      }

      await preload();

    </script>
  </body>
</html>
