<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>Vesak AR</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap');
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Cinzel',serif}

  #c{position:fixed;inset:0;display:none;z-index:1}

  /* Landing */
  #landing{
    position:fixed;inset:0;z-index:100;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(ellipse at 50% 30%,#1c1000,#060310 75%);
  }
  .lotus{font-size:3.2rem;animation:gl 3s ease-in-out infinite}
  @keyframes gl{0%,100%{filter:drop-shadow(0 0 10px #ffb940)}50%{filter:drop-shadow(0 0 30px #ffe060)}}
  #landing h1{font-size:clamp(1.7rem,5vw,2.6rem);color:#ffd780;letter-spacing:.1em;text-align:center}
  .sub{color:rgba(240,215,140,.5);font-size:.88rem;font-style:italic;text-align:center}
  .cards{display:flex;gap:14px}
  .card{
    background:rgba(255,200,80,.07);border:1px solid rgba(255,200,80,.22);
    border-radius:12px;padding:12px 16px;text-align:center;width:118px;
    color:#ffd780;font-size:.74rem;line-height:1.5
  }
  .card b{display:block;font-size:1.5rem;margin-bottom:4px}
  #startBtn{
    background:linear-gradient(135deg,#b87408,#f0b940,#b87408);
    border:none;color:#160a00;font-family:'Cinzel',serif;
    font-weight:700;font-size:1rem;letter-spacing:.14em;
    padding:14px 38px;border-radius:50px;cursor:pointer;
    box-shadow:0 0 30px rgba(240,185,64,.4);transition:transform .2s,box-shadow .2s
  }
  #startBtn:hover{transform:translateY(-2px);box-shadow:0 0 48px rgba(240,185,64,.65)}
  #startBtn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .note{color:rgba(200,175,110,.4);font-size:.7rem;text-align:center;max-width:270px;line-height:1.6}
  #errBox{
    display:none;background:rgba(180,40,40,.15);border:1px solid rgba(200,60,60,.4);
    border-radius:10px;padding:12px 18px;color:#ffaaaa;font-size:.82rem;
    text-align:center;max-width:300px;line-height:1.5
  }

  /* HUD */
  #hud{display:none;position:fixed;inset:0;z-index:50;pointer-events:none}
  #hudTop{
    position:absolute;top:0;left:0;right:0;
    background:linear-gradient(to bottom,rgba(0,0,0,.6),transparent);
    padding:14px 16px;display:flex;align-items:center;justify-content:center
  }
  #hudTop span{color:#ffd780;font-size:.92rem;letter-spacing:.15em;text-shadow:0 0 10px rgba(255,200,80,.5)}
  #exitBtn{
    pointer-events:all;position:absolute;top:12px;right:14px;
    background:rgba(0,0,0,.65);border:1px solid rgba(255,200,80,.35);
    border-radius:50%;width:42px;height:42px;color:#ffd780;font-size:1.1rem;
    cursor:pointer;display:flex;align-items:center;justify-content:center;
    backdrop-filter:blur(8px)
  }
  #hudBot{
    position:absolute;bottom:0;left:0;right:0;
    background:linear-gradient(to top,rgba(0,0,0,.65),transparent);
    padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:10px
  }
  #tapBtn{
    pointer-events:all;
    background:rgba(255,200,64,.16);border:1px solid rgba(255,200,64,.5);
    color:#ffd780;font-family:'Cinzel',serif;font-size:.88rem;letter-spacing:.1em;
    padding:11px 30px;border-radius:30px;cursor:pointer;backdrop-filter:blur(8px);
    transition:background .2s
  }
  #tapBtn:hover{background:rgba(255,200,64,.32)}
  #tapBtn.gone{display:none}
  #hintTxt{color:rgba(240,215,140,.65);font-size:.78rem;font-style:italic;letter-spacing:.04em;text-align:center}
  .sLabel{
    position:absolute;top:50%;transform:translateY(-50%);
    background:rgba(0,0,0,.65);border:1px solid rgba(255,200,80,.3);
    border-radius:10px;padding:8px 11px;color:#ffd780;font-size:.68rem;
    letter-spacing:.08em;text-align:center;backdrop-filter:blur(6px);line-height:1.6;
    display:none
  }
  #lblL{left:8px} #lblR{right:8px}

  /* Spinner */
  #spinner{
    display:none;position:fixed;inset:0;z-index:200;
    background:rgba(4,2,12,.85);
    flex-direction:column;align-items:center;justify-content:center;gap:16px
  }
  .ring{
    width:54px;height:54px;border-radius:50%;
    border:3px solid rgba(255,200,80,.15);border-top-color:#ffd780;
    animation:sp 1s linear infinite
  }
  @keyframes sp{to{transform:rotate(360deg)}}
  #spinner p{color:#ffd780;font-size:.88rem;letter-spacing:.12em}
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- Landing -->
<div id="landing">
  <div class="lotus">&#x1FAB7;</div>
  <h1>Vesak AR</h1>
  <p class="sub">Sacred Monuments of Sri Lanka</p>
  <div class="cards">
    <div class="card"><b>&#x1F9D8;</b>Buddha<br>Statue</div>
    <div class="card"><b>&#x1F3DB;&#xFE0F;</b>Sri Lanka<br>Stupa</div>
  </div>
  <button id="startBtn" onclick="initAR()">&#10022; Enter AR &#10022;</button>
  <p class="note">Requires Chrome on Android 8+ or Safari iOS 15+<br>Must be served over HTTPS</p>
  <div id="errBox"></div>
</div>

<!-- AR HUD -->
<div id="hud">
  <div id="hudTop"><span>&#10022; Vesak AR &#10022;</span></div>
  <button id="exitBtn" onclick="exitAR()">&#x2715;</button>
  <div class="sLabel" id="lblL">&#x1F9D8;<br>Buddha<br>Statue</div>
  <div class="sLabel" id="lblR">&#x1F3DB;&#xFE0F;<br>Sri Lanka<br>Stupa</div>
  <div id="hudBot">
    <button id="tapBtn" onclick="placeOnHit()">&#x1F4CD; Place Models Here</button>
    <div id="hintTxt">Slowly move camera to detect a flat surface</div>
  </div>
</div>

<!-- Spinner -->
<div id="spinner"><div class="ring"></div><p id="spinTxt">Initialising…</p></div>

<!-- Three.js r128 -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>
const BUDDHA_URL = 'https://cdn.jsdelivr.net/gh/ThinukaVinjaya/vesakmodels@main/stone_buddha_statue.glb';
const STUPA_URL  = 'https://cdn.jsdelivr.net/gh/ThinukaVinjaya/vesakmodels@main/sthupa_srilanka.glb';
const SPACING    = 0.55;

let renderer, scene, camera, clock;
let reticle;
let buddhaGroup = null, stupaGroup = null;
let placed = false;
let xrSession = null;
let hitTestSource = null;
let currentHitPose = null;

/* helpers */
function showErr(msg){
  const b=document.getElementById('errBox');
  b.textContent=msg; b.style.display='block';
  document.getElementById('startBtn').disabled=false;
  spin(false);
}
function spin(show,txt){
  document.getElementById('spinner').style.display=show?'flex':'none';
  if(txt) document.getElementById('spinTxt').textContent=txt;
}

/* ══ ENTRY ══ */
async function initAR(){
  document.getElementById('startBtn').disabled=true;
  document.getElementById('errBox').style.display='none';

  if(!navigator.xr){ showErr('WebXR not found. Try Chrome on Android or Safari iOS 15+.'); return; }
  const ok = await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);
  if(!ok){ showErr('Immersive AR not supported on this device.'); return; }

  spin(true,'Setting up renderer…');
  setupThreeJS();
  spin(true,'Loading 3D models…');
  await loadGLTFLoader();
  await loadModels();
  spin(false);
  await launchXR();
}

/* ══ THREE.JS ══ */
function setupThreeJS(){
  clock = new THREE.Clock();
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 100);

  const canvas = document.getElementById('c');
  renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.physicallyCorrectLights = true;
  renderer.setClearColor(0x000000, 0);

  // lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  const sun = new THREE.DirectionalLight(0xfffbe0, 1.4);
  sun.position.set(2, 4, 3); scene.add(sun);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x806040, 0.5));

  // reticle
  const geo = new THREE.RingGeometry(0.06, 0.11, 32);
  geo.applyMatrix4(new THREE.Matrix4().makeRotationX(-Math.PI/2));
  reticle = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color:0xffd060,side:THREE.DoubleSide,transparent:true,opacity:0.9}));
  reticle.matrixAutoUpdate = false;
  reticle.visible = false;
  scene.add(reticle);

  window.addEventListener('resize',()=>{
    renderer.setSize(window.innerWidth, window.innerHeight);
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
  });
}

/* ══ GLTF LOADER ══ */
function loadGLTFLoader(){
  return new Promise((res,rej)=>{
    if(THREE.GLTFLoader){ res(); return; }
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js';
    s.onload=res; s.onerror=rej;
    document.head.appendChild(s);
  });
}

/* ══ LOAD MODELS ══ */
function loadSingle(url){
  return new Promise(res=>{
    const loader = new THREE.GLTFLoader();
    loader.load(url, gltf=>{
      const root = gltf.scene;
      // normalise size to ~0.45m
      const box = new THREE.Box3().setFromObject(root);
      const sz = new THREE.Vector3(); box.getSize(sz);
      const s = 0.45 / Math.max(sz.x,sz.y,sz.z);
      root.scale.setScalar(s);
      // sit on floor
      const box2 = new THREE.Box3().setFromObject(root);
      root.position.y = -box2.min.y;
      const g = new THREE.Group(); g.add(root);
      g.visible = false; scene.add(g);
      res(g);
    }, undefined, err=>{
      console.warn('GLB load failed', url, err);
      // fallback box
      const h=0.5, geo=new THREE.BoxGeometry(0.25,h,0.25);
      const mat=new THREE.MeshStandardMaterial({color:0xc8a060,roughness:0.7});
      const mesh=new THREE.Mesh(geo,mat); mesh.position.y=h/2;
      const g=new THREE.Group(); g.add(mesh);
      g.visible=false; scene.add(g); res(g);
    });
  });
}

async function loadModels(){
  [buddhaGroup, stupaGroup] = await Promise.all([
    loadSingle(BUDDHA_URL),
    loadSingle(STUPA_URL)
  ]);
}

/* ══ LAUNCH XR ══ */
async function launchXR(){
  try{
    xrSession = await navigator.xr.requestSession('immersive-ar',{
      requiredFeatures:['hit-test'],
      optionalFeatures:['dom-overlay','local-floor'],
      domOverlay:{root:document.getElementById('hud')}
    });
  } catch(e){ showErr('AR session failed: '+e.message); return; }

  document.getElementById('c').style.display='block';
  document.getElementById('landing').style.display='none';
  document.getElementById('hud').style.display='block';
  document.getElementById('tapBtn').classList.remove('gone');

  renderer.xr.setReferenceSpaceType('local');
  await renderer.xr.setSession(xrSession);
  xrSession.addEventListener('end', onEnd);

  // hit-test source
  const viewerSpace = await xrSession.requestReferenceSpace('viewer');
  hitTestSource = await xrSession.requestHitTestSource({space:viewerSpace});

  placed = false;
  currentHitPose = null;
  renderer.setAnimationLoop(onFrame);
}

/* ══ RENDER LOOP ══ */
function onFrame(time, frame){
  if(!frame) return;
  const dt = clock.getDelta();

  // gentle rotation
  if(buddhaGroup && buddhaGroup.visible) buddhaGroup.rotation.y += dt*0.3;
  if(stupaGroup  && stupaGroup.visible)  stupaGroup.rotation.y  += dt*0.2;

  // hit test
  if(!placed && hitTestSource){
    const refSpace = renderer.xr.getReferenceSpace();
    const hits = frame.getHitTestResults(hitTestSource);
    if(hits.length){
      const pose = hits[0].getPose(refSpace);
      if(pose){
        currentHitPose = pose;
        reticle.visible = true;
        reticle.matrix.fromArray(pose.transform.matrix);
        document.getElementById('hintTxt').textContent='Surface found! Tap Place Models.';
      }
    } else {
      reticle.visible=false;
      currentHitPose=null;
      document.getElementById('hintTxt').textContent='Slowly scan a flat surface…';
    }
  }

  renderer.render(scene, camera);
}

/* ══ PLACE ══ */
function placeOnHit(){
  if(!currentHitPose){
    document.getElementById('hintTxt').textContent='No surface yet — keep scanning…';
    return;
  }
  placed=true;
  reticle.visible=false;
  document.getElementById('tapBtn').classList.add('gone');
  document.getElementById('hintTxt').textContent='Walk around to explore both models!';
  document.getElementById('lblL').style.display='block';
  document.getElementById('lblR').style.display='block';

  // extract position + orientation from hit pose matrix
  const m = new THREE.Matrix4().fromArray(currentHitPose.transform.matrix);
  const pos = new THREE.Vector3().setFromMatrixPosition(m);
  const quat = new THREE.Quaternion().setFromRotationMatrix(m);

  // right vector in hit-surface local space
  const right = new THREE.Vector3(1,0,0).applyQuaternion(quat);

  if(buddhaGroup){
    buddhaGroup.position.copy(pos).addScaledVector(right, -SPACING);
    buddhaGroup.rotation.y = new THREE.Euler().setFromQuaternion(quat,'YXZ').y;
    buddhaGroup.visible=true;
  }
  if(stupaGroup){
    stupaGroup.position.copy(pos).addScaledVector(right, SPACING);
    stupaGroup.rotation.y = new THREE.Euler().setFromQuaternion(quat,'YXZ').y;
    stupaGroup.visible=true;
  }
}

/* ══ EXIT ══ */
function exitAR(){
  if(xrSession) xrSession.end();
}
function onEnd(){
  xrSession=null; hitTestSource=null;
  renderer.setAnimationLoop(null);
  if(buddhaGroup){ buddhaGroup.visible=false; }
  if(stupaGroup){ stupaGroup.visible=false; }
  placed=false; reticle.visible=false; currentHitPose=null;
  document.getElementById('c').style.display='none';
  document.getElementById('hud').style.display='none';
  document.getElementById('lblL').style.display='none';
  document.getElementById('lblR').style.display='none';
  document.getElementById('landing').style.display='flex';
  document.getElementById('startBtn').disabled=false;
}
</script>
</body>
</html>
