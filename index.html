<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>AR Vesak City</title>
    <style>
      * { margin:0; padding:0; box-sizing:border-box; }
      body { overflow:hidden; background:#000; font-family:sans-serif; }

      #loading {
        position:fixed; inset:0;
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        background:#000; color:#fff; z-index:20; gap:16px; text-align:center; padding:32px;
      }
      .title { font-size:26px; font-weight:bold; color:#ffd580; letter-spacing:1px; }
      .sub   { font-size:14px; color:#bbb; line-height:1.8; }

      #progressWrap { width:240px; }
      #progLabel { font-size:13px; color:#ffd580; margin-bottom:8px; }
      #progTrack { background:rgba(255,255,255,0.12); border-radius:8px; height:7px; overflow:hidden; }
      #progFill  { height:100%; background:linear-gradient(90deg,#ffd580,#ff9933); border-radius:8px; width:0%; transition:width 0.3s; }
      #errMsg    { color:#ff9966; font-size:12px; margin-top:8px; display:none; line-height:1.5; }

      #statusBar {
        position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
        background:rgba(0,0,0,0.65); backdrop-filter:blur(8px);
        color:#fff; font-size:13px; padding:10px 20px; border-radius:24px;
        z-index:6; display:none; text-align:center;
        border:1px solid rgba(255,255,255,0.12); transition:opacity 0.4s;
        max-width:88vw; white-space:normal;
      }
      #ringWrap {
        position:fixed; bottom:26%; left:50%; transform:translateX(-50%);
        width:110px; height:110px; display:none; z-index:5; pointer-events:none;
      }
      #ringWrap svg { width:100%; height:100%; }
      #ringBg   { fill:none; stroke:rgba(255,255,255,0.12); stroke-width:5; }
      #ringFill { fill:none; stroke:#00ffcc; stroke-width:5; stroke-linecap:round;
                  stroke-dasharray:283; stroke-dashoffset:283;
                  transform:rotate(-90deg); transform-origin:50% 50%;
                  transition:stroke-dashoffset 0.25s ease; }
      #ringPct  { fill:#fff; font-size:18px; font-weight:600; text-anchor:middle; dominant-baseline:central; }

      #nightBadge {
        position:fixed; top:14px; right:14px;
        background:rgba(255,180,30,0.18); border:1px solid rgba(255,180,30,0.4);
        color:#ffc84a; font-size:12px; padding:5px 11px; border-radius:14px;
        z-index:7; display:none;
      }
      #placedTick {
        position:fixed; top:50%; left:50%; transform:translate(-50%,-50%) scale(0);
        background:rgba(0,200,120,0.22); border:2px solid #00d484;
        border-radius:50%; width:72px; height:72px;
        display:flex; align-items:center; justify-content:center;
        color:#00d484; font-size:32px; z-index:8; pointer-events:none;
        transition:transform 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.5s; opacity:0;
      }
    </style>
  </head>
  <body>

    <div id="loading">
      <div class="title">🪷 AR Vesak City</div>
      <div class="sub" id="loadSub">Loading models…</div>
      <div id="progressWrap">
        <div id="progLabel">Starting…</div>
        <div id="progTrack"><div id="progFill"></div></div>
        <div id="errMsg"></div>
      </div>
    </div>

    <div id="ringWrap">
      <svg viewBox="0 0 100 100">
        <circle id="ringBg"   cx="50" cy="50" r="45"/>
        <circle id="ringFill" cx="50" cy="50" r="45"/>
        <text   id="ringPct"  x="50"  y="50">0%</text>
      </svg>
    </div>
    <div id="statusBar"></div>
    <div id="nightBadge">🌙 Night mode</div>
    <div id="placedTick">✓</div>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
      }
    }
    </script>

    <script type="module">
      import * as THREE   from 'three';
      import { ARButton } from 'three/addons/webxr/ARButton.js';
      import { GLTFLoader }  from 'three/addons/loaders/GLTFLoader.js';
      import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

      /* ── DOM ── */
      const elLoading   = document.getElementById('loading');
      const elLoadSub   = document.getElementById('loadSub');
      const elProgLabel = document.getElementById('progLabel');
      const elProgFill  = document.getElementById('progFill');
      const elErrMsg    = document.getElementById('errMsg');
      const elStatus    = document.getElementById('statusBar');
      const elRing      = document.getElementById('ringWrap');
      const elRingFill  = document.getElementById('ringFill');
      const elRingPct   = document.getElementById('ringPct');
      const elNight     = document.getElementById('nightBadge');
      const elTick      = document.getElementById('placedTick');

      /* ── R2 model URLs ── */
      const R2 = 'https://pub-7cbad791f95e4c9680981f095fab45e1.r2.dev/';
      const MODELS = [
        { key:'buddha',       url: R2+'stone_buddha_statue.glb', label:'Buddha Statue'   },
        { key:'lotus1',       url: R2+'lotus1.glb',              label:'Lotus Flower 1'  },
        { key:'lotus2',       url: R2+'lotus_flower2.glb',       label:'Lotus Flower 2'  },
        { key:'lotusLantern', url: R2+'lotus_lanttern.glb',      label:'Lotus Lantern'   },
        { key:'vesakLantern', url: R2+'vesak_lanterns.glb',      label:'Vesak Lantern'   },
        { key:'stupa',        url: R2+'sthupa_srilanka.glb',     label:'Sri Lanka Stupa' },
      ];

      /* ── GLTF / DRACO loader ── */
      const draco = new DRACOLoader();
      draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.5/');
      const gltfLoader = new GLTFLoader();
      gltfLoader.setDRACOLoader(draco);

      const cache = {};

      /* ── Parallel model loading ── */
      async function preload() {
        let done = 0;
        const total = MODELS.length;
        draco.preload();

        const jobs = MODELS.map(({ key, url, label }) =>
          new Promise(resolve => {
            gltfLoader.load(
              url,
              result => {
                cache[key] = result.scene;
                cache[key].traverse(n => {
                  if (n.isMesh) {
                    n.castShadow    = true;
                    n.receiveShadow = true;
                    if (n.material) n.material.needsUpdate = false;
                  }
                });
                done++;
                elProgLabel.textContent = `Loaded: ${label} (${done}/${total})`;
                elProgFill.style.width  = `${(done/total)*100}%`;
                resolve();
              },
              undefined,
              () => {
                console.warn(`Failed to load: ${key}`);
                cache[key] = null;
                done++;
                elProgFill.style.width  = `${(done/total)*100}%`;
                elErrMsg.style.display  = 'block';
                elErrMsg.textContent    = `⚠️ "${label}" failed — using placeholder.`;
                resolve();
              }
            );
          })
        );

        await Promise.all(jobs);

        elProgFill.style.width  = '100%';
        elProgLabel.textContent = '✅ Ready!';
        elLoadSub.textContent   = 'Tap "Start AR" then point at the floor.';
        setTimeout(() => elLoading.style.display = 'none', 700);
      }

      /* ── Fallback geometries (created once, shared) ── */
      const _fbGeo = {};
      const _fbMat = {};
      function getFallback(key) {
        if (!_fbGeo[key]) {
          _fbGeo.buddha       = new THREE.CylinderGeometry(0.2,0.3,1,8);
          _fbGeo.stupa        = new THREE.ConeGeometry(0.4,1.8,8);
          _fbGeo.lotus1       = new THREE.SphereGeometry(0.1,6,6);
          _fbGeo.lotus2       = new THREE.SphereGeometry(0.1,6,6);
          _fbGeo.lotusLantern = new THREE.SphereGeometry(0.12,6,6);
          _fbGeo.vesakLantern = new THREE.BoxGeometry(0.2,0.3,0.1);
          _fbMat.buddha       = new THREE.MeshStandardMaterial({color:0xf3e5ab});
          _fbMat.stupa        = new THREE.MeshStandardMaterial({color:0xffffff,roughness:0.4});
          _fbMat.lotus1       = new THREE.MeshStandardMaterial({color:0xff7fbf});
          _fbMat.lotus2       = new THREE.MeshStandardMaterial({color:0xff99cc});
          _fbMat.lotusLantern = new THREE.MeshStandardMaterial({color:0xffaa55,emissive:0xff8800,emissiveIntensity:1});
          _fbMat.vesakLantern = new THREE.MeshStandardMaterial({color:0xff5522,emissive:0xff9933,emissiveIntensity:0.8});
        }
        const root = new THREE.Group();
        const geo  = _fbGeo[key] || new THREE.BoxGeometry(0.2,0.2,0.2);
        const mat  = _fbMat[key] || new THREE.MeshStandardMaterial({color:0xaaa});
        root.add(new THREE.Mesh(geo, mat));
        return root;
      }

      /* ── Reusable Box3 helpers ── */
      const _box3  = new THREE.Box3();
      const _size3 = new THREE.Vector3();
      const _cent3 = new THREE.Vector3();

      function getModel(key, targetHeight) {
        const root = cache[key] ? cache[key].clone(true) : getFallback(key);
        _box3.setFromObject(root);
        _box3.getSize(_size3);
        _box3.getCenter(_cent3);
        const s = targetHeight / (_size3.y || 1);
        root.scale.setScalar(s);
        root.position.x -= _cent3.x * s;
        root.position.z -= _cent3.z * s;
        root.position.y -= _box3.min.y * s;
        return root;
      }

      /* ── Renderer ── */
      const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
      // FIX SPEED: cap pixel ratio at 1.5 instead of 2 — big win on high-DPI mobile
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.xr.enabled        = true;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type    = THREE.PCFSoftShadowMap;

      Object.assign(renderer.domElement.style, {
        position:'fixed', top:'0', left:'0', width:'100%', height:'100%', zIndex:'1'
      });
      document.body.appendChild(renderer.domElement);

      const scene  = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 60);

      /* ── Lights ── */
      scene.add(new THREE.HemisphereLight(0xffe4b5, 0x664422, 1.3));
      const sun = new THREE.DirectionalLight(0xfff8e0, 0.9);
      sun.position.set(4, 10, 5);
      sun.castShadow = true;
      sun.shadow.mapSize.set(512, 512); // FIX SPEED: 512 vs 1024 → 4× cheaper shadow map
      sun.shadow.camera.near = 0.5;
      sun.shadow.camera.far  = 25;
      scene.add(sun);
      scene.add(new THREE.AmbientLight(0xffd580, 0.5));

      /* ── PointLight pool (reduced to 6 for speed) ── */
      // FIX SPEED: 8 → 6 pool lights, fewer GPU light passes
      const POOL_SIZE = 6;
      const lightPool = [];
      const lightPhases    = [0, 0.8, 1.6, 2.4, 3.2, 4.0];
      const lightPositions = [
        [-2.5, 1.0, -5.0],
        [ 5.5, 1.2, -5.5],
        [ 0.0, 0.6, -7.5],
        [ 0.0, 0.8, -3.5],
        [-3.0, 0.5, -4.5],
        [ 3.0, 0.5, -4.5],
      ];
      for (let i = 0; i < POOL_SIZE; i++) {
        const pl = new THREE.PointLight(0xffa040, 0.9, 5.5);
        pl.position.set(...lightPositions[i]);
        lightPool.push({ light: pl, phase: lightPhases[i] });
      }

      /* ── Reticle ── */
      const reticle = new THREE.Mesh(
        new THREE.RingGeometry(0.08, 0.13, 32).rotateX(-Math.PI/2),
        new THREE.MeshBasicMaterial({ color:0x00ffcc, transparent:true, opacity:0.9 })
      );
      reticle.matrixAutoUpdate = false;
      reticle.visible = false;
      scene.add(reticle);

      const arBtn = ARButton.createButton(renderer, { requiredFeatures:['hit-test'] });
      arBtn.style.zIndex = '10';
      document.body.appendChild(arBtn);

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      /* ── AR state ── */
      const CIRCUM     = 2*Math.PI*45;
      const FRAMES_DAY = 18, FRAMES_NIGHT = 5;
      const DRIFT_DAY  = 0.06, DRIFT_NIGHT = 0.18;
      const FALLBACK_MS = 4000;

      let hitSource = null, hitRequested = false;
      let placed = false, sessionStart = null, stableCount = 0;
      const lastHit = new THREE.Vector3();
      let isNight = false;

      const flyingLanterns = [];
      let fireflyPoints = null;
      let fireflyPositions = null;
      const diyas = [];          // animated diya flames
      const prayerFlags = [];    // animated flag panels

      /* ── Brightness sensor ── */
      let vidEl = null, brCtx = null;
      function startBrightness() {
        navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false})
          .then(stream => {
            vidEl = document.createElement('video');
            vidEl.srcObject = stream; vidEl.playsInline = true; vidEl.muted = true; vidEl.play();
            const c = document.createElement('canvas'); c.width=32; c.height=32;
            brCtx = c.getContext('2d',{willReadFrequently:true});
            setInterval(()=>{
              if(!vidEl||vidEl.readyState<2) return;
              brCtx.drawImage(vidEl,0,0,32,32);
              const d=brCtx.getImageData(0,0,32,32).data;
              let l=0; for(let i=0;i<d.length;i+=4) l+=0.299*d[i]+0.587*d[i+1]+0.114*d[i+2];
              l/=1024;
              if((l<60)!==isNight){ isNight=l<60; elNight.style.display=isNight?'block':'none'; }
            },1500);
          }).catch(()=>{});
      }

      renderer.xr.addEventListener('sessionstart', () => {
        elLoading.style.display = 'none';
        sessionStart = performance.now();
        showStatus('🔍 Aim at the floor ahead…');
        elRing.style.display = 'block';
        startBrightness();
      });
      renderer.xr.addEventListener('sessionend', () => {
        hitSource=null; hitRequested=false; placed=false; stableCount=0; sessionStart=null;
      });

      /* ── Render loop ── */
      // FIX SPEED: throttle non-critical animations — only animate every other frame
      let _animFrame = 0;
      renderer.setAnimationLoop((ts, frame) => {
        _animFrame++;

        if (frame) {
          const session  = renderer.xr.getSession();
          const refSpace = renderer.xr.getReferenceSpace();

          if (!hitRequested && session) {
            session.requestReferenceSpace('viewer').then(vs =>
              session.requestHitTestSource({space:vs}).then(s => hitSource=s)
            );
            hitRequested = true;
          }

          if (!placed) {
            const maxF = isNight ? FRAMES_NIGHT : FRAMES_DAY;
            const maxD = isNight ? DRIFT_NIGHT  : DRIFT_DAY;
            let gotHit = false;

            if (hitSource) {
              const hits = frame.getHitTestResults(hitSource);
              if (hits.length) {
                const pose = hits[0].getPose(refSpace);
                reticle.visible = true;
                reticle.matrix.fromArray(pose.transform.matrix);
                const hp = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
                const drift = hp.distanceTo(lastHit);
                stableCount = drift < maxD ? stableCount+1 : (isNight ? Math.max(0,stableCount-1) : 0);
                lastHit.copy(hp); gotHit = true;
                const pct = Math.min(100,(stableCount/maxF)*100);
                setRing(pct);
                showStatus((isNight?'🌙 Night mode…':'🔍 Detecting floor…')+' '+Math.round(pct)+'%');
                if (stableCount >= maxF) placeCity('hittest');
              } else {
                reticle.visible = false;
                stableCount = isNight ? Math.max(0,stableCount-1) : 0;
                setRing(Math.min(100,(stableCount/maxF)*100));
                showStatus('📱 Point camera at the floor…');
              }
            }
            if (!gotHit && sessionStart && performance.now()-sessionStart > FALLBACK_MS) placeCity('fallback');
          }
        }

        animLanterns(ts);
        // FIX SPEED: lights and fireflies on every other frame — imperceptible difference
        if (_animFrame % 2 === 0) {
          animLights(ts);
          animFireflies(ts);
          animDiyas(ts);
          animPrayerFlags(ts);
        }
        renderer.render(scene, camera);
      });

      /* ── Place city ── */
      function placeCity(method) {
        placed=true; reticle.visible=false; elRing.style.display='none';
        const world = new THREE.Group();

        if (method==='hittest') {
          world.position.setFromMatrixPosition(reticle.matrix);
          const e = reticle.matrix.elements;
          world.rotation.y = Math.atan2(e[8], e[10]);
        } else {
          const cp=new THREE.Vector3(), cd=new THREE.Vector3();
          camera.getWorldPosition(cp); camera.getWorldDirection(cd);
          cd.y=0; if(cd.lengthSq()<0.001) cd.set(0,0,-1); cd.normalize();
          world.position.set(cp.x+cd.x*1.5, cp.y-1.6, cp.z+cd.z*1.5);
          world.rotation.y = Math.atan2(cd.x,cd.z)+Math.PI;
        }

        scene.add(world);
        buildCity(world);

        elTick.style.transform='translate(-50%,-50%) scale(1)'; elTick.style.opacity='1';
        setTimeout(()=>{ elTick.style.opacity='0'; elTick.style.transform='translate(-50%,-50%) scale(0.8)'; },1300);
        showStatus('🪷 Vesak City placed'+(method==='fallback'?' (floor estimated)':''));
        setTimeout(hideStatus, 3000);
      }

      /* ══════════════════════════════════════════════════════════════════
         BUILD CITY
      ══════════════════════════════════════════════════════════════════ */
      function buildCity(w) {
        lightPool.forEach(({ light }) => w.add(light));
        floorDeco(w);
        lotusPath(w);
        buddhaStatue(w);
        stupaRight(w);
        vesakLanternCluster(w);
        lotusLanterns(w);
        flyingLanternGroup(w, 18);
        fireflyCloud(w);
        diyaArrangement(w);       // 🪔 oil lamps near Buddha
        prayerFlagStrings(w);     // 🏳️ prayer flags near Buddha
      }

      /* ── Floor mandala ── */
      function floorDeco(p) {
        p.add(new THREE.Mesh(
          new THREE.CircleGeometry(5.5,64).rotateX(-Math.PI/2),
          new THREE.MeshBasicMaterial({color:0xffd580,transparent:true,opacity:0.04,side:THREE.DoubleSide})
        ));
        [1.2,2.3,3.5,4.7].forEach(r => {
          p.add(new THREE.Mesh(
            new THREE.RingGeometry(r,r+0.025,64).rotateX(-Math.PI/2),
            new THREE.MeshBasicMaterial({color:0xffc84a,transparent:true,opacity:0.09,side:THREE.DoubleSide})
          ));
        });
      }

      /* ── Buddha statue ── */
      function buddhaStatue(p) {
        const m = getModel('buddha', 1.9);
        m.position.set(-2.5, 0, -5);
        m.rotation.y = 0.22;
        p.add(m);

        const halo = new THREE.Mesh(
          new THREE.RingGeometry(0.58,0.72,40),
          new THREE.MeshBasicMaterial({color:0xffe070,transparent:true,opacity:0.65,side:THREE.DoubleSide})
        );
        halo.position.set(0, 2.15, -0.08); halo.rotation.x = -0.15;
        m.add(halo);

        const inc = new THREE.Mesh(new THREE.SphereGeometry(0.06,6,6),
          new THREE.MeshStandardMaterial({color:0xffaa44,emissive:0xff8800,emissiveIntensity:3,transparent:true,opacity:0.9}));
        inc.position.set(-2.5, 0.65, -4.6); p.add(inc);
      }

      /* ── Stupa — FIX 1: NO lotus flowers around stupa, NO offering candles ── */
      function stupaRight(p) {
        const STUPA_X = 5.5, STUPA_Z = -5.5;
        const m = getModel('stupa', 2.4);
        m.position.set(STUPA_X, 0, STUPA_Z);
        m.rotation.y = -0.18;
        p.add(m);
        // ✅ Removed: 8 lotus ring, 4 candle orbs — stupa area is now clean
      }

      /* ── Vesak lantern cluster ── */
      function vesakLanternCluster(p) {
        const spots = [
          [0,    2.0, -7.5, 0.75],
          [-1.1, 1.8, -8.5, 0.55],
          [ 1.1, 1.8, -8.5, 0.55],
          [-0.5, 1.6, -6.5, 0.50],
          [ 0.5, 1.6, -6.5, 0.50],
          [ 0,   2.2, -9.5, 0.50],
          [-1.8, 1.7, -7.0, 0.45],
          [ 1.8, 1.7, -7.0, 0.45],
        ];
        const stringMat = new THREE.MeshBasicMaterial({color:0x8b6914});

        spots.forEach(([x, hangY, z, h]) => {
          const m = getModel('vesakLantern', h);
          m.position.set(x, hangY, z);
          m.rotation.y = (Math.random()-0.5)*0.6;
          p.add(m);

          const ceilY = 3.2;
          const topY  = hangY + h;
          const strLen = ceilY - topY;
          if (strLen > 0.05) {
            const sg = new THREE.CylinderGeometry(0.005, 0.005, strLen, 4);
            const sm = new THREE.Mesh(sg, stringMat);
            sm.position.set(x, topY + strLen/2, z);
            p.add(sm);
          }
        });

        // String light beads
        for (let i=0; i<=14; i++) {
          const t = i/14;
          const bead = new THREE.Mesh(
            new THREE.SphereGeometry(0.052,5,5),
            new THREE.MeshStandardMaterial({color:0xff9933,emissive:0xff6600,emissiveIntensity:2.8,transparent:true,opacity:0.95})
          );
          bead.position.set(
            -2.5 + t*5.5,
            2.1 - Math.sin(t*Math.PI)*0.4,
            -5.0 - t*0.5
          );
          p.add(bead);
        }
      }

      /* ── Lotus path — FIX 2: removed gardenOrbs (path light poles), FIX 1: no cluster near stupa ── */
      function lotusPath(p) {
        // Centre path flowers
        for (let i=0; i<11; i++) {
          const key = i%2===0 ? 'lotus1' : 'lotus2';
          const h   = 0.18 + Math.random()*0.10;
          const m   = getModel(key, h);
          const sx  = i%2===0 ? -0.62 : 0.62;
          m.position.set(sx+(Math.random()-0.5)*0.12, 0, -1.5-i*1.05+(Math.random()-0.5)*0.18);
          m.rotation.y = Math.random()*Math.PI*2;
          p.add(m);
        }

        // Side clusters — FIX 1: removed [-4.2,0,-4.0] and [4.2,0,-4.0]
        // which were near stupa area. Also removed [1.0,0,-5.5] / [-1.0,0,-5.5]
        // which were overlapping the central path lanterns.
        [
          [-1.9,0,-2.5],[1.9,0,-2.5],    // entrance sides
          [-1.6,0,-8.5],[1.6,0,-8.5],    // far back
          [-4.0,0,-7.5],[4.0,0,-7.5],    // wide sides, well clear of stupa
        ].forEach(([x,y,z],idx) => {
          const n = 2 + Math.floor(Math.random()*3);
          for (let j=0; j<n; j++) {
            const a = (j/n)*Math.PI*2;
            const m = getModel(idx%2===0?'lotus1':'lotus2', 0.12+Math.random()*0.07);
            m.position.set(x+Math.cos(a)*0.35, 0, z+Math.sin(a)*0.35);
            m.rotation.y = Math.random()*Math.PI*2;
            p.add(m);
          }
        });
      }

      /* ── Lotus lanterns (path-side) — FIX 2: these are NOT light poles, kept as-is ── */
      function lotusLanterns(p) {
        [
          [-1.3,0,-10],[1.3,0,-10],
          [-2.6,0,-8.8],[2.6,0,-8.8],
          [-0.6,0,-11.5],[0.6,0,-11.5],
          // FIX 2: removed [-3.8,0,-3.2],[3.8,0,-3.2] and [-3.8,0,-6.5],[3.8,0,-6.5]
          // — these were the tall path-side orb poles flanking the walkway
          [0,0,-12.5],
        ].forEach(([x,y,z]) => {
          const m = getModel('lotusLantern', 0.36);
          m.position.set(x,y,z);
          m.rotation.y = Math.random()*Math.PI*2;
          p.add(m);
        });
      }

      /* ── Flying sky lanterns ── */
      function flyingLanternGroup(p, count) {
        for (let i=0; i<count; i++) {
          const l = mkSkyLantern();
          l.position.set((Math.random()-0.5)*8, 0.4+Math.random()*0.5, -1-Math.random()*10);
          l.userData = {
            speed : 0.011+Math.random()*0.019,
            driftX: (Math.random()-0.5)*0.0014,
            driftZ: -0.001-Math.random()*0.001,
            phase : Math.random()*Math.PI*2
          };
          flyingLanterns.push(l); p.add(l);
        }
      }

      // Shared lantern geometry/material (created once)
      const _lanternBodyGeo = new THREE.SphereGeometry(0.21,8,6);   // FIX SPEED: 10,8 → 8,6
      const _lanternRingGeo = new THREE.TorusGeometry(0.16,0.022,5,16); // FIX SPEED: 6,20 → 5,16
      const _lanternFlamGeo = new THREE.ConeGeometry(0.056,0.19,5);  // FIX SPEED: 6 → 5 segments
      const _lanternBodyMat = new THREE.MeshStandardMaterial({color:0xffeb99,emissive:0xffd36b,emissiveIntensity:1.5,transparent:true,opacity:0.87});
      const _lanternRingMat = new THREE.MeshStandardMaterial({color:0x7a4a2c});
      const _lanternFlamMat = new THREE.MeshStandardMaterial({color:0xffa533,emissive:0xff7700,emissiveIntensity:4});

      function mkSkyLantern() {
        const g = new THREE.Group();
        const b = new THREE.Mesh(_lanternBodyGeo, _lanternBodyMat);
        b.scale.set(1,1.38,1); g.add(b);
        const r = new THREE.Mesh(_lanternRingGeo, _lanternRingMat);
        r.rotation.x=Math.PI/2; r.position.y=-0.28; g.add(r);
        const f = new THREE.Mesh(_lanternFlamGeo, _lanternFlamMat);
        f.position.y=-0.19; f.rotation.x=Math.PI; g.add(f);
        return g;
      }

      /* ── Fireflies — single Points draw call ── */
      // FIX SPEED: reduced FF_COUNT 32 → 20
      const FF_COUNT = 20;
      function fireflyCloud(p) {
        fireflyPositions = new Float32Array(FF_COUNT * 3);
        const baseY  = new Float32Array(FF_COUNT);
        const phases = new Float32Array(FF_COUNT);

        for (let i = 0; i < FF_COUNT; i++) {
          fireflyPositions[i*3]   = (Math.random()-0.5)*9;
          fireflyPositions[i*3+1] = 0.15 + Math.random()*2.0;
          fireflyPositions[i*3+2] = -0.5 - Math.random()*11;
          baseY[i]  = fireflyPositions[i*3+1];
          phases[i] = Math.random()*Math.PI*2;
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(fireflyPositions, 3));
        geo.userData = { baseY, phases };

        const mat = new THREE.PointsMaterial({
          color: 0xffe7aa,
          size: 0.07,
          transparent: true,
          opacity: 0.85,
          sizeAttenuation: true,
        });

        fireflyPoints = new THREE.Points(geo, mat);
        p.add(fireflyPoints);
      }

      /* ══════════════════════════════════════════════════════════════════
         🪔 DIYA OIL LAMPS — realistic clay bowl with animated flame
         Placed in a semicircular arc in front of the Buddha statue
         and a straight row along the offering platform edge.
      ══════════════════════════════════════════════════════════════════ */

      // Shared diya materials — created once, reused across all lamps
      const _clayMat = new THREE.MeshStandardMaterial({
        color: 0xc1673a, roughness: 0.85, metalness: 0.0,
        // terracotta clay colour with matte finish
      });
      const _gheePoolMat = new THREE.MeshStandardMaterial({
        color: 0xf5e090, roughness: 0.2, metalness: 0.1,
        // pale yellow clarified butter pool
      });
      const _wickMat = new THREE.MeshStandardMaterial({
        color: 0x3a2a14, roughness: 1.0,
      });

      // One diya = clay bowl + ghee pool + wick + flame cone + glow sphere
      function mkDiya() {
        const g = new THREE.Group();

        // Clay outer bowl — flattened hemisphere, pinched rim
        const bowl = new THREE.Mesh(
          new THREE.SphereGeometry(0.072, 12, 8, 0, Math.PI*2, 0, Math.PI*0.58),
          _clayMat
        );
        bowl.scale.y = 0.44;   // squash into a shallow dish
        bowl.rotation.x = Math.PI; // open side up
        g.add(bowl);

        // Flat clay base disc
        const base = new THREE.Mesh(
          new THREE.CylinderGeometry(0.052, 0.062, 0.018, 10),
          _clayMat
        );
        base.position.y = -0.012;
        g.add(base);

        // Ghee pool surface — flat disc sitting inside bowl
        const ghee = new THREE.Mesh(
          new THREE.CylinderGeometry(0.048, 0.048, 0.004, 10),
          _gheePoolMat
        );
        ghee.position.y = 0.016;
        g.add(ghee);

        // Cotton wick stub
        const wick = new THREE.Mesh(
          new THREE.CylinderGeometry(0.004, 0.004, 0.03, 5),
          _wickMat
        );
        wick.position.set(0.018, 0.028, 0);
        g.add(wick);

        // Flame — two overlapping translucent cones for depth
        const flameMat = new THREE.MeshStandardMaterial({
          color: 0xff8800, emissive: 0xff5500, emissiveIntensity: 4,
          transparent: true, opacity: 0.88, side: THREE.DoubleSide,
          depthWrite: false,
        });
        const flameInnerMat = new THREE.MeshStandardMaterial({
          color: 0xffee88, emissive: 0xffcc44, emissiveIntensity: 6,
          transparent: true, opacity: 0.72, side: THREE.DoubleSide,
          depthWrite: false,
        });

        const flameOuter = new THREE.Mesh(
          new THREE.ConeGeometry(0.013, 0.065, 6), flameMat
        );
        flameOuter.position.set(0.018, 0.074, 0);
        g.add(flameOuter);

        const flameInner = new THREE.Mesh(
          new THREE.ConeGeometry(0.007, 0.042, 5), flameInnerMat
        );
        flameInner.position.set(0.018, 0.076, 0);
        g.add(flameInner);

        // Soft warm glow sphere — emissive, no extra PointLight (perf)
        const glow = new THREE.Mesh(
          new THREE.SphereGeometry(0.038, 6, 6),
          new THREE.MeshStandardMaterial({
            color: 0xff9922, emissive: 0xff7700, emissiveIntensity: 2.2,
            transparent: true, opacity: 0.18, depthWrite: false,
          })
        );
        glow.position.set(0.018, 0.062, 0);
        g.add(glow);

        // Store flame refs for animation
        g.userData.flameOuter = flameOuter;
        g.userData.flameInner = flameInner;
        g.userData.glow = glow;
        g.userData.phase = Math.random() * Math.PI * 2;

        return g;
      }

      function diyaArrangement(p) {
        const BUDDHA_X = -2.5, BUDDHA_Z = -5.0;

        // ── Row 1: Semicircular arc in front of Buddha (radius 1.1m) ──
        // 7 diyas fanning 200° in front of the statue
        const ARC_R = 1.1;
        const ARC_DIYAS = 7;
        const ARC_START = -Math.PI * 0.56;  // left
        const ARC_END   =  Math.PI * 0.56;  // right
        for (let i = 0; i < ARC_DIYAS; i++) {
          const t = i / (ARC_DIYAS - 1);
          const angle = ARC_START + t * (ARC_END - ARC_START);
          const dx = new THREE.Group();
          const lamp = mkDiya();
          // Rotate each diya so its spout faces outward
          lamp.rotation.y = angle + Math.PI * 0.5;
          dx.add(lamp);
          dx.position.set(
            BUDDHA_X + Math.sin(angle) * ARC_R,
            0,
            BUDDHA_Z + Math.cos(angle) * ARC_R
          );
          diyas.push(lamp);
          p.add(dx);
        }

        // ── Row 2: Straight offering shelf row, 5 lamps, closer in ──
        // Tight line directly in front of statue at z = -3.9
        const SHELF_Z = BUDDHA_Z + 0.9;
        for (let i = 0; i < 5; i++) {
          const lamp = mkDiya();
          lamp.position.set(BUDDHA_X - 0.36 + i * 0.18, 0.0, SHELF_Z);
          lamp.rotation.y = Math.random() * 0.2 - 0.1;
          diyas.push(lamp);
          p.add(lamp);
        }

        // ── Row 3: 2 solo lamps flanking Buddha on low stone pedestals ──
        [[-1.1, 0, -0.5], [1.1, 0, -0.5]].forEach(([ox, oy, oz]) => {
          // Pedestal — small stone cylinder
          const pedestal = new THREE.Mesh(
            new THREE.CylinderGeometry(0.055, 0.065, 0.09, 8),
            new THREE.MeshStandardMaterial({ color: 0x8a7a6a, roughness: 0.9 })
          );
          pedestal.position.set(BUDDHA_X + ox, 0.045, BUDDHA_Z + oz);
          p.add(pedestal);

          const lamp = mkDiya();
          lamp.position.set(BUDDHA_X + ox, 0.092, BUDDHA_Z + oz);
          diyas.push(lamp);
          p.add(lamp);
        });
      }

      /* ══════════════════════════════════════════════════════════════════
         🏳️ PRAYER FLAGS — 5 colour panels strung on two strings
         Two strings fan out from a centre pole behind the Buddha
         to side poles, creating a traditional Tibetan-style torana.
      ══════════════════════════════════════════════════════════════════ */

      // Traditional Buddhist flag colours: blue, white, red, green, yellow
      const FLAG_COLORS = [0x1a5fcc, 0xf5f5f0, 0xd42b2b, 0x1e8a2e, 0xf0c820];
      const FLAG_EMISSIVE = [0x0a2a66, 0x888880, 0x661010, 0x0a4010, 0x886600];

      function mkFlagPanel(color, emissive, width, height) {
        const g = new THREE.Group();

        // Fabric panel — PlaneGeometry with slight wave via userData
        const mat = new THREE.MeshStandardMaterial({
          color, emissive, emissiveIntensity: 0.15,
          roughness: 0.9, metalness: 0.0,
          side: THREE.DoubleSide,
        });
        const panel = new THREE.Mesh(
          new THREE.PlaneGeometry(width, height, 4, 6),
          mat
        );
        // Hang from top edge — pivot at y=0, panel hangs downward
        panel.position.y = -height * 0.5;
        g.add(panel);

        // Top hem — dark cord/fabric edge
        const hemMat = new THREE.MeshStandardMaterial({ color: 0x3a2a10, roughness: 1 });
        const hem = new THREE.Mesh(
          new THREE.BoxGeometry(width, 0.012, 0.008),
          hemMat
        );
        hem.position.y = 0;
        g.add(hem);

        // Bottom hem weight (keeps flag hanging straight-ish)
        const weight = new THREE.Mesh(
          new THREE.BoxGeometry(width, 0.010, 0.008),
          hemMat
        );
        weight.position.y = -height;
        g.add(weight);

        g.userData.panel = panel;
        g.userData.phase = Math.random() * Math.PI * 2;
        g.userData.panelGeo = panel.geometry;
        return g;
      }

      function prayerFlagStrings(p) {
        const BUDDHA_X = -2.5, BUDDHA_Z = -5.0;

        // Pole positions: centre-back (behind Buddha) → two side poles
        const poles = [
          { x: BUDDHA_X - 1.9, z: BUDDHA_Z - 1.4 },   // left side pole
          { x: BUDDHA_X,       z: BUDDHA_Z - 2.1 },   // centre-back pole (tallest)
          { x: BUDDHA_X + 1.9, z: BUDDHA_Z - 1.4 },   // right side pole
        ];
        const POLE_H = 2.8;

        // Shared pole material — dark bamboo
        const poleMat = new THREE.MeshStandardMaterial({ color: 0x5c3d18, roughness: 0.85, metalness: 0.05 });
        const poleGeo = new THREE.CylinderGeometry(0.018, 0.022, POLE_H, 7);

        poles.forEach(({ x, z }) => {
          const pole = new THREE.Mesh(poleGeo, poleMat);
          pole.position.set(x, POLE_H * 0.5, z);
          p.add(pole);
        });

        // String rope between poles — thin dark line
        const ropeMat = new THREE.MeshBasicMaterial({ color: 0x2a1a08 });

        // Two strings: left-pole → centre-back, centre-back → right-pole
        const stringPairs = [
          [poles[0], poles[1]],
          [poles[1], poles[2]],
        ];

        const FLAG_W = 0.19, FLAG_H = 0.24, FLAG_GAP = 0.04;
        const HANG_Y = POLE_H - 0.08;  // just below pole tip

        stringPairs.forEach(([poleA, poleB]) => {
          const ax = poleA.x, az = poleA.z;
          const bx = poleB.x, bz = poleB.z;
          const dx = bx - ax, dz = bz - az;
          const dist = Math.sqrt(dx*dx + dz*dz);
          const angle = Math.atan2(dx, dz); // rotation around Y

          // Rope mesh along the string
          const ropeLen = dist;
          const rope = new THREE.Mesh(
            new THREE.CylinderGeometry(0.004, 0.004, ropeLen, 4),
            ropeMat
          );
          rope.rotation.x = Math.PI * 0.5;
          rope.rotation.y = angle;
          rope.position.set(
            (ax + bx) * 0.5,
            HANG_Y,
            (az + bz) * 0.5
          );
          p.add(rope);

          // Place 5 flag panels along this string
          const TOTAL_FLAGS = 5;
          for (let fi = 0; fi < TOTAL_FLAGS; fi++) {
            const t = (fi + 0.5) / TOTAL_FLAGS;
            const fx = ax + dx * t;
            const fz = az + dz * t;

            // Catenary sag — string dips slightly in centre
            const sag = Math.sin(t * Math.PI) * 0.18;

            const col = FLAG_COLORS[fi % FLAG_COLORS.length];
            const emi = FLAG_EMISSIVE[fi % FLAG_EMISSIVE.length];
            const flag = mkFlagPanel(col, emi, FLAG_W, FLAG_H);
            flag.position.set(fx, HANG_Y - sag, fz);
            flag.rotation.y = angle;  // face perpendicular to string
            prayerFlags.push(flag);
            p.add(flag);
          }
        });
      }

      /* ── Animations ── */
      function animLanterns(t) {
        flyingLanterns.forEach(l => {
          l.position.y += l.userData.speed;
          l.position.x += l.userData.driftX + Math.sin(t*0.001+l.userData.phase)*0.0007;
          l.position.z += l.userData.driftZ;
          l.rotation.y += 0.003;
          l.rotation.z  = Math.sin(t*0.001+l.userData.phase)*0.05;
          if (l.position.y > 14) {
            l.position.y = 0.5;
            l.position.x = (Math.random()-0.5)*8;
            l.position.z = -1-Math.random()*10;
          }
        });
      }

      // 🪔 Diya flame flicker — realistic random-phase intensity + scale wobble
      function animDiyas(t) {
        diyas.forEach(lamp => {
          const ph = lamp.userData.phase;
          // Multi-frequency flicker for organic feel
          const flicker = 0.82
            + 0.12 * Math.sin(t * 0.018 + ph)
            + 0.06 * Math.sin(t * 0.047 + ph * 2.3)
            + 0.04 * Math.sin(t * 0.091 + ph * 0.7);

          const fo = lamp.userData.flameOuter;
          const fi = lamp.userData.flameInner;
          const gw = lamp.userData.glow;

          if (fo) {
            fo.scale.x = 0.88 + 0.24 * Math.sin(t * 0.023 + ph);
            fo.scale.y = flicker;
            fo.scale.z = 0.88 + 0.18 * Math.cos(t * 0.031 + ph);
            fo.material.emissiveIntensity = 3.2 + 1.5 * flicker;
          }
          if (fi) {
            fi.scale.y = flicker * 1.05;
            fi.material.emissiveIntensity = 5.5 + 2.0 * flicker;
          }
          if (gw) {
            gw.material.opacity = 0.12 + 0.10 * flicker;
            gw.scale.setScalar(0.9 + 0.3 * flicker);
          }
        });
      }

      // 🏳️ Prayer flag gentle breeze sway
      function animPrayerFlags(t) {
        prayerFlags.forEach(flag => {
          const ph = flag.userData.phase;
          // Gentle Y-axis sway (flag swings side to side in breeze)
          flag.rotation.z = 0.04 * Math.sin(t * 0.0022 + ph)
                          + 0.02 * Math.sin(t * 0.0055 + ph * 1.7);

          // Fabric ripple — deform panel geometry vertices
          const geo = flag.userData.panelGeo;
          if (geo) {
            const pos = geo.attributes.position;
            for (let i = 0; i < pos.count; i++) {
              const vy = pos.getY(i);
              const vx = pos.getX(i);
              // Wave amplitude increases toward bottom (free edge)
              const freeness = Math.abs(vy / -0.12) + 0.1;
              const wave = 0.008 * freeness
                * Math.sin(t * 0.0035 + ph + vx * 8 + vy * 4);
              pos.setZ(i, wave);
            }
            pos.needsUpdate = true;
          }
        });
      }

      function animLights(t) {
        lightPool.forEach(({ light, phase }) => {
          light.intensity = 0.52 + 0.30*Math.sin(t*0.006+phase);
          light.color.setHSL(0.09, 0.9, 0.50+0.13*Math.sin(t*0.011+phase));
        });
      }

      function animFireflies(t) {
        if (!fireflyPoints) return;
        const pos = fireflyPoints.geometry.attributes.position;
        for (let i = 0; i < FF_COUNT; i++) {
          pos.array[i*3]   += Math.sin(t*0.0007+i)*0.0006;
          pos.array[i*3+1] += 0.0019;
          if (pos.array[i*3+1] > 2.7) pos.array[i*3+1] = 0.15;
        }
        pos.needsUpdate = true;
        fireflyPoints.material.opacity = 0.55 + 0.35*Math.abs(Math.sin(t*0.0014));
      }

      /* ── Status helpers ── */
      function showStatus(msg){ elStatus.textContent=msg; elStatus.style.display='block'; elStatus.style.opacity='1'; }
      function hideStatus(){ elStatus.style.opacity='0'; setTimeout(()=>elStatus.style.display='none',400); }
      function setRing(pct){
        elRingFill.style.strokeDashoffset = CIRCUM*(1-pct/100);
        elRingPct.textContent = Math.round(pct)+'%';
        elRingFill.style.stroke = `hsl(${pct<50?174:174+(pct-50)*1.8},100%,55%)`;
      }

      /* ── Start ── */
      await preload();

    </script>
  </body>
