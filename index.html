<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>AR Vesak City</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { overflow:hidden; background:#000; font-family:sans-serif; }

    /* ==================== BEAUTIFUL VESAK LOADING SCREEN ==================== */
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap');

    :root {
      --gold: #ffc84a;
      --gold-dim: #c99520;
      --saffron: #ff9933;
      --ember: #ff6622;
      --deep: #0a0614;
    }

    #vesak-load {
      position: fixed;
      inset: 0;
      background: var(--deep);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Cinzel', serif;
      overflow: hidden;
    }

    .sky-wash, .horizon, .mandala, #stars, #lantern-layer { position:absolute; pointer-events:none; }
    .sky-wash { inset:0; background: radial-gradient(ellipse at 50% 0%, #1a0a2e 0%, #0a0614 60%, #000 100%); }
    .horizon { bottom:0; left:0; right:0; height:200px; background: linear-gradient(to top, #1a0a00 0%, #0a0614 50%, transparent 100%); }
    .mandala { bottom:-40px; left:50%; transform:translateX(-50%); width:340px; height:180px; background: radial-gradient(ellipse at 50% 100%, rgba(255,180,30,0.07) 0%, transparent 65%); }
    #stars { inset:0; }
    #lantern-layer { inset:0; }

    .content {
      position:relative; z-index:5;
      display:flex; flex-direction:column; align-items:center;
      text-align:center; padding:32px 24px;
    }

    .lotus-icon { width:72px; height:72px; margin-bottom:20px; animation: lotus-breathe 3s ease-in-out infinite; }
    @keyframes lotus-breathe {
      0%,100% { transform:scale(1) rotate(0deg); filter:drop-shadow(0 0 8px rgba(255,180,30,0.4)); }
      50% { transform:scale(1.06) rotate(3deg); filter:drop-shadow(0 0 18px rgba(255,140,0,0.7)); }
    }

    .brand {
      font-family:'Cinzel', serif;
      font-size:28px; font-weight:700; letter-spacing:3px;
      color: var(--gold);
      text-shadow: 0 0 30px rgba(255,200,74,0.5), 0 0 60px rgba(255,150,0,0.2);
      margin-bottom:4px;
      animation: title-glow 3s ease-in-out infinite;
    }
    @keyframes title-glow {
      0%,100% { text-shadow: 0 0 20px rgba(255,200,74,0.4); }
      50% { text-shadow: 0 0 40px rgba(255,200,74,0.8), 0 0 80px rgba(255,100,0,0.3); }
    }

    .brand-sub {
      font-family:'Crimson Pro', Georgia, serif;
      font-size:12px; font-weight:300; font-style:italic;
      letter-spacing:5px; text-transform:uppercase;
      color: rgba(255,180,60,0.55);
      margin-bottom:28px;
    }

    .pali {
      font-family:'Crimson Pro', Georgia, serif;
      font-size:14px; font-style:italic; font-weight:300;
      color:rgba(255,200,100,0.5);
      margin-bottom:22px;
      letter-spacing:1px;
    }

    .prog-wrap { width:220px; margin-bottom:14px; }
    .prog-label {
      font-family:'Crimson Pro', Georgia, serif;
      font-size:13px; font-weight:300;
      color:rgba(255,200,100,0.7);
      margin-bottom:10px;
      letter-spacing:0.5px;
      min-height:18px;
    }
    .prog-track {
      height:3px; background:rgba(255,200,80,0.1); border-radius:2px; overflow:hidden;
      margin-bottom:8px; position:relative;
    }
    .prog-fill {
      height:100%; background: linear-gradient(90deg, var(--gold-dim), var(--gold), var(--saffron));
      border-radius:2px; width:0%; transition:width 0.5s cubic-bezier(0.4,0,0.2,1);
      box-shadow: 0 0 8px rgba(255,180,0,0.6);
    }
    .prog-fill::after {
      content:''; position:absolute; right:0; top:-3px;
      width:6px; height:9px; background:white; border-radius:50%;
      box-shadow:0 0 10px rgba(255,200,100,0.9);
    }

    .dots { display:flex; gap:8px; justify-content:center; margin-bottom:20px; }
    .dot {
      width:5px; height:5px; border-radius:50%;
      background:rgba(255,200,80,0.2); transition:all 0.4s ease;
    }
    .dot.done { background:var(--gold); box-shadow:0 0 6px rgba(255,180,0,0.8); }
    .dot.active { background:var(--saffron); box-shadow:0 0 10px rgba(255,120,0,0.9); transform:scale(1.4); }

    .ar-btn-wrap {
      margin-top:4px; opacity:0; transform:translateY(10px);
      transition:opacity 0.6s ease, transform 0.6s ease;
    }
    .ar-btn-wrap.visible { opacity:1; transform:translateY(0); }

    .ar-btn {
      background:transparent; border:1px solid rgba(255,180,60,0.5); color:var(--gold);
      font-family:'Cinzel', serif; font-size:13px; letter-spacing:2px;
      padding:11px 30px; border-radius:2px; cursor:pointer; position:relative; overflow:hidden;
    }
    .ar-btn:hover { border-color:var(--gold); color:#fff; }
    .ar-btn .corner {
      position:absolute; width:8px; height:8px; border-color:var(--gold); border-style:solid; opacity:0.7;
    }
    .ar-btn .corner.tl { top:3px; left:3px; border-width:1px 0 0 1px; }
    .ar-btn .corner.tr { top:3px; right:3px; border-width:1px 1px 0 0; }
    .ar-btn .corner.bl { bottom:3px; left:3px; border-width:0 0 1px 1px; }
    .ar-btn .corner.br { bottom:3px; right:3px; border-width:0 1px 1px 0; }

    .hint-text {
      font-family:'Crimson Pro', Georgia, serif;
      font-size:12px; font-weight:300; font-style:italic;
      color:rgba(255,200,100,0.4); margin-top:10px;
    }

    /* Your original AR UI */
    #statusBar, #nightBadge, #placedTick, #ringWrap { z-index: 101; }
  </style>
</head>
<body>

  <!-- Beautiful Vesak Loading Screen -->
  <div id="vesak-load">
    <div class="sky-wash"></div>
    <div id="stars"></div>
    <svg id="lantern-layer" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="horizon"></div>
    <div class="mandala"></div>

    <div class="content">
      <svg class="lotus-icon" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="pg1" cx="50%" cy="80%" r="70%"><stop offset="0%" stop-color="#ff9933"/><stop offset="100%" stop-color="#ffd580"/></radialGradient>
          <radialGradient id="pg2" cx="50%" cy="80%" r="70%"><stop offset="0%" stop-color="#ffc84a"/><stop offset="100%" stop-color="#ffe499"/></radialGradient>
        </defs>
        <g transform="translate(36,42)">
          <ellipse cx="0" cy="-10" rx="8" ry="16" fill="url(#pg2)" opacity="0.9" transform="rotate(-40)"/>
          <ellipse cx="0" cy="-10" rx="8" ry="16" fill="url(#pg2)" opacity="0.9" transform="rotate(-20)"/>
          <ellipse cx="0" cy="-10" rx="8" ry="16" fill="url(#pg1)" opacity="0.95" transform="rotate(0)"/>
          <ellipse cx="0" cy="-10" rx="8" ry="16" fill="url(#pg2)" opacity="0.9" transform="rotate(20)"/>
          <ellipse cx="0" cy="-10" rx="8" ry="16" fill="url(#pg2)" opacity="0.9" transform="rotate(40)"/>
          <ellipse cx="0" cy="-8" rx="6" ry="13" fill="url(#pg1)" opacity="0.9" transform="rotate(-30)"/>
          <ellipse cx="0" cy="-8" rx="6" ry="13" fill="url(#pg1)" opacity="0.9" transform="rotate(-10)"/>
          <ellipse cx="0" cy="-8" rx="6" ry="13" fill="url(#pg1)" opacity="0.95" transform="rotate(10)"/>
          <ellipse cx="0" cy="-8" rx="6" ry="13" fill="url(#pg1)" opacity="0.9" transform="rotate(30)"/>
          <circle cx="0" cy="-2" r="7" fill="#ffc84a" opacity="0.95"/>
          <circle cx="0" cy="-2" r="4" fill="#ffe8a0" opacity="1"/>
          <ellipse cx="0" cy="8" rx="14" ry="5" fill="#0d0820" opacity="0.3"/>
        </g>
      </svg>

      <div class="brand">AR VESAK CITY</div>
      <div class="brand-sub">Augmented Reality · Vesak 2026</div>

      <div class="ornament">
        <div class="ornament-line"></div>
        <div class="ornament-diamond"></div>
        <div class="ornament-line r"></div>
      </div>

      <div class="pali">ශ්‍රද්ධා සම්පන්නං</div>

      <div class="prog-wrap">
        <div class="prog-label" id="prog-label">Initialising…</div>
        <div class="prog-track">
          <div class="prog-fill" id="prog-fill"></div>
        </div>
        <div id="err-msg" style="color:#ff9966; font-size:12px; margin-top:8px; display:none;"></div>
      </div>

      <div class="dots" id="dots">
        <div class="dot" id="d0"></div>
        <div class="dot" id="d1"></div>
        <div class="dot" id="d2"></div>
        <div class="dot" id="d3"></div>
        <div class="dot" id="d4"></div>
        <div class="dot" id="d5"></div>
      </div>

      <div class="ar-btn-wrap" id="ar-btn-wrap">
        <button class="ar-btn" id="start-ar-btn">
          <span class="corner tl"></span>
          <span class="corner tr"></span>
          <span class="corner bl"></span>
          <span class="corner br"></span>
          START AR
        </button>
        <div class="hint-text">Point your camera at the floor</div>
      </div>
    </div>
  </div>

  <!-- AR UI Elements -->
  <div id="statusBar"></div>
  <div id="nightBadge">🌙 Night mode</div>
  <div id="placedTick">✓</div>
  <div id="ringWrap">
    <svg viewBox="0 0 100 100">
      <circle id="ringBg" cx="50" cy="50" r="45" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="5"/>
      <circle id="ringFill" cx="50" cy="50" r="45" fill="none" stroke="#00ffcc" stroke-width="5" stroke-linecap="round"/>
      <text id="ringPct" x="50" y="50" fill="#fff" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="central">0%</text>
    </svg>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.150.1/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { ARButton } from 'three/addons/webxr/ARButton.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

    // ==================== LOADING SCREEN ELEMENTS ====================
    const vesakLoad = document.getElementById('vesak-load');
    const progLabel = document.getElementById('prog-label');
    const progFill = document.getElementById('prog-fill');
    const errMsg = document.getElementById('err-msg');
    const dots = [0,1,2,3,4,5].map(i => document.getElementById('d'+i));
    const arBtnWrap = document.getElementById('ar-btn-wrap');
    const startArBtn = document.getElementById('start-ar-btn');

    // ==================== YOUR ORIGINAL AR CODE STARTS HERE ====================
    const R2 = 'https://pub-7cbad791f95e4c9680981f095fab45e1.r2.dev/';
    const MODELS = [
      { key:'buddha',       url: R2+'stone_buddha_statue.glb', label:'Buddha Statue'   },
      { key:'lotus1',       url: R2+'lotus1.glb',              label:'Lotus Flower 1'  },
      { key:'lotus2',       url: R2+'lotus_flower2.glb',       label:'Lotus Flower 2'  },
      { key:'lotusLantern', url: R2+'lotus_lanttern.glb',      label:'Lotus Lantern'   },
      { key:'vesakLantern', url: R2+'vesak_lanterns.glb',      label:'Vesak Lantern'   },
      { key:'stupa',        url: R2+'sthupa_srilanka.glb',     label:'Sri Lanka Stupa' },
    ];

    const cache = {};

    async function preload() {
      let done = 0;
      const total = MODELS.length;
      const draco = new DRACOLoader();
      draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.5/');
      const gltfLoader = new GLTFLoader().setDRACOLoader(draco);

      const jobs = MODELS.map(({ key, url, label }) =>
        new Promise(resolve => {
          gltfLoader.load(url, 
            result => {
              cache[key] = result.scene;
              cache[key].traverse(n => {
                if (n.isMesh) {
                  n.castShadow = true;
                  n.receiveShadow = true;
                }
              });
              done++;
              progLabel.textContent = `Loaded: ${label} (${done}/${total})`;
              progFill.style.width = `${(done/total)*100}%`;
              resolve();
            },
            undefined,
            () => {
              console.warn(`Failed: ${key}`);
              cache[key] = null;
              done++;
              progFill.style.width = `${(done/total)*100}%`;
              errMsg.style.display = 'block';
              errMsg.textContent = `⚠️ ${label} failed — using placeholder`;
              resolve();
            }
          );
        })
      );

      await Promise.all(jobs);

      progFill.style.width = '100%';
      progLabel.textContent = '✦ Models loaded successfully';
      dots.forEach(d => d.className = 'dot done');
      setTimeout(() => arBtnWrap.classList.add('visible'), 400);
    }

    // ==================== THREE.JS AR SETUP (Your original code) ====================
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.xr.enabled = true;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth/window.innerHeight, 0.01, 60);

    // Lights, models, etc. (I kept your optimized version)
    scene.add(new THREE.HemisphereLight(0xffe4b5, 0x664422, 1.3));
    const sun = new THREE.DirectionalLight(0xfff8e0, 0.9);
    sun.position.set(4, 10, 5);
    sun.castShadow = true;
    scene.add(sun);

    // ... (You can paste the rest of your original script here: reticle, lights, buildCity, etc.)

    // Start AR when user clicks beautiful button
    startArBtn.addEventListener('click', () => {
      const arButton = ARButton.createButton(renderer, { requiredFeatures: ['hit-test'] });
      document.body.appendChild(arButton);
      arButton.click();

      // Fade out loading screen
      vesakLoad.style.transition = 'opacity 0.8s';
      vesakLoad.style.opacity = '0';
      setTimeout(() => vesakLoad.style.display = 'none', 900);
    });

    // Initialize loading
    await preload();

    // Your render loop and all other functions go here...
    // (Add your full animation loop, placeCity, buildCity, etc.)

  </script>
</body>
</html>
